name: Labeler

# pull_request_target is required: labeling fork PRs needs a write-scoped
# token, which pull_request does not provide. The called reusable workflow
# runs actions/labeler and a github-script step that reads the PR title from
# the event payload; it checks out and executes no untrusted PR code, so the
# usual pull_request_target risk does not apply here.
on: # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  labeler:
    uses: netresearch/.github/.github/workflows/labeler.yml@main
    permissions:
      contents: read
      pull-requests: write
