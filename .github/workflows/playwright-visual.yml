#
# Reusable "Playwright Visual Regression" — installs deps + Playwright and runs
# a visual-regression test command, optionally against a PREVIOUSLY BUILT site
# artifact (from pages-build.yml) so the site is not rebuilt. Keeps the pinned
# actions (checkout, setup-node, download-artifact, upload-artifact) central.
#
# The test command and Playwright config stay in the repo (test specs +
# webServer), so this leaf checks out the repo, installs, downloads the built
# site into `artifact-path` (where the Playwright webServer serves it) and runs
# the tests. Caller-supplied commands run via `bash -c "$VAR"`, never expanded
# into the run block.
#
# Caller pattern:
#
#   jobs:
#     build:
#       uses: netresearch/.github/.github/workflows/pages-build.yml@main
#       with: { build-command: ..., artifact-path: site/_site }
#     visual:
#       needs: build
#       uses: netresearch/.github/.github/workflows/playwright-visual.yml@main
#       permissions: { contents: read }
#       with:
#         working-directory: site
#         node-version-file: site/.nvmrc
#         artifact-name: github-pages-site
#         artifact-path: site/_site
#         test-command: npm run test:visual

name: Playwright Visual Regression (reusable)

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Directory to install and run tests in."
        required: false
        type: string
        default: "."
      node-version:
        description: "Node.js version (used when node-version-file is empty)."
        required: false
        type: string
        default: "22"
      node-version-file:
        description: "Path to a Node version file (.nvmrc). Takes precedence over node-version when set."
        required: false
        type: string
        default: ""
      install-command:
        description: "Dependency install command (run via bash -c in working-directory)."
        required: false
        type: string
        default: "npm ci"
      test-command:
        description: "Visual-regression test command (run via bash -c in working-directory)."
        required: false
        type: string
        default: "./node_modules/.bin/playwright test"
      browsers:
        description: "Playwright browsers to install (space-separated)."
        required: false
        type: string
        default: "chromium"
      artifact-name:
        description: "Optional built-site artifact to download before the tests. Empty = none."
        required: false
        type: string
        default: ""
      artifact-path:
        description: "Where to extract the built-site artifact (where the Playwright webServer serves it)."
        required: false
        type: string
        default: ""
      report-path:
        description: "Playwright report directory (relative to working-directory), uploaded on failure."
        required: false
        type: string
        default: "playwright-report"
      runs-on:
        description: "Runner label."
        required: false
        type: string
        default: "ubuntu-latest"

permissions: {}

jobs:
  visual:
    name: Visual Regression
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js (version file)
        if: ${{ inputs.node-version-file != '' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ inputs.node-version-file }}

      - name: Setup Node.js (version)
        if: ${{ inputs.node-version-file == '' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies
        working-directory: ${{ inputs.working-directory }}
        env:
          INSTALL_CMD: ${{ inputs.install-command }}
        run: bash -euo pipefail -c "$INSTALL_CMD"

      - name: Install Playwright browsers
        working-directory: ${{ inputs.working-directory }}
        env:
          BROWSERS: ${{ inputs.browsers }}
        # Use the locally installed binary (from the install step) rather than
        # npx, which could fetch a package on demand and run lifecycle scripts.
        run: |
          # shellcheck disable=SC2086
          ./node_modules/.bin/playwright install --with-deps $BROWSERS

      - name: Download built site
        if: ${{ inputs.artifact-name != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}

      - name: Run visual regression
        working-directory: ${{ inputs.working-directory }}
        env:
          TEST_CMD: ${{ inputs.test-command }}
          CI: "true"
        run: bash -euo pipefail -c "$TEST_CMD"

      - name: Upload report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: ${{ inputs.working-directory }}/${{ inputs.report-path }}
          retention-days: 14
