#
# Reusable "Build Container (Bake)" — bake-aware, multi-target container
# build / scan / sign for repos that drive their build with a
# docker-bake.hcl (phpbu-docker, moodle-docker, glpi-docker-compose-stack,
# docker-ftp-server).
#
# This is the multi-target sibling of `build-container.yml`. Where
# build-container.yml wraps a single docker/build-push-action call (one
# Dockerfile, one image, one digest), this workflow wraps docker/bake-action
# and builds every target the bake file defines in one pass, with a shared
# GHA cache and the tag fan-out computed *inside* the HCL (`variable` blocks
# + per-target `tags`). Scan and sign then enumerate the images bake
# produced by parsing `docker buildx bake --print`.
#
# Injecting build-time values (version, build date, git sha) into the HCL:
# HCL `variable` blocks are populated from the process environment, which a
# reusable workflow cannot receive from its caller directly. Use
# `pre-build-command` to compute them after checkout and export them to
# $GITHUB_ENV (they then persist into the bake, print, scan and sign steps),
# and/or `bake-set` to override target fields (tags, platforms, args). See
# the caller example at the bottom.
#
# Caller pattern (phpbu-docker build.yml — version from composer.lock):
#
#   jobs:
#     build:
#       uses: netresearch/.github/.github/workflows/build-container-bake.yml@main
#       permissions:
#         contents: read
#         packages: write
#         security-events: write
#         id-token: write
#       with:
#         targets: minimal,full
#         push: ${{ github.event_name != 'pull_request' }}
#         sign: true
#         attest: true
#         sbom: true
#         pre-build-command: |
#           V=$(jq -r '.packages[] | select(.name=="phpbu/phpbu") | .version' app/composer.lock)
#           {
#             echo "PHPBU_VERSION=$V"
#             echo "PHPBU_MINOR=$(echo "$V" | cut -d. -f1,2)"
#             echo "PHPBU_MAJOR=$(echo "$V" | cut -d. -f1)"
#             echo "BUILD_DATE=$(date -u +%Y-%m-%d)"
#             echo "GIT_SHA=$(git rev-parse --short HEAD)"
#           } >> "$GITHUB_ENV"
#
# Caller pattern (docker/metadata-action tag scheme — a `docker-metadata-action`
# target in the HCL that the generated tag/label bake files populate):
#
#   jobs:
#     build:
#       uses: netresearch/.github/.github/workflows/build-container-bake.yml@main
#       permissions:
#         contents: read
#         packages: write
#         security-events: write
#         id-token: write
#       with:
#         targets: app,app-e2e
#         push: ${{ github.event_name != 'pull_request' }}
#         bake-source: .                       # local checkout — metadata tags are local files
#         metadata-images: ghcr.io/${{ github.repository }}
#         metadata-tags: |
#           type=semver,pattern={{version}}
#           type=sha
#           type=raw,value=latest,enable={{is_default_branch}}
#
# Caller pattern (nightly security rebuild — cache MUST be off):
#
#   on:
#     schedule:
#       - cron: "38 4 * * *"     # pull fresh upstream base image + OS patches
#     push:
#       branches: [main]
#   jobs:
#     build:
#       uses: netresearch/.github/.github/workflows/build-container-bake.yml@main
#       with:
#         targets: app
#         # On a scheduled run the GHA layer cache would restore the previous
#         # layer chain and rebuild nothing, making the refresh a no-op.
#         cache: ${{ github.event_name != 'schedule' }}
#
# Caller pattern (opt-in SBOM generation + attestation — NRS-4588 phase 1):
#
# `sbom-attest: true` adds a downstream job per pushed image that builds the
# declared Composer SBOM (cyclonedx-php-composer, from composer.lock), the
# scanned image SBOM (Syft, against the pushed image@digest), merges both
# (cyclonedx-cli, hierarchical), stamps the image as BOM subject
# (pkg:oci/<image>@<digest>), validates, attaches the result as a Cosign
# CycloneDX attestation on the digest and uploads it as a workflow artifact.
# NOTE this is distinct from `sbom: true`, which only enables buildx's
# in-image SBOM attestation. The optional attest-sbom.yml pairing emits the
# GitHub-issued SBOM attestation on top; it is a separate reusable because
# it needs `attestations: write`, which THIS workflow must not require
# (see the attest-image.yml header for why).
#
#   jobs:
#     build:
#       uses: netresearch/.github/.github/workflows/build-container-bake.yml@main
#       permissions:
#         contents: read
#         packages: write
#         security-events: write
#         id-token: write
#       with:
#         targets: app
#         push: ${{ github.event_name != 'pull_request' }}
#         sign: true
#         sbom-attest: true
#
#     attest-sbom:
#       needs: build
#       uses: netresearch/.github/.github/workflows/attest-sbom.yml@main
#       permissions:
#         contents: read
#         packages: write
#         id-token: write
#         attestations: write
#       with:
#         bake-metadata: ${{ needs.build.outputs.bake-metadata }}

name: Build Container (Bake)

on:
  workflow_call:
    inputs:
      bake-file:
        description: "Path to the bake definition (docker/bake-action `files`). Repeat with newlines for multiple files."
        required: false
        type: string
        default: "docker-bake.hcl"
      bake-source:
        description: >-
          docker/bake-action `source` (build context root). Empty (default)
          keeps bake-action's own default, which in a checked-out repo is the
          git remote context (`<repo>.git#<ref>`). Set to `.` to build from
          the LOCAL checkout instead — REQUIRED when `metadata-images` is used
          or `pre-build-command` generates files, because their outputs are
          local temp files the git remote context cannot see.
        required: false
        type: string
        default: ""
      targets:
        description: "Comma- or newline-separated bake targets/groups to build. Empty = the bake file's `default` group."
        required: false
        type: string
        default: ""
      ref:
        description: "Git ref to checkout and build. Empty = the caller's github.ref."
        required: false
        type: string
        default: ""
      lfs:
        description: "Checkout Git LFS objects (actions/checkout `lfs`). Enable when the build context needs LFS-tracked files (assets, fixtures)."
        required: false
        type: boolean
        default: false
      platforms:
        description: "Comma-separated platforms. When set, overrides every target's platform via `--set *.platform=...`. Empty = use the platforms declared in the bake file."
        required: false
        type: string
        default: ""
      registry:
        description: "Container registry to log in to for push. The image *names* come from the bake file; this only controls the login host."
        required: false
        type: string
        default: "ghcr.io"
      push:
        description: "Push built images to the registry. Set false for validation-only builds (e.g. on pull_request)."
        required: false
        type: boolean
        default: true
      load:
        description: "Load built images into the local docker daemon. Required to scan on non-push (pull_request) runs, since Trivy then reads the local image. Ignored when push=true (registry images are scanned by ref)."
        required: false
        type: boolean
        default: false
      scan:
        description: "Run Trivy over the produced images (one scan per target, first tag) and upload SARIF. Requires push=true OR load=true so the image is resolvable."
        required: false
        type: boolean
        default: true
      trivy-severity:
        description: "Trivy severity filter."
        required: false
        type: string
        default: "CRITICAL,HIGH"
      sign:
        description: "Cosign keyless (OIDC) sign every tag bake produced. Requires push=true (signatures are written to the registry)."
        required: false
        type: boolean
        default: false
      attest:
        description: "Emit SLSA build provenance as a buildx in-image attestation (`provenance=mode=max`). This is the bake-native SLSA path — NOT actions/attest-build-provenance — because bake produces N images with N digests. Ignored when `provenance` is set explicitly. Requires push=true."
        required: false
        type: boolean
        default: false
      sbom:
        description: "Generate in-image SBOM for every target (docker/bake-action `sbom`). Requires push=true to be attached in the registry."
        required: false
        type: boolean
        default: false
      sbom-attest:
        description: >-
          Generate and attest a merged CycloneDX SBOM for every pushed image
          (NRS-4588 phase 1): declared Composer SBOM (cyclonedx-php-composer,
          skipped when the repo has no composer manifest) + scanned image SBOM
          (Syft) are merged with cyclonedx-cli, stamped with the image digest
          as BOM subject, validated, attached to the digest as a Cosign
          CycloneDX attestation (keyless OIDC) and uploaded as workflow
          artifact `sbom-<digest-hex>`. Distinct from `sbom`, which is
          buildx's in-image SBOM. Requires push=true; combine with
          `sign: true` for image signatures, and with the attest-sbom.yml
          pairing (see caller pattern) for the GitHub-issued attestation.
        required: false
        type: boolean
        default: false
      sbom-composer-file:
        description: >-
          Path to the composer manifest the declared SBOM (sbom-attest) is
          built from, relative to the repo root. The composer.lock NEXT TO
          this file is the source of truth — commit it; when it is missing,
          the job resolves one ad hoc via `composer update --no-install`
          (using the COMPOSER_AUTH secret when provided), which is slower and
          not reproducible. When the file itself does not exist, the declared
          SBOM is skipped and the scanned image SBOM alone is attested.
        required: false
        type: string
        default: "composer.json"
      provenance:
        description: "Explicit buildx provenance mode passed to docker/bake-action `provenance` (e.g. 'mode=max', 'false'). When set, takes precedence over `attest`. Empty = derive from `attest`."
        required: false
        type: string
        default: ""
      cache:
        description: >-
          Use the GitHub Actions layer cache (`cache-from`/`cache-to=type=gha`).
          Set to false for scheduled rebuilds that exist to pull fresh upstream
          base images and OS patches: with `cache-from` those runs restore the
          previous layer chain and rebuild nothing, silently turning a security
          refresh into a no-op. Typical use: pass an expression comparing
          `github.event_name` against `schedule` (see the caller example in
          the header).
        required: false
        type: boolean
        default: true
      cache-scope:
        description: "Optional GHA cache scope suffix. Set when parallel matrix calls share targets but must keep separate caches. Empty = one shared cache. Ignored when `cache` is false."
        required: false
        type: string
        default: ""
      bake-set:
        description: "Extra newline-separated bake `--set` overrides (KEY=VALUE), forwarded verbatim to docker/bake-action `set`. Use for target-field overrides the HCL does not expose as env variables (e.g. `minimal.tags=...`, `*.args.FOO=bar`). Applied on top of the reusable's cache/platform overrides."
        required: false
        type: string
        default: ""
      pre-build-command:
        description: "Shell command(s) run after checkout and before bake. Primary use: compute build-time values and export them to $GITHUB_ENV so the HCL `variable` blocks pick them up (version, BUILD_DATE, GIT_SHA)."
        required: false
        type: string
        default: ""
      metadata-images:
        description: >-
          Image name(s) for docker/metadata-action (newline-separated), e.g.
          `ghcr.io/<owner>/<repo>`. When set, metadata-action runs
          and the tag + label bake files it generates are appended to
          `bake-file`, populating a `docker-metadata-action` target in the HCL
          (the semver / branch / sha / latest tag fan-out). Empty (default) =
          metadata-action is NOT run and tags come solely from the HCL — the
          existing behavior, unchanged.
        required: false
        type: string
        default: ""
      metadata-tags:
        description: >-
          docker/metadata-action `tags:` configuration (newline-separated
          `type=...` lines). Only consulted when `metadata-images` is set.
        required: false
        type: string
        default: ""
      metadata-flavor:
        description: >-
          docker/metadata-action `flavor:` configuration (newline-separated,
          e.g. `latest=false`). Only consulted when `metadata-images` is set.
          Note that supplying an explicit tag list leaves flavor at its default
          `latest=auto`, which appends `latest` on a tag push - so a tag list
          that already contains an explicit raw `latest` will emit it twice
          unless you pass `latest=false` here.
        required: false
        type: string
        default: ""
    secrets:
      COMPOSER_AUTH:
        description: >-
          Optional Composer auth JSON forwarded to the bake build as the
          COMPOSER_AUTH env var, so the build can resolve private composer
          sources (e.g. github-oauth + git.netresearch.de http-basic). The
          caller assembles the JSON and may interpolate github.actor,
          secrets.GITHUB_TOKEN and any private-registry token. Empty when
          unset - the previous behavior.
        required: false
    outputs:
      bake-metadata:
        description: "Raw docker/bake-action metadata JSON (per-target build results incl. containerimage.digest)."
        value: ${{ jobs.bake.outputs.metadata }}
      sbom-subjects:
        description: "JSON array of {name, digest, hex} per pushed image (sbom-attest: true only). Secret-free — safe to feed to attest-sbom.yml, unlike raw bake metadata, which GitHub masks away wholesale when it matches a secret."
        value: ${{ jobs.bake.outputs.sbom-subjects }}
      tags:
        description: "Newline-separated list of all image tags bake produced (from `bake --print`). Empty when the print step is skipped."
        value: ${{ jobs.bake.outputs.tags }}

# Write scopes live on the jobs (both declare explicit permission blocks);
# keeping the workflow level read-only satisfies least privilege (S8233).
permissions:
  contents: read

jobs:
  bake:
    name: Build Container (Bake)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
    outputs:
      metadata: ${{ steps.bake.outputs.metadata }}
      tags: ${{ steps.images.outputs.tags }}
      sbom-subjects: ${{ steps.sbomsubjects.outputs.subjects }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          lfs: ${{ inputs.lfs }}
          persist-credentials: false

      - name: Run pre-build command
        if: inputs.pre-build-command != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRE_BUILD_CMD: ${{ inputs.pre-build-command }}
        run: |
          set -euo pipefail
          echo "::group::pre-build-command"
          bash -euo pipefail -c "$PRE_BUILD_CMD"
          echo "::endgroup::"

      - name: Docker metadata (tags/labels)
        id: meta
        if: inputs.metadata-images != ''
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ inputs.metadata-images }}
          tags: ${{ inputs.metadata-tags }}
          flavor: ${{ inputs.metadata-flavor }}

      - name: Compose bake files
        id: files
        env:
          BAKE_FILE: ${{ inputs.bake-file }}
          META_TAGS: ${{ steps.meta.outputs.bake-file-tags }}
          META_LABELS: ${{ steps.meta.outputs.bake-file-labels }}
        run: |
          set -euo pipefail
          # Start from the caller's bake file(s); when docker/metadata-action
          # ran (metadata-images set) append the tag + label bake files it
          # generated, so the HCL's `docker-metadata-action` target is
          # populated. When metadata is unused both are empty → just the
          # caller's bake-file, i.e. the previous behavior.
          {
            echo 'files<<EOM'
            printf '%s\n' "$BAKE_FILE"
            if [[ -n "$META_TAGS" ]]; then printf '%s\n' "$META_TAGS"; fi
            if [[ -n "$META_LABELS" ]]; then printf '%s\n' "$META_LABELS"; fi
            echo 'EOM'
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Compose bake --set overrides
        id: bakeset
        env:
          PLATFORMS: ${{ inputs.platforms }}
          CACHE_SCOPE: ${{ inputs.cache-scope }}
          CACHE: ${{ inputs.cache }}
          EXTRA_SET: ${{ inputs.bake-set }}
        run: |
          set -euo pipefail
          SCOPE_SUFFIX=""
          if [[ -n "$CACHE_SCOPE" ]]; then
            SCOPE_SUFFIX=",scope=${CACHE_SCOPE}"
          fi
          {
            echo 'set<<EOM'
            # cache=false omits cache-from entirely so the build cannot be
            # satisfied from a previous run's layers. Required for scheduled
            # rebuilds whose whole purpose is to pick up fresh upstream base
            # images and OS patches - with cache-from those runs restore the
            # old layer chain and rebuild nothing.
            if [[ "$CACHE" == "true" ]]; then
              echo "*.cache-from=type=gha${SCOPE_SUFFIX}"
              echo "*.cache-to=type=gha,mode=max${SCOPE_SUFFIX}"
            fi
            if [[ -n "$PLATFORMS" ]]; then
              echo "*.platform=${PLATFORMS}"
            fi
            if [[ -n "$EXTRA_SET" ]]; then
              printf '%s\n' "$EXTRA_SET"
            fi
            echo 'EOM'
          } >> "$GITHUB_OUTPUT"

      - name: Resolve attestation modes
        id: prov
        env:
          PROVENANCE: ${{ inputs.provenance }}
          ATTEST: ${{ inputs.attest }}
          SBOM: ${{ inputs.sbom }}
          PUSH: ${{ inputs.push }}
        run: |
          set -euo pipefail
          if [[ "$PUSH" != "true" ]]; then
            # No registry push (validation / --load): the docker exporter used
            # by --load cannot attach attestations, and a bake file may hardcode
            # provenance/sbom per target. Force them OFF explicitly — an empty
            # value does NOT override a bake-file attest declaration, but
            # "false" does — so callers can pass attest/sbom: true
            # unconditionally and PR/validation builds still succeed.
            MODE="false"
            SBOM_OUT="false"
          elif [[ -n "$PROVENANCE" ]]; then
            MODE="$PROVENANCE"
            SBOM_OUT="$SBOM"
          elif [[ "$ATTEST" == "true" ]]; then
            MODE="mode=max"
            SBOM_OUT="$SBOM"
          else
            MODE=""
            SBOM_OUT="$SBOM"
          fi
          {
            echo "mode=${MODE}"
            echo "sbom=${SBOM_OUT}"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to ${{ inputs.registry }}
        if: inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build with Bake
        id: bake
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        env:
          # Forwarded to the build so HCL/Dockerfile can auth private composer /
          # registry sources. Empty when the caller passes no COMPOSER_AUTH.
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
        with:
          source: ${{ inputs.bake-source }}
          files: ${{ steps.files.outputs.files }}
          targets: ${{ inputs.targets }}
          set: ${{ steps.bakeset.outputs.set }}
          push: ${{ inputs.push }}
          load: ${{ inputs.load }}
          sbom: ${{ steps.prov.outputs.sbom }}
          provenance: ${{ steps.prov.outputs.mode }}

      - name: Collect SBOM subjects
        id: sbomsubjects
        if: inputs.sbom-attest && inputs.push
        env:
          BAKE_METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          set -euo pipefail
          # One subject per pushed image: the image name WITHOUT a tag (SBOMs
          # are bound to the digest, not to a tag) plus the digest buildx
          # reported. Same shape attest-image.yml derives from bake-metadata.
          subjects=$(printf '%s' "$BAKE_METADATA" | jq -c '
            [ to_entries[]
              # bake metadata mixes per-target objects with non-object keys
              # (e.g. warning arrays) — indexing those with a string throws
              | select((.value | type) == "object")
              | select(.value["containerimage.digest"] != null)
              | { name: ( .value["image.name"] // "" | split(",")[0] | sub(":[^:/]+$"; "") )
                , digest: .value["containerimage.digest"]
                , hex: ( .value["containerimage.digest"] | sub("^sha256:"; "") )
                }
              | select(.name != "")
            ] | unique')
          count=$(printf '%s' "$subjects" | jq 'length')
          if [ "$count" = "0" ]; then
            echo "::error::sbom-attest is enabled but bake reported no pushed image digests."
            exit 1
          fi
          echo "Generating SBOMs for $count image(s):"
          printf '%s' "$subjects" | jq -r '.[] | "  " + .name + "@" + .digest'
          echo "subjects=$subjects" >> "$GITHUB_OUTPUT"

      - name: Enumerate produced images
        id: images
        if: inputs.scan || inputs.sign
        env:
          BAKE_FILE: ${{ steps.files.outputs.files }}
          TARGETS: ${{ inputs.targets }}
          SET_LINES: ${{ steps.bakeset.outputs.set }}
        run: |
          set -euo pipefail
          # Rebuild the --set flag list (tags can be overridden via bake-set,
          # so the print must use the same overrides the build used).
          SET_ARGS=()
          while IFS= read -r line; do
            [[ -n "$line" ]] && SET_ARGS+=(--set "$line")
          done <<< "$SET_LINES"
          FILE_ARGS=()
          while IFS= read -r f; do
            [[ -n "$f" ]] && FILE_ARGS+=(-f "$f")
          done <<< "$BAKE_FILE"
          # shellcheck disable=SC2206
          TARGET_ARGS=(${TARGETS//,/ })
          PRINT=$(docker buildx bake "${FILE_ARGS[@]}" "${TARGET_ARGS[@]}" "${SET_ARGS[@]}" --print)
          # All tags (for signing) and one ref per target (for scanning).
          SIGN_TAGS=$(echo "$PRINT" | jq -r '.target | to_entries[] | .value.tags[]?' | sort -u)
          SCAN_REFS=$(echo "$PRINT" | jq -r '.target | to_entries[] | .value.tags[0] // empty' | sort -u)
          {
            echo 'tags<<EOM'
            echo "$SIGN_TAGS"
            echo 'EOM'
            echo 'scan_refs<<EOM'
            echo "$SCAN_REFS"
            echo 'EOM'
          } >> "$GITHUB_OUTPUT"

      - name: Install Trivy
        if: inputs.scan && (inputs.push || inputs.load)
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          # Pin the Trivy CLI version (setup-trivy defaults to "latest",
          # which zizmor flags as an unpinned external tool).
          version: v0.74.0

      - name: Scan images with Trivy
        id: trivy
        if: inputs.scan && (inputs.push || inputs.load)
        env:
          SCAN_REFS: ${{ steps.images.outputs.scan_refs }}
          SEVERITY: ${{ inputs.trivy-severity }}
        run: |
          set -euo pipefail
          mkdir -p trivy-results
          i=0
          while IFS= read -r ref; do
            [[ -z "$ref" ]] && continue
            i=$((i + 1))
            echo "::group::Trivy $ref"
            # Report-only (no exit-code): findings surface via SARIF/code-scanning,
            # they do not fail the build — matches build-container.yml.
            trivy image \
              --format sarif \
              --output "trivy-results/scan-${i}.sarif" \
              --severity "$SEVERITY" \
              --scanners vuln,secret \
              "$ref"
            # Give each image's SARIF a distinct category (automationDetails.id).
            # codeql-action/upload-sarif rejects multiple runs sharing one
            # category, which happens when more than one target is scanned.
            tmp="$(mktemp)"
            jq --arg cat "container-scan-${i}" \
              '.runs[].automationDetails.id = $cat' \
              "trivy-results/scan-${i}.sarif" > "$tmp"
            mv "$tmp" "trivy-results/scan-${i}.sarif"
            echo "::endgroup::"
          done <<< "$SCAN_REFS"
          echo "count=${i}" >> "$GITHUB_OUTPUT"

      - name: Upload Trivy results to GitHub Security
        # Skip on merge_group: the gh-readonly-queue ref is deleted the moment
        # the merge completes, racing codeql-action/upload-sarif into a
        # guaranteed `ref ... not found` failure. Push/PR runs have stable refs.
        #
        # Skip on FORK pull requests for the same reason its sibling
        # build-container.yml does: GitHub issues a read-only GITHUB_TOKEN for
        # `pull_request` runs from a fork whatever the caller granted, so
        # `security-events: write` is not effective and the upload 403s. This
        # workflow is already driven on pull_request with load=true by
        # phpbu-docker, so the fork path is reachable today.
        if: >-
          inputs.scan
          && (inputs.push || inputs.load)
          && github.event_name != 'merge_group'
          && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
          && steps.trivy.outputs.count != '0'
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          # No `category` here: each SARIF carries its own distinct category
          # (automationDetails.id set in the scan step) so multi-target scans
          # don't collide.
          sarif_file: "trivy-results"

      - name: Install Cosign
        if: inputs.sign && inputs.push
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign images with Cosign (keyless OIDC)
        if: inputs.sign && inputs.push
        env:
          BAKE_METADATA: ${{ steps.bake.outputs.metadata }}
          SIGN_TAGS: ${{ steps.images.outputs.tags }}
        run: |
          set -euo pipefail

          # Rekor answers a *retried* upload with 409 "an equivalent entry
          # already exists": the first POST did land, the client gave up on a
          # slow response and re-sent the identical bundle, and the second
          # attempt sees its own entry. The signature is in the transparency
          # log, so that is success. Anything else gets a bounded retry —
          # sigstore.dev is a public service and a single hiccup must not
          # discard an otherwise good build.
          cosign_retry() {
            local attempt=1 max=4 out rc
            while :; do
              rc=0
              out=$("$@" 2>&1) || rc=$?
              printf '%s\n' "$out"
              [[ $rc -eq 0 ]] && return 0
              if [[ "$out" == *"an equivalent entry already exists"* ]]; then
                echo "Rekor already holds this entry — treating as signed."
                return 0
              fi
              if [[ $attempt -ge $max ]]; then
                return "$rc"
              fi
              echo "Attempt ${attempt}/${max} failed (exit ${rc}); retrying in $((attempt * 15))s"
              sleep $((attempt * 15))
              attempt=$((attempt + 1))
            done
          }

          # Sign by digest, not by tag — the convention build-container.yml
          # already follows. Bake fans one image out over many tags (16 tags
          # over 2 digests in phpbu-docker), and `cosign sign <tag>` resolves
          # the tag to that digest anyway, writing to the same
          # `sha256-<digest>.sig` object. Signing every tag therefore uploads
          # the same artifact to Rekor once per tag: redundant signatures and
          # N times the exposure to a transparency-log failure, for no added
          # coverage. `cosign verify <tag>` keeps working either way.
          REFS=$(printf '%s' "$BAKE_METADATA" | jq -r '
            [ to_entries[]
              # bake metadata mixes per-target objects with non-object keys
              # (e.g. warning arrays) — indexing those with a string throws
              | select((.value | type) == "object")
              | select(.value["containerimage.digest"] != null)
              | { name: ( .value["image.name"] // "" | split(",")[0] | sub(":[^:/]+$"; "") )
                , digest: .value["containerimage.digest"]
                }
              | select(.name != "")
              | .name + "@" + .digest
            ] | unique | .[]')
          if [[ -z "$REFS" ]]; then
            echo "::error::sign is enabled but bake reported no pushed image digests."
            exit 1
          fi

          echo "Tags pointing at these digests:"
          printf '%s\n' "$SIGN_TAGS" | sed '/^$/d; s/^/  /'
          while IFS= read -r ref; do
            [[ -z "$ref" ]] && continue
            echo "Signing $ref"
            cosign_retry cosign sign --yes "$ref"
          done <<< "$REFS"

  # Opt-in SBOM path (NRS-4588 phase 1). One matrix leg per pushed image.
  # Deliberately requests ONLY scopes the bake job already declares
  # (contents/packages/id-token) — a called job's permissions are validated
  # statically at startup, so requiring `attestations: write` here would
  # startup_failure every existing caller. The GitHub-issued SBOM
  # attestation therefore lives in the separate attest-sbom.yml pairing.
  sbom:
    name: SBOM ${{ matrix.subject.name }}
    needs: bake
    if: inputs.sbom-attest && inputs.push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        subject: ${{ fromJSON(needs.bake.outputs.sbom-subjects || '[]') }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Log in to ${{ inputs.registry }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate declared Composer SBOM (cyclonedx-php-composer)
        id: appbom
        env:
          # Version pin matches the NRS-4586 sbom-toolbox image.
          CDX_PHP_COMPOSER_VERSION: "6.2.0"
          COMPOSER_FILE: ${{ inputs.sbom-composer-file }}
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/sbom"
          if [[ ! -f "$COMPOSER_FILE" ]]; then
            echo "::notice::No composer manifest at ${COMPOSER_FILE} — skipping the declared Composer SBOM, the scanned image SBOM alone is attested."
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          composer global config --no-plugins \
            allow-plugins.cyclonedx/cyclonedx-php-composer true
          # S8546 suppression: an ephemeral global tool install has no
          # lockfile to enforce; the exact version pin is the strongest
          # available constraint.
          composer global require --no-interaction --no-progress "cyclonedx/cyclonedx-php-composer:${CDX_PHP_COMPOSER_VERSION}" # NOSONAR
          dir=$(dirname "$COMPOSER_FILE")
          base=$(basename "$COMPOSER_FILE")
          if [[ ! -f "${dir}/composer.lock" ]]; then
            echo "::warning::No composer.lock next to ${COMPOSER_FILE} — resolving one ad hoc. Commit the lockfile to make the declared SBOM reproducible."
            # --no-scripts/--no-plugins: never execute code from the
            # checked-out tree, this job only needs the dependency graph.
            (cd "$dir" && COMPOSER="$base" composer update --no-install \
              --no-progress --no-interaction --no-scripts --no-plugins \
              --no-audit)
          fi
          (cd "$dir" && COMPOSER="$base" composer CycloneDX:make-sbom \
            --output-format=JSON \
            --spec-version=1.6 \
            --omit=dev \
            --omit=plugin \
            --output-reproducible \
            --output-file="${RUNNER_TEMP}/sbom/sbom-app.cdx.json")
          echo "present=true" >> "$GITHUB_OUTPUT"

      # Two attempts, because the action downloads Syft at run time and that
      # download is not reliable. It failed twice in one evening on
      # netresearch/typo3-demo, and each failure cost a deployment: this job
      # failing skips `validate`, and Deploy triggers on the Build workflow
      # concluding success. The container itself had built fine both times —
      # only the inventory of it was missing.
      #
      # continue-on-error plus a guarded repeat rather than a retry action: no
      # new dependency to pin and audit, and the second attempt is visible as
      # its own step in the run.
      - name: Generate scanned image SBOM (Syft)
        id: syft
        continue-on-error: true
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        env:
          # No file cataloguing. Syft's default emits one component per file
          # owned by an installed package. Measured on the netresearch.de stack
          # BOM: 15426 of 16337 components were such entries, all under /usr
          # and /etc, none carrying a purl and therefore none able to match an
          # advisory — they inflated the BOM to 15 MB and buried the ~900
          # components findings actually attach to. Nothing is lost: the BOM
          # records the image digest, so a file inventory can be regenerated
          # from the image whenever a question calls for one. Same setting as
          # sbom-toolbox collect-stack-boms (ADR 0010).
          SYFT_FILE_METADATA_SELECTION: none
        with:
          image: ${{ matrix.subject.name }}@${{ matrix.subject.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/sbom/sbom-image.cdx.json
          upload-artifact: false

      - name: Wait before the second Syft attempt
        if: steps.syft.outcome == 'failure'
        # The failure being retried is an HTTP 503 from github.com, which
        # routinely lasts longer than the seconds a bare repeat would wait —
        # both attempts would then land inside the same blip and the deployment
        # is lost anyway. cosign_retry further down uses 15/30/45s for the same
        # reason; one wait is enough here because a second failure is rare
        # enough to be worth a human look.
        run: sleep 30

      - name: Generate scanned image SBOM (Syft, second attempt)
        if: steps.syft.outcome == 'failure'
        # Keep env and with identical to the first attempt. Dropping
        # SYFT_FILE_METADATA_SELECTION here would produce the per-file BOM the
        # comment above exists to prevent, and only on the rare retry path.
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        env:
          SYFT_FILE_METADATA_SELECTION: none
        with:
          image: ${{ matrix.subject.name }}@${{ matrix.subject.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/sbom/sbom-image.cdx.json
          upload-artifact: false

      - name: Merge SBOMs, set OCI subject, validate (cyclonedx-cli)
        env:
          # cyclonedx-cli publishes no checksum file; sha256 recorded at pin
          # time (matches the NRS-4586 sbom-toolbox image).
          CDX_CLI_VERSION: "0.33.1"
          CDX_CLI_SHA256: "bfc8b2538da86fe239bc53658bbb63c1c8c510a293c1e6891aa5bea5d3c58746"
          APP_PRESENT: ${{ steps.appbom.outputs.present }}
          IMAGE_NAME: ${{ matrix.subject.name }}
          DIGEST: ${{ matrix.subject.digest }}
          DIGEST_HEX: ${{ matrix.subject.hex }}
        run: |
          set -euo pipefail
          curl --proto '=https' --proto-redir '=https' -fsSL \
            -o "${RUNNER_TEMP}/cyclonedx" \
            "https://github.com/CycloneDX/cyclonedx-cli/releases/download/v${CDX_CLI_VERSION}/cyclonedx-linux-x64"
          echo "${CDX_CLI_SHA256}  ${RUNNER_TEMP}/cyclonedx" | sha256sum -c -
          chmod +x "${RUNNER_TEMP}/cyclonedx"
          cd "${RUNNER_TEMP}/sbom"
          out="sbom-${DIGEST_HEX}.cdx.json"
          purl="pkg:oci/${IMAGE_NAME}@${DIGEST}"
          # Stamp the scanned BOM BEFORE merging. `merge --hierarchical` nests
          # each input's metadata.component as a child, and Syft's carries no
          # purl — so stamping only the merged result left the image listed
          # twice downstream, once identified and once not. Dependency-Track
          # showed both, which reads like two different things.
          tmp=$(mktemp)
          jq \
            --arg name "$IMAGE_NAME" \
            --arg version "$DIGEST" \
            --arg purl "$purl" \
            --arg hash "$DIGEST_HEX" \
            '.metadata.component = {
                "bom-ref": $purl,
                type: "container",
                name: $name,
                version: $version,
                purl: $purl,
                hashes: [ { alg: "SHA-256", content: $hash } ]
            }' sbom-image.cdx.json > "$tmp"
          mv "$tmp" sbom-image.cdx.json
          if [[ "$APP_PRESENT" == "true" ]]; then
            "${RUNNER_TEMP}/cyclonedx" merge --hierarchical \
              --input-files sbom-app.cdx.json sbom-image.cdx.json \
              --output-file "$out" --output-format json \
              --name "$IMAGE_NAME" --version "$DIGEST"
          else
            cp sbom-image.cdx.json "$out"
          fi
          # The digest is the anchor, never a tag resolution: stamp the image
          # as the BOM subject (same shape as sbom-toolbox set-bom-subject).
          tmp=$(mktemp)
          jq \
            --arg name "$IMAGE_NAME" \
            --arg version "$DIGEST" \
            --arg purl "$purl" \
            --arg hash "$DIGEST_HEX" \
            '.metadata.component = {
                "bom-ref": $purl,
                type: "container",
                name: $name,
                version: $version,
                purl: $purl,
                hashes: [ { alg: "SHA-256", content: $hash } ]
            }' "$out" > "$tmp"
          mv "$tmp" "$out"
          "${RUNNER_TEMP}/cyclonedx" validate --fail-on-errors \
            --input-format json --input-file "$out"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Attest SBOM with Cosign (keyless OIDC)
        env:
          IMAGE_NAME: ${{ matrix.subject.name }}
          DIGEST: ${{ matrix.subject.digest }}
          DIGEST_HEX: ${{ matrix.subject.hex }}
        run: |
          set -euo pipefail

          # Same Rekor failure mode the sign step guards against: a retried
          # upload can meet its own first attempt as a 409, and the public
          # log occasionally stalls. See the comment there for the reasoning.
          cosign_retry() {
            local attempt=1 max=4 out rc
            while :; do
              rc=0
              out=$("$@" 2>&1) || rc=$?
              printf '%s\n' "$out"
              [[ $rc -eq 0 ]] && return 0
              if [[ "$out" == *"an equivalent entry already exists"* ]]; then
                echo "Rekor already holds this entry — treating as attested."
                return 0
              fi
              if [[ $attempt -ge $max ]]; then
                return "$rc"
              fi
              echo "Attempt ${attempt}/${max} failed (exit ${rc}); retrying in $((attempt * 15))s"
              sleep $((attempt * 15))
              attempt=$((attempt + 1))
            done
          }

          cosign_retry cosign attest --yes --type cyclonedx \
            --predicate "${RUNNER_TEMP}/sbom/sbom-${DIGEST_HEX}.cdx.json" \
            "${IMAGE_NAME}@${DIGEST}"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.subject.hex }}
          path: ${{ runner.temp }}/sbom/
          if-no-files-found: error
