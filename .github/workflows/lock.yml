name: Lock Threads

on:
  workflow_call:
    inputs:
      issue-inactive-days:
        description: 'Days before locking inactive issues'
        required: false
        type: number
        default: 365
      pr-inactive-days:
        description: 'Days before locking inactive PRs'
        required: false
        type: number
        default: 365
      issue-lock-reason:
        description: 'Reason for locking issues'
        required: false
        type: string
        default: 'resolved'
      pr-lock-reason:
        description: 'Reason for locking PRs'
        required: false
        type: string
        default: 'resolved'
      log-output:
        description: 'Log processed threads'
        required: false
        type: boolean
        default: true

# CALLER REQUIREMENTS
# ===================
# When calling this reusable workflow, the caller's job-level
# `permissions:` block MUST grant at least this full set, otherwise
# the run fails with `startup_failure` before any job executes
# (GitHub rejects the workflow at startup when the reusable declares
# a permission the caller did not grant). NOTE: setting ANY scope in a
# `permissions:` block forces every UNLISTED scope to `none`, and a job
# that omits `permissions:` inherits the repository default
# (default_workflow_permissions) — so a repo hardened to `read` will
# startup-fail here unless these scopes are granted explicitly.
#
#   jobs:
#     lock:
#       uses: netresearch/.github/.github/workflows/lock.yml@main
#       permissions:
#         issues: write
#         pull-requests: write
permissions: {}

jobs:
  lock:
    name: Lock Old Threads
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: dessant/lock-threads@89ae32b08ed1a541efecbab17912962a5e38981c # v6.0.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          issue-inactive-days: ${{ inputs.issue-inactive-days }}
          issue-lock-reason: ${{ inputs.issue-lock-reason }}
          pr-inactive-days: ${{ inputs.pr-inactive-days }}
          pr-lock-reason: ${{ inputs.pr-lock-reason }}
          log-output: ${{ inputs.log-output }}
