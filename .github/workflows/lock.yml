name: Lock Threads

on:
  workflow_call:
    inputs:
      issue-inactive-days:
        description: 'Days before locking inactive issues'
        required: false
        type: number
        default: 365
      pr-inactive-days:
        description: 'Days before locking inactive PRs'
        required: false
        type: number
        default: 365
      issue-lock-reason:
        description: 'Reason for locking issues'
        required: false
        type: string
        default: 'resolved'
      pr-lock-reason:
        description: 'Reason for locking PRs'
        required: false
        type: string
        default: 'resolved'
      log-output:
        description: 'Log processed threads'
        required: false
        type: boolean
        default: true

permissions: {}

jobs:
  lock:
    name: Lock Old Threads
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: dessant/lock-threads@89ae32b08ed1a541efecbab17912962a5e38981c # v6.0.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          issue-inactive-days: ${{ inputs.issue-inactive-days }}
          issue-lock-reason: ${{ inputs.issue-lock-reason }}
          pr-inactive-days: ${{ inputs.pr-inactive-days }}
          pr-lock-reason: ${{ inputs.pr-lock-reason }}
          log-output: ${{ inputs.log-output }}
