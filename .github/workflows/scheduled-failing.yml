# Daily fleet-wide scan for scheduled workflows whose last runs keep failing.
# Opens or updates one issue per repository in netresearch/.github and closes
# it once a scheduled run of each workflow succeeds again.
#
# A scheduled run has no pull request and no author, so a red one tells no
# one. ofelia's weekly mutation run hit the 2-hour job limit on four schedules
# in a row (2026-10-25 to 2026-11-15) and reported no score unnoticed. The
# issues land next to the drift and Renovate ones, which are already triaged.
#
# GITHUB_TOKEN reads public repositories only, so private repositories are not
# scanned.
#
# This is a monitoring workflow — informational only, it does not block any PR.

name: Scheduled Runs Failing Scan

on:
  schedule:
    # Daily 06:45 UTC, after renovate-stuck's 06:30 slot.
    - cron: "45 6 * * *"
  workflow_dispatch:
    inputs:
      runs:
        description: "Number of consecutive red scheduled runs before a workflow is reported."
        required: false
        type: number
        default: 2

permissions: {}

jobs:
  scan:
    name: Scan scheduled workflow runs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Open, update or close issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUNS: ${{ inputs.runs || 2 }}
        run: python3 scripts/scheduled-failing.py --runs "$RUNS"
