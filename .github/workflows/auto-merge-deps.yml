name: Auto-merge dependency PRs

on:
  pull_request:
  workflow_call:
    inputs:
      safe-updates-only:
        description: >-
          When true, only auto-merge safe updates (semver minor/patch for
          Dependabot, or Docker non-major bumps). Majors are approved but
          left for a human to merge. Renovate is always trusted — its own
          config (renovate.json) decides what it opens.
        type: boolean
        default: false
      merge-strategy:
        description: >-
          Override the merge strategy. One of "squash", "merge", "rebase",
          or "" (default) to auto-detect from repo settings. Use this when
          the repo has `required_linear_history` or other constraints the
          auto-detector can't see.
        type: string
        default: ""
      allow-release-please:
        description: >-
          When true, ALSO auto-merge release-please release PRs, i.e. PRs
          opened by `github-actions[bot]` from a `release-please--*` branch
          in this same repository that carry the `autorelease: pending`
          label. Those PRs are deliberately NOT approved by this workflow:
          GITHUB_TOKEN cannot approve a PR opened by `github-actions[bot]`
          (self-approval), so the approval has to come from elsewhere (a
          PAT-based approve step, e.g. in pr-quality.yml, or a human).
          Default false = dependabot + renovate only, unchanged.
          CALLER PREREQUISITE: release-please must open the PR with a PAT
          or GitHub App token, NOT the default GITHUB_TOKEN — GitHub does
          not emit pull_request/pull_request_target events for anything
          GITHUB_TOKEN creates, so with the default token this workflow is
          never triggered for the release PR at all. See the note in the
          CALLER REQUIREMENTS block below.
        type: boolean
        default: false

# CALLER REQUIREMENTS
# ===================
# When calling this reusable workflow, the caller's job-level
# `permissions:` block MUST grant at least this full set, otherwise
# the run fails with `startup_failure` before any job executes
# (GitHub rejects the workflow at startup when the reusable declares
# a permission the caller did not grant). NOTE: setting ANY scope in a
# `permissions:` block forces every UNLISTED scope to `none`, and a job
# that omits `permissions:` inherits the repository default
# (default_workflow_permissions) — so a repo hardened to `read` will
# startup-fail here unless these scopes are granted explicitly.
#
#   jobs:
#     auto-merge:
#       uses: netresearch/.github/.github/workflows/auto-merge-deps.yml@main
#       permissions:
#         contents: write
#         pull-requests: write
#
# Repos that also want their release-please PRs merged automatically opt in:
#
#   jobs:
#     auto-merge:
#       uses: netresearch/.github/.github/workflows/auto-merge-deps.yml@main
#       with:
#         allow-release-please: true
#       permissions:
#         contents: write
#         pull-requests: write
#
# `allow-release-please` HAS ONE CALLER-SIDE PREREQUISITE this reusable
# cannot satisfy on its own: release-please must open the release PR with a
# PAT or GitHub App token, not the default GITHUB_TOKEN.
#
#   jobs:
#     release-please:
#       steps:
#         - uses: googleapis/release-please-action@<sha>
#           with:
#             token: ${{ secrets.RELEASE_PLEASE_TOKEN }}   # <-- required
#
# Reason: GitHub deliberately does not emit pull_request /
# pull_request_target events for anything GITHUB_TOKEN creates, so a
# release PR opened with the default token triggers no workflow at all and
# there is nothing for this reusable to act on. Verified on
# netresearch/node-red-contrib-magento-eqp#339 (release-please PR opened
# 2026-02-17T01:02:54Z with the default GITHUB_TOKEN): zero
# pull_request_target runs — neither auto-merge nor PR Quality Gates fired.
#
# The `autorelease: pending` label is NOT part of the `opened` payload
# either: release-please adds it in a separate API call ~1s after creating
# the PR (netresearch/node-magento-eqp#466: created 11:48:21Z, labeled
# 11:48:22Z). This workflow therefore re-reads the labels live at run time
# instead of gating the job on `github.event.pull_request.labels`.
permissions: {}

jobs:
  auto-merge:
    name: Auto-merge dependency PRs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # `user.login`, not `actor`: the actor can change on synchronize/rerun.
    # The release-please arm only opens when the caller opts in via
    # `allow-release-please` — with the input unset it is `false`, so the
    # condition reduces to the original dependabot||renovate check.
    #
    # The `autorelease: pending` label is deliberately NOT checked here: it
    # is absent from the `opened` payload (added ~1s later by a separate API
    # call), so gating the job on it would restrict the arm to `synchronize`.
    # The label is verified live in the "Check release-please label" step and
    # enforced on the merge step. What IS checked here — same repository, and
    # release-please's `release-please--` branch prefix — is immutable for the
    # lifetime of the PR and narrows the arm well below "any
    # `github-actions[bot]` PR that someone labelled".
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' ||
      github.event.pull_request.user.login == 'renovate[bot]' ||
      (inputs.allow-release-please &&
       github.event.pull_request.user.login == 'github-actions[bot]' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'release-please--'))
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Approve PR
        # Skipped for `github-actions[bot]` (release-please) PRs: GITHUB_TOKEN
        # cannot approve a PR its own app opened, the API call would just fail.
        # Gated on the input as well as the author, so the job-level `if` is
        # not the single point of failure: a caller that did NOT opt in keeps
        # the unconditional approve it had before, and would fail loudly
        # rather than silently skip if such a PR ever reached this step.
        if: >-
          !inputs.allow-release-please ||
          github.event.pull_request.user.login != 'github-actions[bot]'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr review --approve "$PR_URL"

      - name: Dependabot metadata
        id: metadata
        if: inputs.safe-updates-only && github.event.pull_request.user.login == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check release-please label
        id: release-label
        # Live label read, because `github.event.pull_request.labels` is empty
        # on the `opened` event: release-please creates the PR first and adds
        # `autorelease: pending` in a separate API call about a second later.
        # By the time this runner starts, the label is there.
        if: >-
          inputs.allow-release-please &&
          github.event.pull_request.user.login == 'github-actions[bot]'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LABELS=$(gh pr view "$PR_URL" --json labels --jq '.labels[].name')
          if grep -qxF 'autorelease: pending' <<<"$LABELS"; then
            echo "is-release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-release=false" >> "$GITHUB_OUTPUT"
            echo "No 'autorelease: pending' label - not a release PR, nothing to merge."
          fi

      - name: Enable auto-merge
        # First clause: a `github-actions[bot]` PR is only merged when the
        # caller opted in AND the live label check above confirmed it is a
        # release-please release PR. Independent of the job-level `if`.
        # Second clause: `safe-updates-only` is a Dependabot semver gate; it
        # must not swallow release PRs (they have no dependabot metadata, so
        # every metadata clause would be false and the merge silently skipped).
        if: >-
          (github.event.pull_request.user.login != 'github-actions[bot]' ||
           (inputs.allow-release-please &&
            steps.release-label.outputs.is-release == 'true')) &&
          (!inputs.safe-updates-only ||
           github.event.pull_request.user.login == 'renovate[bot]' ||
           (inputs.allow-release-please &&
            github.event.pull_request.user.login == 'github-actions[bot]') ||
           steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
           steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
           (steps.metadata.outputs.package-ecosystem == 'docker' &&
            steps.metadata.outputs.update-type != 'version-update:semver-major'))
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          STRATEGY_OVERRIDE: ${{ inputs.merge-strategy }}
        run: |
          if [[ -n "$STRATEGY_OVERRIDE" ]]; then
            STRATEGY="--$STRATEGY_OVERRIDE"
          else
            STRATEGY=$(gh api "repos/$REPO" --jq '
              if .allow_squash_merge then "--squash"
              elif .allow_merge_commit then "--merge"
              elif .allow_rebase_merge then "--rebase"
              else "--squash" end')
          fi
          echo "Using merge strategy: $STRATEGY"
          gh pr merge --auto "$STRATEGY" "$PR_URL"
