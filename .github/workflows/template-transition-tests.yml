name: Template transition fixtures

on:
  pull_request:
    paths:
      - scripts/drift_compare.py
      - scripts/check-drift.sh
      - scripts/test_drift_compare.py
      - scripts/test_go_tool_build_cache.py
      - .github/actions/go-tool-build-cache/**
      - .github/workflows/go-check.yml
      - renovate.json
      - scripts/test_go_release_identity.py
      - .github/workflows/golib-create-release.yml
      - .github/workflows/release-go-app.yml
      - scripts/test_drift_compare_go.py
      - scripts/test_drift_compare_pins.py
      - scripts/fixtures/drift-pin-tolerance/**
      - scripts/requirements-drift-tests.txt
      - templates/typo3-extension/.github/workflows/checks.yml
      - templates/go-lib/.github/workflows/*.yml
      - templates/go-app/.github/workflows/*.yml
      - .github/workflows/template-transition-tests.yml
  push:
    branches: [main]
    paths:
      - scripts/drift_compare.py
      - scripts/check-drift.sh
      - scripts/test_drift_compare.py
      - scripts/test_go_tool_build_cache.py
      - .github/actions/go-tool-build-cache/**
      - .github/workflows/go-check.yml
      - renovate.json
      - scripts/test_go_release_identity.py
      - .github/workflows/golib-create-release.yml
      - .github/workflows/release-go-app.yml
      - scripts/test_drift_compare_go.py
      - scripts/test_drift_compare_pins.py
      - scripts/fixtures/drift-pin-tolerance/**
      - scripts/requirements-drift-tests.txt
      - templates/typo3-extension/.github/workflows/checks.yml
      - templates/go-lib/.github/workflows/*.yml
      - templates/go-app/.github/workflows/*.yml
      - .github/workflows/template-transition-tests.yml

permissions:
  contents: read

jobs:
  fixtures:
    name: Exact workflow transition fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the hash-pinned YAML test runtime
        run: >-
          python3 -m pip install --disable-pip-version-check --only-binary=:all:
          --require-hashes --target "$RUNNER_TEMP/drift-fixtures-python"
          -r scripts/requirements-drift-tests.txt
      - name: Compare both rollout directions and negative controls
        env:
          PYTHONPATH: ${{ runner.temp }}/drift-fixtures-python
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s scripts -p 'test_drift_compare*.py' -v
      - name: Check pinned Go tool cache boundaries without hosted cache access
        env:
          PYTHONPATH: ${{ runner.temp }}/drift-fixtures-python
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s scripts -p 'test_go_tool_build_cache.py' -v
      - name: Check Go release identity without publishing
        env:
          PYTHONPATH: ${{ runner.temp }}/drift-fixtures-python
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s scripts -p 'test_go_release_identity.py' -v
