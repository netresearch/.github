name: Create Go Library Release

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag (e.g., v1.10.0). Must match the triggering tag ref and commit, including manual dispatch."
        required: false
        type: string
        default: ""
      draft:
        description: "Create as draft release (recommended: true)"
        required: false
        type: boolean
        default: true
      generate-sbom:
        description: "Generate SBOM artifacts"
        required: false
        type: boolean
        default: true
      cosign-sign:
        description: "Sign checksums with Cosign (keyless / Sigstore)"
        required: false
        type: boolean
        default: true
      attest:
        description: "Generate GitHub artifact attestation for release assets"
        required: false
        type: boolean
        default: true

# CALLER REQUIREMENTS
# ===================
# When calling this reusable workflow, the caller's job-level
# `permissions:` block MUST grant at least this full set, otherwise
# the run fails with `startup_failure` before any job executes
# (GitHub rejects the workflow at startup when the reusable declares
# a permission the caller did not grant). NOTE: setting ANY scope in a
# `permissions:` block forces every UNLISTED scope to `none`, and a job
# that omits `permissions:` inherits the repository default
# (default_workflow_permissions) — so a repo hardened to `read` will
# startup-fail here unless these scopes are granted explicitly.
#
#   jobs:
#     test:
#       uses: netresearch/.github/.github/workflows/golib-create-release.yml@main
#       permissions:
#         attestations: write
#         contents: write
#         id-token: write
permissions: {}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      sha: ${{ steps.source.outputs.sha }}
      tag-object: ${{ steps.source.outputs.tag-object }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Bind release tag to event source
        id: source
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_REF_TYPE: ${{ github.ref_type }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$REF_NAME}"
          TAG_REF="refs/tags/$TAG"
          git check-ref-format "$TAG_REF"
          # Artifact provenance uses the event's OIDC ref/SHA, not checkout
          # HEAD. A manual run must therefore be dispatched at this exact tag.
          if [ "$EVENT_REF_TYPE" != "tag" ] || [ "$EVENT_REF" != "$TAG_REF" ]; then
            echo "::error::Run this workflow at the selected tag ref $TAG_REF."
            exit 1
          fi
          TAG_OBJECT=$(git rev-parse --verify "$TAG_REF")
          if [ "$(git cat-file -t "$TAG_REF")" != "tag" ]; then
            echo "::error::Only annotated/signed tags are allowed for releases."
            exit 1
          fi
          SHA=$(git rev-parse --verify "${TAG_REF}^{commit}")
          if [ "$SHA" != "$EVENT_SHA" ] || [ "$(git rev-parse HEAD)" != "$SHA" ]; then
            echo "::error::Selected tag, triggering commit and tested checkout must match."
            exit 1
          fi
          # Preserve the existing informational trust policy.
          if git verify-tag "$TAG_REF" 2>/dev/null; then
            echo "Tag signature verified"
          else
            echo "::warning::Tag $TAG signature could not be verified (signing key not available in CI)"
          fi
          {
            echo "tag=$TAG"
            echo "sha=$SHA"
            echo "tag-object=$TAG_OBJECT"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -race -v ./...

  release:
    name: Create Release
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.test.outputs.sha }}

      - name: Verify tested release source
        id: tag
        env:
          TAG: ${{ needs.test.outputs.tag }}
          EXPECTED_SHA: ${{ needs.test.outputs.sha }}
          EXPECTED_TAG_OBJECT: ${{ needs.test.outputs.tag-object }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ] ||
             [ "$(git rev-parse --verify "refs/tags/${TAG}")" != "$EXPECTED_TAG_OBJECT" ]; then
            echo "::error::Release checkout/tag no longer matches the tested source."
            exit 1
          fi
          ENCODED_TAG=$(jq -rn --arg tag "$TAG" '$tag | @uri')
          CURRENT_TAG_OBJECT=$(gh api "repos/$REPO/git/ref/tags/$ENCODED_TAG" --jq '.object.sha')
          if [ "$CURRENT_TAG_OBJECT" != "$EXPECTED_TAG_OBJECT" ]; then
            echo "::error::Release tag was moved, replaced or deleted after validation."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: notes
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          DELIMITER="ghadelim_$(openssl rand -hex 8)"

          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREVIOUS_TAG" ]; then
            {
              echo "notes<<$DELIMITER"
              echo "Initial release"
              echo "$DELIMITER"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "notes<<$DELIMITER"
              git log --pretty=format:"- %s" "${PREVIOUS_TAG}..${TAG}"
              echo ""
              echo ""
              echo "**Full changelog**: https://github.com/${REPO}/compare/${PREVIOUS_TAG}...${TAG}"
              echo "$DELIMITER"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        if: inputs.generate-sbom
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Disable module/build caching in the release job: it only needs Go
          # present for SBOM generation (anchore reads go.mod directly). A
          # restored cache would be a needless cache-poisoning vector here.
          cache: false

      - name: Generate SBOM (CycloneDX)
        if: inputs.generate-sbom
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom-${{ steps.tag.outputs.version }}.cyclonedx.json

      - name: Generate SBOM (SPDX)
        if: inputs.generate-sbom
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: sbom-${{ steps.tag.outputs.version }}.spdx.json

      - name: Generate checksums
        run: |
          shopt -s nullglob
          files=(sbom-*.json)
          if [ ${#files[@]} -gt 0 ]; then
            sha256sum "${files[@]}" > checksums.txt
            cat checksums.txt
          else
            echo "No artifacts to checksum"
            touch checksums.txt
          fi

      - name: Install Cosign
        if: inputs.cosign-sign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign checksums with Cosign (keyless)
        if: inputs.cosign-sign
        run: |
          # Cosign v3+ emits a single self-contained Sigstore bundle (cert +
          # signature + Rekor inclusion proof) via --bundle. The legacy two-file
          # output (--output-certificate / --output-signature) is deprecated and
          # silently ignored when --new-bundle-format is the default.
          #
          # Use .sigstore.json extension so OSSF Scorecard's signed-releases
          # probe recognises the signature (allowlist: .asc, .minisig, .sig,
          # .sign, .sigstore, .sigstore.json). The bundle content is identical
          # to cosign's --bundle default output; only the filename differs.
          cosign sign-blob --yes \
            --bundle checksums.txt.sigstore.json \
            checksums.txt

      - name: Verify Cosign signature
        if: inputs.cosign-sign
        run: |
          # Keyless signing inside a reusable workflow carries the REUSABLE
          # workflow's identity (its job_workflow_ref), not the calling repo's.
          # Verify against this workflow's identity rather than github.repository.
          cosign verify-blob \
            --bundle checksums.txt.sigstore.json \
            --certificate-identity-regexp "^https://github\.com/netresearch/\.github/\.github/workflows/golib-create-release\.yml@" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            checksums.txt

      - name: Generate attestation for release artifacts
        if: inputs.attest && inputs.generate-sbom
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            sbom-*.json
            checksums.txt

      - name: Generate attestation (checksums only)
        if: inputs.attest && !inputs.generate-sbom
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: checksums.txt

      - name: Recheck release tag before publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.test.outputs.tag }}
          EXPECTED_TAG_OBJECT: ${{ needs.test.outputs.tag-object }}
        run: |
          set -euo pipefail
          ENCODED_TAG=$(jq -rn --arg tag "$TAG" '$tag | @uri')
          CURRENT_TAG_OBJECT=$(gh api "repos/$REPO/git/ref/tags/$ENCODED_TAG" --jq '.object.sha')
          if [ "$CURRENT_TAG_OBJECT" != "$EXPECTED_TAG_OBJECT" ]; then
            echo "::error::Release tag was moved, replaced or deleted after validation."
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ contains(steps.tag.outputs.tag, '-rc') || contains(steps.tag.outputs.tag, '-alpha') || contains(steps.tag.outputs.tag, '-beta') }}
          body: ${{ steps.notes.outputs.notes }}
          fail_on_unmatched_files: false
          files: |
            sbom-*.json
            checksums.txt
            checksums.txt.sigstore.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
