name: Create Go Library Release

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag (e.g., v1.10.0). Defaults to the triggering ref name."
        required: false
        type: string
        default: ""
      draft:
        description: "Create as draft release (recommended: true)"
        required: false
        type: boolean
        default: true
      generate-sbom:
        description: "Generate SBOM artifacts"
        required: false
        type: boolean
        default: true
      cosign-sign:
        description: "Sign checksums with Cosign (keyless / Sigstore)"
        required: false
        type: boolean
        default: true
      attest:
        description: "Generate GitHub artifact attestation for release assets"
        required: false
        type: boolean
        default: true

# CALLER REQUIREMENTS
# ===================
# When calling this reusable workflow, the caller's job-level
# `permissions:` block MUST grant at least this full set, otherwise
# the run fails with `startup_failure` before any job executes
# (GitHub rejects the workflow at startup when the reusable declares
# a permission the caller did not grant). NOTE: setting ANY scope in a
# `permissions:` block forces every UNLISTED scope to `none`, and a job
# that omits `permissions:` inherits the repository default
# (default_workflow_permissions) — so a repo hardened to `read` will
# startup-fail here unless these scopes are granted explicitly.
#
#   jobs:
#     test:
#       uses: netresearch/.github/.github/workflows/golib-create-release.yml@main
#       permissions:
#         attestations: write
#         contents: write
#         id-token: write
permissions: {}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -race -v ./...

  release:
    name: Create Release
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_TAG:-$REF_NAME}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Verify tag is annotated
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          TAG_TYPE=$(git cat-file -t "$TAG")
          if [ "$TAG_TYPE" != "tag" ]; then
            echo "::error::Tag $TAG is lightweight (type: $TAG_TYPE). Only annotated/signed tags are allowed for releases."
            exit 1
          fi
          echo "Tag $TAG is annotated (type: $TAG_TYPE)"

          # Attempt signature verification (informational)
          if git tag -v "$TAG" 2>/dev/null; then
            echo "Tag signature verified"
          else
            echo "::warning::Tag $TAG signature could not be verified (signing key not available in CI)"
          fi

      - name: Generate release notes
        id: notes
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          DELIMITER="ghadelim_$(openssl rand -hex 8)"

          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREVIOUS_TAG" ]; then
            {
              echo "notes<<$DELIMITER"
              echo "Initial release"
              echo "$DELIMITER"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "notes<<$DELIMITER"
              git log --pretty=format:"- %s" "${PREVIOUS_TAG}..${TAG}"
              echo ""
              echo ""
              echo "**Full changelog**: https://github.com/${REPO}/compare/${PREVIOUS_TAG}...${TAG}"
              echo "$DELIMITER"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        if: inputs.generate-sbom
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Disable module/build caching in the release job: it only needs Go
          # present for SBOM generation (anchore reads go.mod directly). A
          # restored cache would be a needless cache-poisoning vector here.
          cache: false

      - name: Generate SBOM (CycloneDX)
        if: inputs.generate-sbom
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom-${{ steps.tag.outputs.version }}.cyclonedx.json

      - name: Generate SBOM (SPDX)
        if: inputs.generate-sbom
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: sbom-${{ steps.tag.outputs.version }}.spdx.json

      - name: Generate checksums
        run: |
          shopt -s nullglob
          files=(sbom-*.json)
          if [ ${#files[@]} -gt 0 ]; then
            sha256sum "${files[@]}" > checksums.txt
            cat checksums.txt
          else
            echo "No artifacts to checksum"
            touch checksums.txt
          fi

      - name: Install Cosign
        if: inputs.cosign-sign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign checksums with Cosign (keyless)
        if: inputs.cosign-sign
        run: |
          # Cosign v3+ emits a single self-contained Sigstore bundle (cert +
          # signature + Rekor inclusion proof) via --bundle. The legacy two-file
          # output (--output-certificate / --output-signature) is deprecated and
          # silently ignored when --new-bundle-format is the default.
          #
          # Use .sigstore.json extension so OSSF Scorecard's signed-releases
          # probe recognises the signature (allowlist: .asc, .minisig, .sig,
          # .sign, .sigstore, .sigstore.json). The bundle content is identical
          # to cosign's --bundle default output; only the filename differs.
          cosign sign-blob --yes \
            --bundle checksums.txt.sigstore.json \
            checksums.txt

      - name: Verify Cosign signature
        if: inputs.cosign-sign
        run: |
          # Keyless signing inside a reusable workflow carries the REUSABLE
          # workflow's identity (its job_workflow_ref), not the calling repo's.
          # Verify against this workflow's identity rather than github.repository.
          cosign verify-blob \
            --bundle checksums.txt.sigstore.json \
            --certificate-identity-regexp "^https://github\.com/netresearch/\.github/\.github/workflows/golib-create-release\.yml@" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            checksums.txt

      - name: Generate attestation for release artifacts
        if: inputs.attest && inputs.generate-sbom
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            sbom-*.json
            checksums.txt

      - name: Generate attestation (checksums only)
        if: inputs.attest && !inputs.generate-sbom
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ contains(steps.tag.outputs.tag, '-rc') || contains(steps.tag.outputs.tag, '-alpha') || contains(steps.tag.outputs.tag, '-beta') }}
          body: ${{ steps.notes.outputs.notes }}
          fail_on_unmatched_files: false
          files: |
            sbom-*.json
            checksums.txt
            checksums.txt.sigstore.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
