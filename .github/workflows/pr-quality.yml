name: PR Quality Gates

on:
  workflow_call:
    inputs:
      size-warning-threshold:
        description: 'Lines changed threshold for medium size label'
        required: false
        type: number
        default: 500
      size-alert-threshold:
        description: 'Lines changed threshold for large size warning'
        required: false
        type: number
        default: 1000
      security-controls-path:
        description: 'Path to security controls documentation'
        required: false
        type: string
        default: '.github/SECURITY_CONTROLS.md'

      auto-approve-maintainers:
        description: >-
          When true, automatically approve PRs whose author_association is
          OWNER / MEMBER / COLLABORATOR (i.e. project maintainers). Satisfies
          the "1 approval" branch-protection gate for maintainer PRs without
          bypassing Copilot review (which runs separately via the Copilot
          ruleset, not this workflow).
        required: false
        type: boolean
        default: true

      auto-approve-require-write:
        description: >-
          Stricter authorization for auto-approval. When true, the
          `author_association` gate is replaced by an explicit collaborator
          permission lookup
          (`GET /repos/{repo}/collaborators/{author}/permission`) and the PR is
          only approved when that permission is `admin` or `write`.
          Rationale: `author_association == MEMBER` matches ANY member of the
          owning organisation, including members who hold only read access on
          this repository. Defaults to false so existing callers keep the
          historical association-based behaviour unchanged.
        required: false
        type: boolean
        default: false

      auto-approve-message:
        description: >-
          Body text posted with the auto-approval review. Supports standard
          Markdown. Placeholder `{controls}` is replaced with a link to
          security-controls-path.
        required: false
        type: string
        default: "**Automated approval for maintainer PR**\n\nAll automated quality gates passed. See [SECURITY_CONTROLS.md]({controls}) for compensating controls."

# CALLER REQUIREMENTS
# ===================
# When calling this reusable workflow, the caller's job-level
# `permissions:` block MUST grant at least this full set, otherwise
# the run fails with `startup_failure` before any job executes
# (GitHub rejects the workflow at startup when the reusable declares
# a permission the caller did not grant). NOTE: setting ANY scope in a
# `permissions:` block forces every UNLISTED scope to `none`, and a job
# that omits `permissions:` inherits the repository default
# (default_workflow_permissions) — so a repo hardened to `read` will
# startup-fail here unless these scopes are granted explicitly.
#
#   jobs:
#     quality-gate:
#       uses: netresearch/.github/.github/workflows/pr-quality.yml@main
#       permissions:
#         contents: read
#         pull-requests: write
permissions: {}

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: PR Size Check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SIZE_WARNING: ${{ inputs.size-warning-threshold }}
          SIZE_ALERT: ${{ inputs.size-alert-threshold }}
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const additions = files.reduce((sum, f) => sum + f.additions, 0);
            const deletions = files.reduce((sum, f) => sum + f.deletions, 0);
            const total = additions + deletions;

            const warning = parseInt(process.env.SIZE_WARNING);
            const alert = parseInt(process.env.SIZE_ALERT);

            let size = 'small';
            if (total > warning) size = 'large';
            else if (total > Math.floor(warning / 2.5)) size = 'medium';

            console.log(`PR Size: ${size} (${additions}+ / ${deletions}-)`);

            if (total > alert) {
              core.warning(`Large PR with ${total} changes. Consider breaking into smaller PRs.`);
            }

  auto-approve:
    name: Auto-Approve (Solo Maintainer)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: quality-gate
    # Skip (not fail) for fork PRs — auto-approve only applies to same-repo
    # branches. Fork PRs always fail because GITHUB_TOKEN lacks permission.
    #
    # The author_association pre-filter applies only in the default mode. With
    # `auto-approve-require-write: true` the collaborator-permission step below
    # is the sole authority — it is strictly narrower than the association
    # check, so nothing it admits would have been rejected here.
    if: >-
      inputs.auto-approve-maintainers
      && github.event.pull_request.draft == false
      && github.event.pull_request.head.repo.full_name == github.repository
      && (
        inputs.auto-approve-require-write
        || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
      )
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      # Only runs when the caller opted into the stricter mode. Skipped
      # (and therefore without effect) for every caller that does not pass
      # `auto-approve-require-write: true`.
      - name: Check author repository permission
        id: check-permission
        if: inputs.auto-approve-require-write
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO: ${{ github.repository }}
        run: |
          # Fails closed: a non-collaborator author (HTTP 404) or any API
          # error resolves to "none", which skips the approval step below.
          PERMISSION=$(gh api "repos/$REPO/collaborators/$PR_AUTHOR/permission" --jq '.permission' 2>/dev/null || echo "none")
          echo "Author '$PR_AUTHOR' resolved repository permission: $PERMISSION"
          echo "permission=$PERMISSION" >> "$GITHUB_OUTPUT"

      - name: Auto-approve PR
        # Default mode (input false/unset): approve unconditionally, exactly as
        # before. Strict mode: require admin or write on this repository.
        if: >-
          inputs.auto-approve-require-write == false
          || contains(fromJSON('["admin","write"]'), steps.check-permission.outputs.permission)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CONTROLS_PATH: ${{ inputs.security-controls-path }}
          APPROVE_MESSAGE: ${{ inputs.auto-approve-message }}
        with:
          script: |
            const controlsPath = process.env.CONTROLS_PATH;
            const message = process.env.APPROVE_MESSAGE.replace(/\\n/g, "\n").replace(/\{controls\}/g, `/${controlsPath}`);
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              event: 'APPROVE',
              body: message,
            });
            console.log('PR auto-approved');
