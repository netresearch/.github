name: zizmor

# Reusable zizmor (https://zizmor.sh) static analysis for GitHub Actions.
#
# Report-only by design: zizmor runs in SARIF mode (exit 0 regardless of
# findings) and the results are uploaded to the repository's code-scanning
# / Security tab, exactly like the CodeQL and Scorecard reusables. Findings
# surface as code-scanning alerts; they do NOT fail CI. zizmor automatically
# discovers a repo's `.github/zizmor.yml` config when present; when the repo
# has none, the organisation policy is fetched from config-repo at run time so
# that consumers do not have to carry a copy of it.
#
# Skipped on `merge_group`: the gh-readonly-queue ref is deleted the moment
# the queue completes, which races the SARIF upload (cf. scorecard.yml).

on:
  workflow_call:
    inputs:
      inputs:
        description: Whitespace-separated paths for zizmor to audit.
        type: string
        default: "."
      persona:
        description: "Audit persona: regular | pedantic | auditor."
        type: string
        default: regular
      zizmor-version:
        description: Exact zizmor version (X.Y.Z) or 'latest'.
        type: string
        default: "1.25.2"
      config-repo:
        description: "Repository holding the organisation .github/zizmor.yml, used when the audited repo has none."
        type: string
        default: "netresearch/.github"
      config-ref:
        description: "Ref of config-repo to take the policy from."
        type: string
        default: "main"

permissions: {}

jobs:
  analyze:
    name: zizmor analysis
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The organisation policy lives once, in netresearch/.github's own
      # .github/zizmor.yml, and is fetched at run time. Consumers used to carry
      # a copy, which meant a reworded comment in it became a pull request in
      # every one of them. A repo that needs a different policy keeps its own
      # .github/zizmor.yml — that file is present, so nothing is fetched and
      # the local one wins.
      - name: Fetch the organisation zizmor config
        id: org-config
        if: hashFiles('.github/zizmor.yml') == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ inputs.config-repo }}
          ref: ${{ inputs.config-ref }}
          path: .zizmor-org
          persist-credentials: false
          sparse-checkout: .github/zizmor.yml
          sparse-checkout-cone-mode: false

      - name: Install the organisation zizmor config
        if: steps.org-config.outcome == 'success'
        env:
          CONFIG_REPO: ${{ inputs.config-repo }}
        run: |
          set -euo pipefail
          if [ ! -f .zizmor-org/.github/zizmor.yml ]; then
            echo "::error::${CONFIG_REPO} has no .github/zizmor.yml — refusing to audit with zizmor's defaults, which would flag every first-party ref-pinned reusable."
            exit 1
          fi
          mkdir -p .github
          cp .zizmor-org/.github/zizmor.yml .github/zizmor.yml
          rm -rf .zizmor-org
          echo "Using the organisation zizmor policy from ${CONFIG_REPO}."

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
        with:
          inputs: ${{ inputs.inputs }}
          persona: ${{ inputs.persona }}
          version: ${{ inputs.zizmor-version }}
          # advanced-security (default true) emits SARIF and uploads it to
          # code scanning. zizmor exits 0 in SARIF mode, so this is report-
          # only and never blocks CI.
