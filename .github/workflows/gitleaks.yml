name: Secret Scanning (betterleaks)

on:
  workflow_call:
    inputs:
      skip:
        description: 'Skip secret scanning'
        required: false
        type: boolean
        default: false

# CALLER REQUIREMENTS
# ===================
# When calling this reusable workflow, the caller's job-level
# `permissions:` block MUST grant at least this full set, otherwise
# the run fails with `startup_failure` before any job executes
# (GitHub rejects the workflow at startup when the reusable declares
# a permission the caller did not grant). NOTE: setting ANY scope in a
# `permissions:` block forces every UNLISTED scope to `none`, and a job
# that omits `permissions:` inherits the repository default
# (default_workflow_permissions) — so a repo hardened to `read` will
# startup-fail here unless these scopes are granted explicitly.
#
#   jobs:
#     gitleaks:
#       uses: netresearch/.github/.github/workflows/gitleaks.yml@main
#       permissions:
#         contents: read
#         security-events: write
permissions: {}

jobs:
  gitleaks:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Deliberately no actor filter. betterleaks is a required status check, and a
    # required check that never reports blocks the merge -- excluding Dependabot
    # here made every one of its pull requests unmergeable by construction
    # (netresearch/.github#383). The job needs no secrets, so nothing stops it
    # from running for a bot.
    if: >-
      !inputs.skip &&
      github.event_name != 'merge_group'
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install betterleaks
        env:
          BETTERLEAKS_VERSION: '1.1.2'
          BETTERLEAKS_SHA256: '648c20617178065072ff1791d383192a62c911d9b4427f0426a8c504a6d9ddad'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSfL -o betterleaks.tar.gz \
            "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${BETTERLEAKS_SHA256}  betterleaks.tar.gz" | sha256sum -c -
          tar -xzf betterleaks.tar.gz betterleaks
          sudo install -m 0755 betterleaks /usr/local/bin/betterleaks
          betterleaks version

      - name: Run betterleaks
        run: |
          betterleaks git \
            --redact \
            --report-format sarif \
            --report-path betterleaks.sarif \
            --exit-code 2 \
            "$GITHUB_WORKSPACE"

      - name: Upload SARIF to code scanning
        if: always() && hashFiles('betterleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: betterleaks.sarif
          category: betterleaks
