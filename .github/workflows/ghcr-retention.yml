# Reusable "GHCR retention" workflow — prunes old container image versions
# from ghcr.io for a given package using a configurable retention policy.
#
# Strategy (generalized from the ofelia inline workflow):
# - Release images (matching release-tag-patterns, default v*, latest*) are
#   kept FOREVER.
# - Edge images (matching edge-tag-patterns, default edge*) older than
#   edge-max-age-days are deleted.
# - Orphaned untagged images (not referenced by any tagged manifest) older
#   than orphan-max-age-days are deleted.
# - Untagged images referenced by a tagged manifest (attestations,
#   provenance, sbom, platform manifests inside a manifest-list) are
#   preserved regardless of age.
# - OPTIONAL count-based floor: keep-n-untagged (default 0 = off) keeps the
#   N newest orphaned untagged IMAGES regardless of age, as a safety margin
#   for packages whose builds can pause for longer than orphan-max-age-days
#   (without it, a build gap wider than the age cutoff puts every orphan on
#   the wrong side of the cutoff at once and a single run removes them all).
#   The floor is applied BEFORE the age check, so it wins over
#   orphan-max-age-days.
#
#   UNIT: N counts top-level untagged IMAGES (whole manifest groups), NOT
#   raw API version rows. One multi-arch push is one index version PLUS one
#   version per platform manifest and per attestation, so counting rows
#   would both make N mean a fraction of an image and let the cut land
#   INSIDE a group (keeping an index while deleting the platform manifests
#   it points at). This matches dataaxiom/ghcr-cleanup-action's
#   keep-n-untagged, which drops child images from its working set before
#   counting and deletes staged versions together with their children —
#   so a `keep-n-untagged: 10` copied from a dataaxiom caller keeps the
#   same retention depth here.
#
#   SCOPE: the floor only ever protects ORPHANS (untagged AND unreachable
#   from every tag). Anything a tag still points at — directly or as a
#   platform child / attestation / referrer — is already kept forever by
#   the referenced-digest scan, with or without the floor. On a package
#   that gives every build its own immutable tag (a dated or sha- tag), the
#   previous builds stay reachable and the floor changes nothing for them;
#   what it protects there are build intermediates (per-arch cell indexes,
#   sigstore bundle indexes) that no tag references.
#
# Multi-arch builds typically create multiple versions per release:
#   - N platform images (386, amd64, arm/v6, arm/v7, arm64 — usually tagged,
#     e.g. v1.2.3-amd64, edge-amd64)
#   - 2 attestation images (provenance, sbom — untagged but referenced)
# The referenced-digest scan keeps attestations alive for as long as any
# tagged manifest still points at them.
#
# See: https://github.com/actions/delete-package-versions/issues/162
#
# Caller pattern:
#
#   name: GHCR Retention
#   on:
#     schedule:
#       - cron: "0 2 * * 0"   # weekly, Sundays 02:00 UTC
#     workflow_dispatch:
#       inputs:
#         dry-run:
#           type: boolean
#           default: true
#   jobs:
#     prune:
#       uses: netresearch/.github/.github/workflows/ghcr-retention.yml@main
#       with:
#         package-name: my-app
#         dry-run: ${{ inputs.dry-run || false }}
#
# SECURITY: every caller-supplied input that lands in a `run:` step is
# pushed through the `env:` block so it cannot break out of its argument
# position via quoting/metacharacters.

name: GHCR Retention (reusable)

on:
  workflow_call:
    inputs:
      package-name:
        description: "GHCR package name to prune (e.g. 'my-app'). The owner is taken from github.repository_owner."
        required: true
        type: string
      release-tag-patterns:
        description: "Comma-separated glob patterns; images whose tags match any of these are kept forever."
        required: false
        type: string
        default: "v*,latest*"
      edge-tag-patterns:
        description: "Comma-separated glob patterns; images whose tags match any of these are pruned once older than edge-max-age-days."
        required: false
        type: string
        default: "edge*"
      edge-max-age-days:
        description: "Delete edge-pattern images older than this many days."
        required: false
        type: number
        default: 30
      orphan-max-age-days:
        description: "Delete orphaned untagged images older than this many days."
        required: false
        type: number
        default: 7
      keep-n-untagged:
        description: "Always keep the N newest orphaned untagged IMAGES regardless of age (count-based margin, applied as a floor before orphan-max-age-days). N counts whole manifest groups — an index plus its platform children and attestations is ONE image — the same unit as dataaxiom/ghcr-cleanup-action's keep-n-untagged. Only orphans are affected; anything a tag still references is kept forever anyway. 0 disables the floor (default) and retention stays purely age-based."
        required: false
        type: number
        default: 0
      dry-run:
        description: "If true, list what would be deleted but don't delete."
        required: false
        type: boolean
        default: false

# CALLER REQUIREMENTS
# ===================
# When calling this reusable workflow, the caller's job-level
# `permissions:` block MUST grant at least this full set, otherwise
# the run fails with `startup_failure` before any job executes
# (GitHub rejects the workflow at startup when the reusable declares
# a permission the caller did not grant). NOTE: setting ANY scope in a
# `permissions:` block forces every UNLISTED scope to `none`, and a job
# that omits `permissions:` inherits the repository default
# (default_workflow_permissions) — so a repo hardened to `read` will
# startup-fail here unless these scopes are granted explicitly.
#
#   jobs:
#     cleanup-edge-images:
#       uses: netresearch/.github/.github/workflows/ghcr-retention.yml@main
#       permissions:
#         packages: write
jobs:
  cleanup-edge-images:
    name: Cleanup Old Edge Images
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Cleanup old edge container versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE_NAME: ${{ inputs.package-name }}
          RELEASE_TAG_PATTERNS: ${{ inputs.release-tag-patterns }}
          EDGE_TAG_PATTERNS: ${{ inputs.edge-tag-patterns }}
          EDGE_MAX_AGE_DAYS: ${{ inputs.edge-max-age-days }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail

          echo "Fetching container versions for ${PACKAGE_NAME} (owner: ${OWNER})..."
          echo "Edge retention: ${EDGE_MAX_AGE_DAYS} days"
          echo "Release tag patterns (kept forever): ${RELEASE_TAG_PATTERNS}"
          echo "Edge tag patterns (pruned): ${EDGE_TAG_PATTERNS}"
          echo "Dry run: ${DRY_RUN}"
          echo ""

          # Convert comma-separated glob patterns (e.g. "v*,latest*") to a
          # jq array of regex patterns (e.g. ["^v.*$", "^latest.*$"]). Globs
          # are intentionally minimal: "*" -> ".*", everything else is treated
          # as a literal anchored match.
          glob_list_to_regex_array() {
            local list="$1"
            echo "$list" | jq -Rc '
              split(",")
              | map(gsub("^\\s+|\\s+$"; ""))
              | map(select(length > 0))
              | map("^" + (gsub("\\*"; ".*")) + "$")
            '
          }

          RELEASE_REGEX_JSON=$(glob_list_to_regex_array "$RELEASE_TAG_PATTERNS")
          EDGE_REGEX_JSON=$(glob_list_to_regex_array "$EDGE_TAG_PATTERNS")
          echo "Compiled release regex: ${RELEASE_REGEX_JSON}"
          echo "Compiled edge regex:    ${EDGE_REGEX_JSON}"
          echo ""

          # Calculate cutoff date
          CUTOFF_DATE=$(date -d "-${EDGE_MAX_AGE_DAYS} days" -Iseconds)
          echo "Cutoff date: ${CUTOFF_DATE}"
          echo ""

          # Get all versions (paginated)
          PAGE=1
          VERSIONS_TO_DELETE=()

          while true; do
            # Fail loudly if the API call errors — previously the
            # `2>/dev/null || echo "[]"` pattern concatenated the
            # error body onto the fallback `[]`, producing TWO JSON
            # documents in $VERSIONS. `jq 'length'` then returned
            # multiline output (e.g. "3\n0" for an error object
            # followed by the empty array) and every downstream
            # bash test / jq pipeline mangled.
            if ! VERSIONS=$(gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/orgs/${OWNER}/packages/container/${PACKAGE_NAME}/versions?per_page=100&page=${PAGE}" 2>&1); then
              # Bash parameter expansion (collapse newlines, truncate).
              # Avoids `echo | tr | head` because under `set -euo pipefail`
              # the SIGPIPE that head sends back to tr makes the pipeline
              # exit non-zero, suppressing the ::error:: we want to emit.
              VERSIONS_SINGLE_LINE=${VERSIONS//$'\n'/ }
              echo "::error::Failed to fetch versions page ${PAGE}: ${VERSIONS_SINGLE_LINE:0:400}"
              exit 1
            fi

            # Check if we got any versions
            COUNT=$(echo "$VERSIONS" | jq 'length')
            if [ "$COUNT" -eq 0 ]; then
              break
            fi

            echo "Processing page ${PAGE} (${COUNT} versions)..."

            # Process each version
            while IFS= read -r version; do
              VERSION_ID=$(echo "$version" | jq -r '.id')
              CREATED_AT=$(echo "$version" | jq -r '.created_at')
              TAGS=$(echo "$version" | jq -r '.metadata.container.tags // [] | join(", ")')

              # Skip if no tags — these are likely attestations referenced by
              # manifests and are handled by the orphan-cleanup job.
              if [ -z "$TAGS" ]; then
                continue
              fi

              # Check if ANY tag matches a release pattern (kept forever)
              HAS_RELEASE_TAG=$(echo "$version" | jq -r --argjson patterns "$RELEASE_REGEX_JSON" '
                .metadata.container.tags // []
                | any(.[]; . as $t | any($patterns[]; . as $p | $t | test($p)))
              ')

              if [ "$HAS_RELEASE_TAG" = "true" ]; then
                continue
              fi

              # Check if this is an edge-pattern image
              IS_EDGE=$(echo "$version" | jq -r --argjson patterns "$EDGE_REGEX_JSON" '
                .metadata.container.tags // []
                | any(.[]; . as $t | any($patterns[]; . as $p | $t | test($p)))
              ')

              if [ "$IS_EDGE" != "true" ]; then
                continue
              fi

              # Check if older than cutoff
              if [[ "$CREATED_AT" < "$CUTOFF_DATE" ]]; then
                echo "  Version ${VERSION_ID} (tags: ${TAGS}) created ${CREATED_AT} - WILL DELETE"
                VERSIONS_TO_DELETE+=("$VERSION_ID")
              fi
            done < <(echo "$VERSIONS" | jq -c '.[]')

            PAGE=$((PAGE + 1))
          done

          echo ""
          echo "Summary: ${#VERSIONS_TO_DELETE[@]} edge versions to delete"
          echo ""

          if [ ${#VERSIONS_TO_DELETE[@]} -eq 0 ]; then
            echo "No old edge images to clean up"
            exit 0
          fi

          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY RUN - Would delete ${#VERSIONS_TO_DELETE[@]} versions"
            echo "Run with dry-run=false to actually delete"
            exit 0
          fi

          # Delete the versions
          DELETED=0
          FAILED=0
          for VERSION_ID in "${VERSIONS_TO_DELETE[@]}"; do
            echo "Deleting version ${VERSION_ID}..."
            if DELETE_OUT=$(gh api \
              --method DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/orgs/${OWNER}/packages/container/${PACKAGE_NAME}/versions/${VERSION_ID}" 2>&1); then
              DELETED=$((DELETED + 1))
            else
              # Capture the API error body so operators can see WHY the
              # delete was refused (common causes: 404 for race-deleted
              # siblings, 422 for versions still referenced by an OCI
              # manifest crane didn't traverse, 403 for package-level
              # delete restrictions). The body goes on a single line
              # so one-liner log scans keep working.
              # Bash parameter expansion — same SIGPIPE-avoidance reason
              # as the fetch path above.
              DELETE_OUT_SINGLE_LINE=${DELETE_OUT//$'\n'/ }
              ERR_ONE_LINE=${DELETE_OUT_SINGLE_LINE:0:400}
              echo "  WARNING: Failed to delete version ${VERSION_ID}: ${ERR_ONE_LINE}"
              FAILED=$((FAILED + 1))
            fi
          done

          echo ""
          echo "Deleted ${DELETED} versions"
          if [ $FAILED -gt 0 ]; then
            echo "WARNING: Failed to delete ${FAILED} versions"
          fi

  cleanup-orphaned-images:
    name: Cleanup Orphaned Untagged Images
    runs-on: ubuntu-latest
    needs: cleanup-edge-images
    permissions:
      packages: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Install crane
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
        with:
          # Pin crane to a known-good release; `latest` broke CI in the past
          # when upstream re-tagged without backward compat.
          version: v0.21.5

      - name: Log in to Container registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup orphaned untagged images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE_NAME: ${{ inputs.package-name }}
          ORPHAN_MAX_AGE_DAYS: ${{ inputs.orphan-max-age-days }}
          KEEP_N_UNTAGGED: ${{ inputs.keep-n-untagged }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail

          # Count-based retention floor. An omitted workflow_call input takes
          # the declared default (0), but an explicitly-passed empty
          # expression renders as "" — normalise both to 0 so the historic
          # purely-age-based behaviour is what an unset input produces.
          KEEP_N="${KEEP_N_UNTAGGED:-0}"
          if ! [[ "$KEEP_N" =~ ^[0-9]+$ ]]; then
            echo "::error::keep-n-untagged must be a non-negative integer, got '${KEEP_N}'"
            exit 1
          fi

          # Lowercase the owner for the registry path (ghcr.io requires lowercase)
          OWNER_LC="${OWNER,,}"
          IMAGE="ghcr.io/${OWNER_LC}/${PACKAGE_NAME}"

          echo "Collecting referenced digests from all tagged manifests..."
          echo "Image: ${IMAGE}"
          echo "Orphan retention: ${ORPHAN_MAX_AGE_DAYS} days"
          if [ "$KEEP_N" -gt 0 ]; then
            echo "Keep-n-untagged floor: ${KEEP_N} newest orphaned untagged images (whole manifest groups) kept regardless of age"
          else
            echo "Keep-n-untagged floor: disabled (age-based retention only)"
          fi
          echo "Dry run: ${DRY_RUN}"
          echo ""

          # Calculate cutoff date
          CUTOFF_DATE=$(date -d "-${ORPHAN_MAX_AGE_DAYS} days" -Iseconds)
          echo "Cutoff date: ${CUTOFF_DATE}"
          echo ""

          # Collect all referenced digests from tagged manifests
          REFERENCED_DIGESTS=$(mktemp)
          TAGS=$(crane ls "$IMAGE" 2>/dev/null || echo "")

          if [ -z "$TAGS" ]; then
            echo "No tags found, skipping"
            exit 0
          fi

          TAG_COUNT=$(echo "$TAGS" | wc -l)
          echo "Found ${TAG_COUNT} tags, collecting referenced digests..."

          for TAG in $TAGS; do
            # Get manifest and extract all referenced digests
            MANIFEST=$(crane manifest "${IMAGE}:${TAG}" 2>/dev/null || echo "{}")

            # Extract digests from manifest list (multi-arch) or single manifest
            echo "$MANIFEST" | jq -r '
              # From manifest list
              (.manifests[]?.digest // empty),
              # From config
              (.config?.digest // empty),
              # From layers
              (.layers[]?.digest // empty)
            ' 2>/dev/null >> "$REFERENCED_DIGESTS" || true
          done

          # Sort and dedupe
          sort -u "$REFERENCED_DIGESTS" -o "$REFERENCED_DIGESTS"
          REF_COUNT=$(wc -l < "$REFERENCED_DIGESTS")
          echo "Found ${REF_COUNT} unique referenced digests"
          echo ""

          # Now find orphaned untagged versions.
          #
          # Candidates (untagged AND not referenced by any tagged manifest)
          # are collected FIRST and only afterwards filtered by age, because
          # the count-based floor has to rank ALL candidates by recency. A
          # floor applied after the age filter could not protect anything in
          # the case it exists for: a build gap wider than
          # orphan-max-age-days, where EVERY rollback target is older than
          # the cutoff.
          echo "Scanning for orphaned untagged versions..."
          PAGE=1
          VERSIONS_TO_DELETE=()
          CANDIDATES=$(mktemp)

          while true; do
            # Fail loudly if the API call errors — previously the
            # `2>/dev/null || echo "[]"` pattern concatenated the
            # error body onto the fallback `[]`, producing TWO JSON
            # documents in $VERSIONS. `jq 'length'` then returned
            # multiline output (e.g. "3\n0" for an error object
            # followed by the empty array) and every downstream
            # bash test / jq pipeline mangled.
            if ! VERSIONS=$(gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/orgs/${OWNER}/packages/container/${PACKAGE_NAME}/versions?per_page=100&page=${PAGE}" 2>&1); then
              # Bash parameter expansion (collapse newlines, truncate).
              # Avoids `echo | tr | head` because under `set -euo pipefail`
              # the SIGPIPE that head sends back to tr makes the pipeline
              # exit non-zero, suppressing the ::error:: we want to emit.
              VERSIONS_SINGLE_LINE=${VERSIONS//$'\n'/ }
              echo "::error::Failed to fetch versions page ${PAGE}: ${VERSIONS_SINGLE_LINE:0:400}"
              exit 1
            fi

            COUNT=$(echo "$VERSIONS" | jq 'length')
            if [ "$COUNT" -eq 0 ]; then
              break
            fi

            echo "Processing page ${PAGE} (${COUNT} versions)..."

            while IFS= read -r version; do
              VERSION_ID=$(echo "$version" | jq -r '.id')
              CREATED_AT=$(echo "$version" | jq -r '.created_at')
              VERSION_TAGS=$(echo "$version" | jq -r '.metadata.container.tags // [] | join(", ")')
              DIGEST=$(echo "$version" | jq -r '.name')

              # Only process untagged versions
              if [ -n "$VERSION_TAGS" ]; then
                continue
              fi

              # Check if referenced by any manifest — these are typically
              # attestations (provenance, sbom) or platform manifests inside
              # a manifest list and must be preserved.
              if grep -qF "$DIGEST" "$REFERENCED_DIGESTS" 2>/dev/null; then
                continue
              fi

              printf '%s\t%s\t%s\n' "$CREATED_AT" "$VERSION_ID" "$DIGEST" >> "$CANDIDATES"
            done < <(echo "$VERSIONS" | jq -c '.[]')

            PAGE=$((PAGE + 1))
          done

          rm -f "$REFERENCED_DIGESTS"

          # Newest first. created_at is RFC 3339 UTC, so a lexicographic sort
          # IS a chronological sort. Sorted into a file rather than piped
          # through head/tail so no SIGPIPE can trip `set -o pipefail`.
          CANDIDATES_SORTED=$(mktemp)
          sort -r "$CANDIDATES" > "$CANDIDATES_SORTED"
          rm -f "$CANDIDATES"
          CANDIDATE_COUNT=$(wc -l < "$CANDIDATES_SORTED")
          echo "Found ${CANDIDATE_COUNT} orphaned untagged versions (any age)"

          # Digests the count-based floor protects. Stays EMPTY unless
          # keep-n-untagged > 0 — that is what keeps the KEEP_N=0 path
          # identical to the age-only behaviour this workflow had before
          # keep-n-untagged existed (no extra registry calls either).
          PROTECTED_DIGESTS=$(mktemp)

          if [ "$KEEP_N" -gt 0 ] && [ "$CANDIDATE_COUNT" -gt 0 ]; then
            # The floor counts IMAGES, not API version rows. One multi-arch
            # push is an index version PLUS one version per platform manifest
            # and per attestation, so a row-based cut would (a) protect a
            # fraction of the images a dataaxiom `keep-n-untagged: N` protects
            # and (b) be able to land INSIDE a manifest group, keeping an
            # orphaned index while deleting the platform manifests it points
            # at — a "protected" rollback target that cannot be pulled.
            #
            # So: resolve parent->child edges among the candidates, rank the
            # ROOTS (candidates that are not a child of another candidate)
            # newest-first, keep the N newest roots and every descendant of
            # those roots.
            echo "Resolving manifest groups among the candidates..."
            EDGES=$(mktemp)          # "<parent digest>\t<child digest>"
            CHILD_DIGESTS=$(mktemp)  # candidates owned by another candidate
            while IFS=$'\t' read -r _CREATED_AT _VERSION_ID DIGEST; do
              CANDIDATE_MANIFEST=$(crane manifest "${IMAGE}@${DIGEST}" 2>/dev/null || echo "{}")
              while IFS= read -r CHILD; do
                [ -n "$CHILD" ] || continue
                printf '%s\t%s\n' "$DIGEST" "$CHILD" >> "$EDGES"
                printf '%s\n' "$CHILD" >> "$CHILD_DIGESTS"
              done < <(echo "$CANDIDATE_MANIFEST" | jq -r '.manifests[]?.digest // empty' 2>/dev/null || true)
            done < "$CANDIDATES_SORTED"
            sort -u "$CHILD_DIGESTS" -o "$CHILD_DIGESTS"

            # CANDIDATES_SORTED is already newest-first, so ROOTS is too.
            ROOTS=$(mktemp)
            while IFS=$'\t' read -r _CREATED_AT _VERSION_ID DIGEST; do
              if grep -qxF "$DIGEST" "$CHILD_DIGESTS"; then
                continue
              fi
              printf '%s\n' "$DIGEST" >> "$ROOTS"
            done < "$CANDIDATES_SORTED"
            ROOT_COUNT=$(wc -l < "$ROOTS")

            PROTECTED_ROOTS="$KEEP_N"
            if [ "$ROOT_COUNT" -lt "$PROTECTED_ROOTS" ]; then
              PROTECTED_ROOTS="$ROOT_COUNT"
            fi
            echo "  ${ROOT_COUNT} top-level orphaned images across ${CANDIDATE_COUNT} versions"
            echo "Retention floor: keeping the ${PROTECTED_ROOTS} newest orphaned images (whole manifest groups) regardless of age"

            # Breadth-first closure over EDGES, so a protected root drags its
            # platform manifests and attestations along even when they sort
            # far below the Nth root. Handles nested indexes too.
            QUEUE=()
            while IFS= read -r ROOT_DIGEST; do
              QUEUE+=("$ROOT_DIGEST")
            done < <(head -n "$PROTECTED_ROOTS" "$ROOTS")
            while [ ${#QUEUE[@]} -gt 0 ]; do
              CURRENT="${QUEUE[0]}"
              QUEUE=("${QUEUE[@]:1}")
              if grep -qxF "$CURRENT" "$PROTECTED_DIGESTS"; then
                continue
              fi
              printf '%s\n' "$CURRENT" >> "$PROTECTED_DIGESTS"
              while IFS= read -r CHILD; do
                [ -n "$CHILD" ] || continue
                QUEUE+=("$CHILD")
              done < <(awk -F'\t' -v parent="$CURRENT" '$1 == parent { print $2 }' "$EDGES")
            done
            # Count only the protected digests that are actually candidates:
            # the closure can also walk into children that a tag still
            # references, and those are kept by the referenced-digest scan
            # anyway, so counting them here would overstate the floor.
            PROTECTED_ROWS=$(awk -F'\t' 'NR == FNR { p[$0] = 1; next } ($3 in p) { n++ } END { print n + 0 }' "$PROTECTED_DIGESTS" "$CANDIDATES_SORTED")
            echo "  ${PROTECTED_ROOTS} images = ${PROTECTED_ROWS} of the ${CANDIDATE_COUNT} candidate versions"
            rm -f "$EDGES" "$CHILD_DIGESTS" "$ROOTS"
          fi

          # The floor is expressed as a digest set rather than as a slice of
          # the row list, so the age filter below is exactly the pre-floor
          # one: with KEEP_N=0 the protected set is empty and every candidate
          # is age-checked as before, in the same order.
          while IFS=$'\t' read -r CREATED_AT VERSION_ID DIGEST; do
            # Kept by the count-based floor, regardless of age
            if grep -qxF "$DIGEST" "$PROTECTED_DIGESTS"; then
              continue
            fi

            # Check if older than cutoff
            if [[ ! "$CREATED_AT" < "$CUTOFF_DATE" ]]; then
              continue
            fi

            echo "  Orphaned: ${VERSION_ID} (${DIGEST}) created ${CREATED_AT}"
            VERSIONS_TO_DELETE+=("$VERSION_ID")
          done < "$CANDIDATES_SORTED"

          rm -f "$CANDIDATES_SORTED" "$PROTECTED_DIGESTS"

          echo ""
          echo "Summary: ${#VERSIONS_TO_DELETE[@]} orphaned untagged versions to delete"
          echo ""

          if [ ${#VERSIONS_TO_DELETE[@]} -eq 0 ]; then
            echo "No orphaned images to clean up"
            exit 0
          fi

          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY RUN - Would delete ${#VERSIONS_TO_DELETE[@]} versions"
            echo "Run with dry-run=false to actually delete"
            exit 0
          fi

          # Delete the versions
          DELETED=0
          FAILED=0
          for VERSION_ID in "${VERSIONS_TO_DELETE[@]}"; do
            echo "Deleting version ${VERSION_ID}..."
            if DELETE_OUT=$(gh api \
              --method DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/orgs/${OWNER}/packages/container/${PACKAGE_NAME}/versions/${VERSION_ID}" 2>&1); then
              DELETED=$((DELETED + 1))
            else
              # Capture the API error body so operators can see WHY the
              # delete was refused (common causes: 404 for race-deleted
              # siblings, 422 for versions still referenced by an OCI
              # manifest crane didn't traverse, 403 for package-level
              # delete restrictions). The body goes on a single line
              # so one-liner log scans keep working.
              # Bash parameter expansion — same SIGPIPE-avoidance reason
              # as the fetch path above.
              DELETE_OUT_SINGLE_LINE=${DELETE_OUT//$'\n'/ }
              ERR_ONE_LINE=${DELETE_OUT_SINGLE_LINE:0:400}
              echo "  WARNING: Failed to delete version ${VERSION_ID}: ${ERR_ONE_LINE}"
              FAILED=$((FAILED + 1))
            fi
          done

          echo ""
          echo "Deleted ${DELETED} orphaned versions"
          if [ $FAILED -gt 0 ]; then
            echo "WARNING: Failed to delete ${FAILED} versions"
          fi
