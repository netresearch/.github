# Reusable "GHCR retention" workflow — prunes old container image versions
# from ghcr.io for a given package using a configurable retention policy.
#
# Strategy (generalized from the ofelia inline workflow):
# - Release images (matching release-tag-patterns, default v*, latest*,
#   [0-9]* — both the v-prefixed and the bare-semver scheme) are kept
#   FOREVER.
# - Edge images (matching edge-tag-patterns, default edge*) older than
#   edge-max-age-days are deleted.
# - Ghost tags (an index whose platform children have ALL disappeared, so it
#   is unpullable everywhere) are deleted when delete-ghost-images is on —
#   regardless of the release patterns, because no image is left to protect.
# - Partial tags (an index that lost SOME children, e.g. an interrupted
#   multi-arch push) are deleted when delete-partial-images is on, at any
#   age; release-tagged ones are only reported, since they still serve the
#   platforms that survived and should be repaired by re-pushing.
# - Orphaned untagged images (not referenced by any tagged manifest) older
#   than orphan-max-age-days are deleted.
# - Untagged images referenced by a tagged manifest (attestations,
#   provenance, sbom, platform manifests inside a manifest-list) are
#   preserved regardless of age.
#
# Multi-arch builds typically create multiple versions per release:
#   - N platform images (386, amd64, arm/v6, arm/v7, arm64 — usually tagged,
#     e.g. v1.2.3-amd64, edge-amd64)
#   - 2 attestation images (provenance, sbom — untagged but referenced)
# The referenced-digest scan keeps attestations alive for as long as any
# tagged manifest still points at them.
#
# See: https://github.com/actions/delete-package-versions/issues/162
#
# Caller pattern:
#
#   name: GHCR Retention
#   on:
#     schedule:
#       - cron: "0 2 * * 0"   # weekly, Sundays 02:00 UTC
#     workflow_dispatch:
#       inputs:
#         dry-run:
#           type: boolean
#           default: true
#   jobs:
#     prune:
#       uses: netresearch/.github/.github/workflows/ghcr-retention.yml@main
#       with:
#         package-name: my-app
#         dry-run: ${{ inputs.dry-run || false }}
#
# SECURITY: every caller-supplied input that lands in a `run:` step is
# pushed through the `env:` block so it cannot break out of its argument
# position via quoting/metacharacters.

name: GHCR Retention (reusable)

on:
  workflow_call:
    inputs:
      package-name:
        description: "GHCR package name to prune (e.g. 'my-app'). The owner is taken from github.repository_owner."
        required: true
        type: string
      release-tag-patterns:
        description: >-
          Comma-separated glob patterns; images whose tags match any of
          these are kept forever. Supported glob syntax: `*` (any run),
          `?` (one character) and `[...]` character classes; every other
          character matches literally.

          The default covers BOTH tagging schemes in use across the org:
          v-prefixed (`v1.2.3`) and bare semver (`11.0.8` / `11.0` / `11`,
          e.g. glpi-docker-compose-stack). Protecting bare semver by
          default is deliberate — the alternative, making every caller
          declare its own scheme, fails silently: nothing is deleted today
          only because deletion ALSO requires an edge-pattern match, so a
          caller whose releases match nothing looks fine right up until
          someone widens the edge patterns.
        required: false
        type: string
        default: "v*,latest*,[0-9]*"
      edge-tag-patterns:
        description: "Comma-separated glob patterns; images whose tags match any of these are pruned once older than edge-max-age-days."
        required: false
        type: string
        default: "edge*"
      edge-max-age-days:
        description: "Delete edge-pattern images older than this many days."
        required: false
        type: number
        default: 30
      orphan-max-age-days:
        description: "Delete orphaned untagged images older than this many days."
        required: false
        type: number
        default: 7
      delete-ghost-images:
        description: >-
          Delete GHOST tags: a tagged manifest list whose platform children
          have ALL disappeared. Such a tag cannot be pulled on any platform
          — it resolves to an index pointing at nothing — so
          `release-tag-patterns` does NOT protect it: there is no image
          left to keep. Off by default; `dry-run` lists ghosts without
          deleting them.
        required: false
        type: boolean
        default: false
      delete-partial-images:
        description: >-
          Delete PARTIAL tags: a tagged manifest list that lost SOME but
          not all of its platform children, as left behind by an
          interrupted multi-arch push. Deleted regardless of age, so the
          space is reclaimed without waiting out `orphan-max-age-days`.
          Unlike ghosts these still serve the platforms that survived, so
          a tag matching `release-tag-patterns` IS protected here and is
          only reported — repair it by re-pushing rather than losing the
          release. Off by default.
        required: false
        type: boolean
        default: false
      dry-run:
        description: "If true, list what would be deleted but don't delete."
        required: false
        type: boolean
        default: false

# CALLER REQUIREMENTS
# ===================
# When calling this reusable workflow, the caller's job-level
# `permissions:` block MUST grant at least this full set, otherwise
# the run fails with `startup_failure` before any job executes
# (GitHub rejects the workflow at startup when the reusable declares
# a permission the caller did not grant). NOTE: setting ANY scope in a
# `permissions:` block forces every UNLISTED scope to `none`, and a job
# that omits `permissions:` inherits the repository default
# (default_workflow_permissions) — so a repo hardened to `read` will
# startup-fail here unless these scopes are granted explicitly.
#
#   jobs:
#     cleanup-edge-images:
#       uses: netresearch/.github/.github/workflows/ghcr-retention.yml@main
#       permissions:
#         packages: write
jobs:
  cleanup-edge-images:
    name: Cleanup Old Edge Images
    runs-on: ubuntu-latest
    permissions:
      packages: write
    outputs:
      # Published so the broken-manifest job can reuse the compiled release
      # patterns instead of carrying a second copy of the glob converter.
      release-regex: ${{ steps.prune.outputs.release-regex }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Cleanup old edge container versions
        id: prune
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE_NAME: ${{ inputs.package-name }}
          RELEASE_TAG_PATTERNS: ${{ inputs.release-tag-patterns }}
          EDGE_TAG_PATTERNS: ${{ inputs.edge-tag-patterns }}
          EDGE_MAX_AGE_DAYS: ${{ inputs.edge-max-age-days }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail

          echo "Fetching container versions for ${PACKAGE_NAME} (owner: ${OWNER})..."
          echo "Edge retention: ${EDGE_MAX_AGE_DAYS} days"
          echo "Release tag patterns (kept forever): ${RELEASE_TAG_PATTERNS}"
          echo "Edge tag patterns (pruned): ${EDGE_TAG_PATTERNS}"
          echo "Dry run: ${DRY_RUN}"
          echo ""

          # Convert comma-separated glob patterns (e.g. "v*,latest*") to a jq
          # array of anchored regex patterns (e.g. ["^v.*$", "^latest.*$"]).
          #
          # Supported glob syntax is `*`, `?` and `[...]` character classes;
          # EVERY other character is escaped so it matches literally. The
          # previous implementation only rewrote `*` and left the rest to the
          # regex engine, so a pattern like `v1.2` also matched `v1X2` and
          # `[0-9]*` worked only by accident. That accident matters now: the
          # default release patterns contain a character class, and a default
          # must not depend on undocumented behaviour.
          glob_list_to_regex_array() {
            local list="$1"
            echo "$list" | jq -Rc '
              def glob_to_regex:
                reduce (explode | .[]) as $cp ({out: "", cls: false};
                  ([$cp] | implode) as $c
                  | if .cls then
                      (if $c == "]" then (.out += "]" | .cls = false)
                       else .out += $c end)
                    elif $c == "[" then (.out += "[" | .cls = true)
                    elif $c == "*" then .out += ".*"
                    elif $c == "?" then .out += "."
                    elif ("\\.+^$(){}|]" | index($c)) != null then .out += ("\\" + $c)
                    else .out += $c
                    end)
                | "^" + .out + "$";
              split(",")
              | map(gsub("^\\s+|\\s+$"; ""))
              | map(select(length > 0))
              | map(glob_to_regex)
            '
          }

          RELEASE_REGEX_JSON=$(glob_list_to_regex_array "$RELEASE_TAG_PATTERNS")
          EDGE_REGEX_JSON=$(glob_list_to_regex_array "$EDGE_TAG_PATTERNS")
          echo "Compiled release regex: ${RELEASE_REGEX_JSON}"
          echo "Compiled edge regex:    ${EDGE_REGEX_JSON}"
          echo ""

          # Hand the compiled release patterns to the broken-manifest job.
          # Single-line JSON, so no heredoc delimiter is needed.
          echo "release-regex=${RELEASE_REGEX_JSON}" >> "$GITHUB_OUTPUT"

          # Calculate cutoff date
          CUTOFF_DATE=$(date -d "-${EDGE_MAX_AGE_DAYS} days" -Iseconds)
          echo "Cutoff date: ${CUTOFF_DATE}"
          echo ""

          # Get all versions (paginated)
          PAGE=1
          VERSIONS_TO_DELETE=()

          while true; do
            # Fail loudly if the API call errors — previously the
            # `2>/dev/null || echo "[]"` pattern concatenated the
            # error body onto the fallback `[]`, producing TWO JSON
            # documents in $VERSIONS. `jq 'length'` then returned
            # multiline output (e.g. "3\n0" for an error object
            # followed by the empty array) and every downstream
            # bash test / jq pipeline mangled.
            if ! VERSIONS=$(gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/orgs/${OWNER}/packages/container/${PACKAGE_NAME}/versions?per_page=100&page=${PAGE}" 2>&1); then
              # Bash parameter expansion (collapse newlines, truncate).
              # Avoids `echo | tr | head` because under `set -euo pipefail`
              # the SIGPIPE that head sends back to tr makes the pipeline
              # exit non-zero, suppressing the ::error:: we want to emit.
              VERSIONS_SINGLE_LINE=${VERSIONS//$'\n'/ }
              echo "::error::Failed to fetch versions page ${PAGE}: ${VERSIONS_SINGLE_LINE:0:400}"
              exit 1
            fi

            # Check if we got any versions
            COUNT=$(echo "$VERSIONS" | jq 'length')
            if [ "$COUNT" -eq 0 ]; then
              break
            fi

            echo "Processing page ${PAGE} (${COUNT} versions)..."

            # Process each version
            while IFS= read -r version; do
              VERSION_ID=$(echo "$version" | jq -r '.id')
              CREATED_AT=$(echo "$version" | jq -r '.created_at')
              TAGS=$(echo "$version" | jq -r '.metadata.container.tags // [] | join(", ")')

              # Skip if no tags — these are likely attestations referenced by
              # manifests and are handled by the orphan-cleanup job.
              if [ -z "$TAGS" ]; then
                continue
              fi

              # Check if ANY tag matches a release pattern (kept forever)
              HAS_RELEASE_TAG=$(echo "$version" | jq -r --argjson patterns "$RELEASE_REGEX_JSON" '
                .metadata.container.tags // []
                | any(.[]; . as $t | any($patterns[]; . as $p | $t | test($p)))
              ')

              if [ "$HAS_RELEASE_TAG" = "true" ]; then
                continue
              fi

              # Check if this is an edge-pattern image
              IS_EDGE=$(echo "$version" | jq -r --argjson patterns "$EDGE_REGEX_JSON" '
                .metadata.container.tags // []
                | any(.[]; . as $t | any($patterns[]; . as $p | $t | test($p)))
              ')

              if [ "$IS_EDGE" != "true" ]; then
                continue
              fi

              # Check if older than cutoff
              if [[ "$CREATED_AT" < "$CUTOFF_DATE" ]]; then
                echo "  Version ${VERSION_ID} (tags: ${TAGS}) created ${CREATED_AT} - WILL DELETE"
                VERSIONS_TO_DELETE+=("$VERSION_ID")
              fi
            done < <(echo "$VERSIONS" | jq -c '.[]')

            PAGE=$((PAGE + 1))
          done

          echo ""
          echo "Summary: ${#VERSIONS_TO_DELETE[@]} edge versions to delete"
          echo ""

          if [ ${#VERSIONS_TO_DELETE[@]} -eq 0 ]; then
            echo "No old edge images to clean up"
            exit 0
          fi

          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY RUN - Would delete ${#VERSIONS_TO_DELETE[@]} versions"
            echo "Run with dry-run=false to actually delete"
            exit 0
          fi

          # Delete the versions
          DELETED=0
          FAILED=0
          for VERSION_ID in "${VERSIONS_TO_DELETE[@]}"; do
            echo "Deleting version ${VERSION_ID}..."
            if DELETE_OUT=$(gh api \
              --method DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/orgs/${OWNER}/packages/container/${PACKAGE_NAME}/versions/${VERSION_ID}" 2>&1); then
              DELETED=$((DELETED + 1))
            else
              # Capture the API error body so operators can see WHY the
              # delete was refused (common causes: 404 for race-deleted
              # siblings, 422 for versions still referenced by an OCI
              # manifest crane didn't traverse, 403 for package-level
              # delete restrictions). The body goes on a single line
              # so one-liner log scans keep working.
              # Bash parameter expansion — same SIGPIPE-avoidance reason
              # as the fetch path above.
              DELETE_OUT_SINGLE_LINE=${DELETE_OUT//$'\n'/ }
              ERR_ONE_LINE=${DELETE_OUT_SINGLE_LINE:0:400}
              echo "  WARNING: Failed to delete version ${VERSION_ID}: ${ERR_ONE_LINE}"
              FAILED=$((FAILED + 1))
            fi
          done

          echo ""
          echo "Deleted ${DELETED} versions"
          if [ $FAILED -gt 0 ]; then
            echo "WARNING: Failed to delete ${FAILED} versions"
          fi

  cleanup-broken-manifests:
    name: Cleanup Ghost and Partial Manifests
    runs-on: ubuntu-latest
    needs: cleanup-edge-images
    if: ${{ inputs.delete-ghost-images || inputs.delete-partial-images }}
    permissions:
      packages: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Install crane
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
        with:
          version: v0.21.5

      - name: Log in to Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete ghost and partial manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE_NAME: ${{ inputs.package-name }}
          RELEASE_REGEX_JSON: ${{ needs.cleanup-edge-images.outputs.release-regex }}
          DELETE_GHOSTS: ${{ inputs.delete-ghost-images }}
          DELETE_PARTIALS: ${{ inputs.delete-partial-images }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail

          # A multi-arch tag is an OCI index whose children are the per-platform
          # manifests. Those children are themselves package versions, so a
          # child that no longer exists leaves the index dangling:
          #   - ALL children gone   -> GHOST: unpullable on every platform.
          #   - SOME children gone  -> PARTIAL: an interrupted push; still
          #                            serves the platforms that survived.
          # Neither is age-based — a ghost is broken the second it appears, so
          # waiting out orphan-max-age-days only wastes storage.

          OWNER_LC="${OWNER,,}"
          IMAGE="ghcr.io/${OWNER_LC}/${PACKAGE_NAME}"

          echo "Image: ${IMAGE}"
          echo "Release patterns (protect partials): ${RELEASE_REGEX_JSON}"
          echo "Delete ghosts:   ${DELETE_GHOSTS}"
          echo "Delete partials: ${DELETE_PARTIALS}"
          echo "Dry run: ${DRY_RUN}"
          echo ""

          # Fetch every version once; both the child-existence set and the
          # tagged-version list are derived from it.
          ALL_VERSIONS=$(mktemp)
          echo "[]" > "$ALL_VERSIONS"
          PAGE=1
          while true; do
            if ! VERSIONS=$(gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/orgs/${OWNER}/packages/container/${PACKAGE_NAME}/versions?per_page=100&page=${PAGE}" 2>&1); then
              VERSIONS_SINGLE_LINE=${VERSIONS//$'\n'/ }
              echo "::error::Failed to fetch versions page ${PAGE}: ${VERSIONS_SINGLE_LINE:0:400}"
              exit 1
            fi
            COUNT=$(echo "$VERSIONS" | jq 'length')
            if [ "$COUNT" -eq 0 ]; then
              break
            fi
            echo "$VERSIONS" | jq -s --slurpfile prev "$ALL_VERSIONS" '$prev[0] + .[0]' > "${ALL_VERSIONS}.next"
            mv "${ALL_VERSIONS}.next" "$ALL_VERSIONS"
            PAGE=$((PAGE + 1))
          done
          echo "Fetched $(jq 'length' "$ALL_VERSIONS") package versions"

          EXISTING_DIGESTS=$(mktemp)
          jq -r '.[].name' "$ALL_VERSIONS" | sort -u > "$EXISTING_DIGESTS"

          GHOSTS=()
          PARTIALS=()

          # Fields are separated by the ASCII unit separator (0x1f), not a tab:
          # tab is an IFS *whitespace* character, so `IFS=$'\t' read` collapses
          # runs of separators and silently drops empty fields, shifting every
          # later column left. No field below can be empty today, but the tag
          # list is caller-controlled text and this is a deletion path — it must
          # not depend on that staying true.
          while IFS=$'\037' read -r VERSION_ID DIGEST TAGS IS_RELEASE; do
            MANIFEST=$(crane manifest "${IMAGE}@${DIGEST}" 2>/dev/null || echo "")
            if [ -z "$MANIFEST" ]; then
              echo "  ?       ${VERSION_ID} (tags: ${TAGS}) - manifest unreadable, skipping"
              continue
            fi

            CHILDREN=$(echo "$MANIFEST" | jq -r '.manifests[]?.digest // empty')
            if [ -z "$CHILDREN" ]; then
              # Not an index (single-platform image): its layers are blobs,
              # not package versions, so this check does not apply.
              continue
            fi

            TOTAL_CHILDREN=0
            MISSING_CHILDREN=0
            for CHILD in $CHILDREN; do
              TOTAL_CHILDREN=$((TOTAL_CHILDREN + 1))
              if grep -qxF "$CHILD" "$EXISTING_DIGESTS"; then
                continue
              fi
              # Absent from the versions listing is only a SUSPICION. Confirm
              # against the registry before counting it missing, so a listing
              # gap can never turn a healthy tag into a deletion candidate.
              if crane manifest "${IMAGE}@${CHILD}" >/dev/null 2>&1; then
                continue
              fi
              MISSING_CHILDREN=$((MISSING_CHILDREN + 1))
            done

            if [ "$MISSING_CHILDREN" -eq 0 ]; then
              continue
            fi

            if [ "$MISSING_CHILDREN" -eq "$TOTAL_CHILDREN" ]; then
              echo "  GHOST   ${VERSION_ID} (tags: ${TAGS}) - all ${TOTAL_CHILDREN} children missing"
              GHOSTS+=("$VERSION_ID")
            elif [ "$IS_RELEASE" = "true" ]; then
              echo "  PARTIAL ${VERSION_ID} (tags: ${TAGS}) - ${MISSING_CHILDREN}/${TOTAL_CHILDREN} children missing - PROTECTED by release-tag-patterns; re-push to repair"
            else
              echo "  PARTIAL ${VERSION_ID} (tags: ${TAGS}) - ${MISSING_CHILDREN}/${TOTAL_CHILDREN} children missing"
              PARTIALS+=("$VERSION_ID")
            fi
          done < <(jq -r --argjson patterns "$RELEASE_REGEX_JSON" '
            .[]
            | select((.metadata.container.tags // []) | length > 0)
            | [ (.id | tostring)
              , .name
              , ((.metadata.container.tags // []) | join(", "))
              , ( ((.metadata.container.tags // [])
                   | any(.[]; . as $t | any($patterns[]; . as $p | $t | test($p))))
                  | tostring )
              ] | join("\u001f")
          ' "$ALL_VERSIONS")

          VERSIONS_TO_DELETE=()
          if [ "$DELETE_GHOSTS" = "true" ]; then
            VERSIONS_TO_DELETE+=(${GHOSTS[@]+"${GHOSTS[@]}"})
          fi
          if [ "$DELETE_PARTIALS" = "true" ]; then
            VERSIONS_TO_DELETE+=(${PARTIALS[@]+"${PARTIALS[@]}"})
          fi

          echo ""
          echo "Summary: ${#GHOSTS[@]} ghost, ${#PARTIALS[@]} deletable partial; ${#VERSIONS_TO_DELETE[@]} selected by the current toggles"
          echo ""

          if [ ${#VERSIONS_TO_DELETE[@]} -eq 0 ]; then
            echo "Nothing to clean up"
            exit 0
          fi

          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY RUN - Would delete ${#VERSIONS_TO_DELETE[@]} versions"
            echo "Run with dry-run=false to actually delete"
            exit 0
          fi

          DELETED=0
          FAILED=0
          for VERSION_ID in "${VERSIONS_TO_DELETE[@]}"; do
            echo "Deleting version ${VERSION_ID}..."
            if DELETE_OUT=$(gh api \
              --method DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/orgs/${OWNER}/packages/container/${PACKAGE_NAME}/versions/${VERSION_ID}" 2>&1); then
              DELETED=$((DELETED + 1))
            else
              DELETE_OUT_SINGLE_LINE=${DELETE_OUT//$'\n'/ }
              ERR_ONE_LINE=${DELETE_OUT_SINGLE_LINE:0:400}
              echo "  WARNING: Failed to delete version ${VERSION_ID}: ${ERR_ONE_LINE}"
              FAILED=$((FAILED + 1))
            fi
          done

          echo ""
          echo "Deleted ${DELETED} broken manifests"
          if [ $FAILED -gt 0 ]; then
            echo "WARNING: Failed to delete ${FAILED} versions"
          fi

  cleanup-orphaned-images:
    name: Cleanup Orphaned Untagged Images
    runs-on: ubuntu-latest
    needs: [cleanup-edge-images, cleanup-broken-manifests]
    # Run after the broken-manifest pass so children freed by a partial
    # deletion are already unreferenced here. That job is skipped whenever
    # both of its toggles are off, and a skipped dependency would otherwise
    # skip this job too — hence the explicit result check rather than a bare
    # `needs:`.
    if: >-
      ${{
        !cancelled()
        && needs.cleanup-edge-images.result == 'success'
        && (needs.cleanup-broken-manifests.result == 'success'
            || needs.cleanup-broken-manifests.result == 'skipped')
      }}
    permissions:
      packages: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Install crane
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
        with:
          # Pin crane to a known-good release; `latest` broke CI in the past
          # when upstream re-tagged without backward compat.
          version: v0.21.5

      - name: Log in to Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup orphaned untagged images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE_NAME: ${{ inputs.package-name }}
          ORPHAN_MAX_AGE_DAYS: ${{ inputs.orphan-max-age-days }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail

          # Lowercase the owner for the registry path (ghcr.io requires lowercase)
          OWNER_LC="${OWNER,,}"
          IMAGE="ghcr.io/${OWNER_LC}/${PACKAGE_NAME}"

          echo "Collecting referenced digests from all tagged manifests..."
          echo "Image: ${IMAGE}"
          echo "Orphan retention: ${ORPHAN_MAX_AGE_DAYS} days"
          echo "Dry run: ${DRY_RUN}"
          echo ""

          # Calculate cutoff date
          CUTOFF_DATE=$(date -d "-${ORPHAN_MAX_AGE_DAYS} days" -Iseconds)
          echo "Cutoff date: ${CUTOFF_DATE}"
          echo ""

          # Collect all referenced digests from tagged manifests
          REFERENCED_DIGESTS=$(mktemp)
          TAGS=$(crane ls "$IMAGE" 2>/dev/null || echo "")

          if [ -z "$TAGS" ]; then
            echo "No tags found, skipping"
            exit 0
          fi

          TAG_COUNT=$(echo "$TAGS" | wc -l)
          echo "Found ${TAG_COUNT} tags, collecting referenced digests..."

          for TAG in $TAGS; do
            # Get manifest and extract all referenced digests
            MANIFEST=$(crane manifest "${IMAGE}:${TAG}" 2>/dev/null || echo "{}")

            # Extract digests from manifest list (multi-arch) or single manifest
            echo "$MANIFEST" | jq -r '
              # From manifest list
              (.manifests[]?.digest // empty),
              # From config
              (.config?.digest // empty),
              # From layers
              (.layers[]?.digest // empty)
            ' 2>/dev/null >> "$REFERENCED_DIGESTS" || true
          done

          # Sort and dedupe
          sort -u "$REFERENCED_DIGESTS" -o "$REFERENCED_DIGESTS"
          REF_COUNT=$(wc -l < "$REFERENCED_DIGESTS")
          echo "Found ${REF_COUNT} unique referenced digests"
          echo ""

          # Now find orphaned untagged versions
          echo "Scanning for orphaned untagged versions..."
          PAGE=1
          VERSIONS_TO_DELETE=()

          while true; do
            # Fail loudly if the API call errors — previously the
            # `2>/dev/null || echo "[]"` pattern concatenated the
            # error body onto the fallback `[]`, producing TWO JSON
            # documents in $VERSIONS. `jq 'length'` then returned
            # multiline output (e.g. "3\n0" for an error object
            # followed by the empty array) and every downstream
            # bash test / jq pipeline mangled.
            if ! VERSIONS=$(gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/orgs/${OWNER}/packages/container/${PACKAGE_NAME}/versions?per_page=100&page=${PAGE}" 2>&1); then
              # Bash parameter expansion (collapse newlines, truncate).
              # Avoids `echo | tr | head` because under `set -euo pipefail`
              # the SIGPIPE that head sends back to tr makes the pipeline
              # exit non-zero, suppressing the ::error:: we want to emit.
              VERSIONS_SINGLE_LINE=${VERSIONS//$'\n'/ }
              echo "::error::Failed to fetch versions page ${PAGE}: ${VERSIONS_SINGLE_LINE:0:400}"
              exit 1
            fi

            COUNT=$(echo "$VERSIONS" | jq 'length')
            if [ "$COUNT" -eq 0 ]; then
              break
            fi

            echo "Processing page ${PAGE} (${COUNT} versions)..."

            while IFS= read -r version; do
              VERSION_ID=$(echo "$version" | jq -r '.id')
              CREATED_AT=$(echo "$version" | jq -r '.created_at')
              VERSION_TAGS=$(echo "$version" | jq -r '.metadata.container.tags // [] | join(", ")')
              DIGEST=$(echo "$version" | jq -r '.name')

              # Only process untagged versions
              if [ -n "$VERSION_TAGS" ]; then
                continue
              fi

              # Check if older than cutoff
              if [[ ! "$CREATED_AT" < "$CUTOFF_DATE" ]]; then
                continue
              fi

              # Check if referenced by any manifest — these are typically
              # attestations (provenance, sbom) or platform manifests inside
              # a manifest list and must be preserved.
              if grep -qF "$DIGEST" "$REFERENCED_DIGESTS" 2>/dev/null; then
                continue
              fi

              echo "  Orphaned: ${VERSION_ID} (${DIGEST}) created ${CREATED_AT}"
              VERSIONS_TO_DELETE+=("$VERSION_ID")
            done < <(echo "$VERSIONS" | jq -c '.[]')

            PAGE=$((PAGE + 1))
          done

          rm -f "$REFERENCED_DIGESTS"

          echo ""
          echo "Summary: ${#VERSIONS_TO_DELETE[@]} orphaned untagged versions to delete"
          echo ""

          if [ ${#VERSIONS_TO_DELETE[@]} -eq 0 ]; then
            echo "No orphaned images to clean up"
            exit 0
          fi

          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY RUN - Would delete ${#VERSIONS_TO_DELETE[@]} versions"
            echo "Run with dry-run=false to actually delete"
            exit 0
          fi

          # Delete the versions
          DELETED=0
          FAILED=0
          for VERSION_ID in "${VERSIONS_TO_DELETE[@]}"; do
            echo "Deleting version ${VERSION_ID}..."
            if DELETE_OUT=$(gh api \
              --method DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/orgs/${OWNER}/packages/container/${PACKAGE_NAME}/versions/${VERSION_ID}" 2>&1); then
              DELETED=$((DELETED + 1))
            else
              # Capture the API error body so operators can see WHY the
              # delete was refused (common causes: 404 for race-deleted
              # siblings, 422 for versions still referenced by an OCI
              # manifest crane didn't traverse, 403 for package-level
              # delete restrictions). The body goes on a single line
              # so one-liner log scans keep working.
              # Bash parameter expansion — same SIGPIPE-avoidance reason
              # as the fetch path above.
              DELETE_OUT_SINGLE_LINE=${DELETE_OUT//$'\n'/ }
              ERR_ONE_LINE=${DELETE_OUT_SINGLE_LINE:0:400}
              echo "  WARNING: Failed to delete version ${VERSION_ID}: ${ERR_ONE_LINE}"
              FAILED=$((FAILED + 1))
            fi
          done

          echo ""
          echo "Deleted ${DELETED} orphaned versions"
          if [ $FAILED -gt 0 ]; then
            echo "WARNING: Failed to delete ${FAILED} versions"
          fi
