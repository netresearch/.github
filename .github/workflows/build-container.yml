name: Build and Push Container Image

on:
  workflow_call:
    inputs:
      image-name:
        description: "Image name without registry prefix (e.g. my-app). Final image: <registry>/<repo-owner>/<image-name>."
        required: true
        type: string
      ref:
        description: "Git ref to build (short form, e.g. 'v1.3.0', 'main', or a SHA). Used for both checkout and semver tag extraction. Leave empty to use the caller's github.ref."
        required: false
        type: string
        default: ""
      platforms:
        description: "Comma-separated build platforms."
        required: false
        type: string
        default: "linux/amd64,linux/arm64"
      context:
        description: "Build context path."
        required: false
        type: string
        default: "."
      dockerfile:
        description: "Path to Dockerfile."
        required: false
        type: string
        default: "./Dockerfile"
      registry:
        description: "Container registry."
        required: false
        type: string
        default: "ghcr.io"
      push:
        description: "Push the built image. Set false for validation-only builds (e.g. on pull_request)."
        required: false
        type: boolean
        default: true
      load:
        description: >-
          Load the built image into the local docker image store
          (docker/build-push-action `load`). This is what makes `scan: true`
          effective on validation-only builds: with push=false there is no
          registry reference, so Trivy can only read the image if it was
          loaded. Requires a SINGLE platform - the docker exporter cannot
          export a multi-platform build - and is ignored when push=true
          (buildx cannot drive the docker and registry exporters in one
          invocation; the pushed image is scanned by digest instead).
          Matches the input build-container-bake.yml already has.
          Default false = previous behaviour.
        required: false
        type: boolean
        default: false
      trivy-severity:
        description: "Trivy severity filter."
        required: false
        type: string
        default: "CRITICAL,HIGH"
      scan:
        description: >-
          Run Trivy and upload SARIF. With push=true the pushed image is
          scanned by digest. With push=false the LOCALLY built image is
          scanned, which requires load=true (single-platform); if neither
          push nor load is set the workflow emits a warning and skips the
          scan instead of silently doing nothing.
        required: false
        type: boolean
        default: true
      sign:
        description: "Cosign keyless OIDC sign the pushed image by digest. Requires push=true."
        required: false
        type: boolean
        default: false
      attest:
        description: "Generate SLSA build provenance attestation for the pushed image (actions/attest-build-provenance). Requires push=true."
        required: false
        type: boolean
        default: false
      pre-build-command:
        description: "Shell command(s) run after checkout and before docker build. Useful for downloading release binaries into the build context when the Dockerfile expects pre-built artifacts (e.g. gh release download ...)."
        required: false
        type: string
        default: ""
      target:
        description: "Multi-stage build target / stage. Empty = build the default (last) stage."
        required: false
        type: string
        default: ""
      build-args:
        description: "Newline-separated KEY=VALUE build args passed verbatim to docker/build-push-action. Use this when the Dockerfile expects ARGs (snipe-it: SNIPE_IT_VERSION, BUILD_DATE, VCS_REF, ROLLING_DEPS)."
        required: false
        type: string
        default: ""
      cache-scope:
        description: "Optional GHA cache scope name. Set this when multiple parallel matrix calls share the same image-name but should keep their build cache separate (e.g. caller's matrix is track × composer-mode). Empty = share one global cache (current default behaviour)."
        required: false
        type: string
        default: ""
      provenance:
        description: "Buildx provenance mode (passed to docker/build-push-action's `provenance:` input). Common values: empty (action default), 'mode=max', 'false'. Note: this is the in-image attestation, distinct from the SLSA attestation produced by `attest: true` (which uses actions/attest-build-provenance)."
        required: false
        type: string
        default: ""
      sbom:
        description: "Generate in-image SBOM (passed to docker/build-push-action's `sbom:` input). Off by default."
        required: false
        type: boolean
        default: false
      metadata-tags:
        description: "Caller-provided override for docker/metadata-action's `tags:` input. When set, REPLACES the reusable's default 5 patterns (ref-branch / ref-pr / semver-{version,major.minor,major}). Use this for callers with bespoke tag fan-out (e.g. snipe-it: `:8.5.0`, `:8.5`, `:8`, plus `-rolling` suffix variants)."
        required: false
        type: string
        default: ""
      metadata-labels:
        description: "Caller-provided OCI labels (newline-separated KEY=VALUE), appended to the labels docker/metadata-action auto-generates (created/revision/source/etc.). Use this to set image.title, image.description, image.licenses overrides."
        required: false
        type: string
        default: ""
    outputs:
      digest:
        description: "Digest of the pushed image (sha256:...). Empty when push=false."
        value: ${{ jobs.build.outputs.digest }}
      image_ref:
        description: "Full image reference <registry>/<owner>/<image-name>."
        value: ${{ jobs.build.outputs.image_ref }}
      tags:
        description: "Newline-separated list of pushed tags (from docker/metadata-action). Empty when push=false."
        value: ${{ jobs.build.outputs.tags }}

# CALLER REQUIREMENTS
# ===================
# When calling this reusable workflow, the caller's job-level
# `permissions:` block MUST grant at least this full set, otherwise
# push-event runs fail with `startup_failure` before any job runs
# (GitHub rejects the workflow at startup when the reusable declares
# permissions not covered by the caller — even if the specific
# permission is only needed for an optional feature like sign/attest).
#
#   jobs:
#     build:
#       uses: netresearch/.github/.github/workflows/build-container.yml@main
#       permissions:
#         contents: read
#         packages: write
#         security-events: write
#         id-token: write       # required — even when sign/attest=false
#         attestations: write   # required — even when sign/attest=false
#       with:
#         image-name: my-app
permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build Container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image_ref: ${{ env.IMAGE_REF }}
      tags: ${{ steps.meta.outputs.tags }}
    env:
      IMAGE_REF: ${{ inputs.registry }}/${{ github.repository_owner }}/${{ inputs.image-name }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Run pre-build command
        if: inputs.pre-build-command != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRE_BUILD_CMD: ${{ inputs.pre-build-command }}
        run: |
          set -euo pipefail
          echo "::group::pre-build-command"
          bash -euo pipefail -c "$PRE_BUILD_CMD"
          echo "::endgroup::"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Compute default metadata tag patterns
        if: inputs.metadata-tags == ''
        id: default_patterns
        env:
          SEMVER_REF: ${{ inputs.ref || github.ref_name }}
          REF_PROVIDED: ${{ inputs.ref != '' && 'true' || 'false' }}
          IS_TAG_PUSH: ${{ startsWith(github.ref, 'refs/tags/') && 'true' || 'false' }}
        run: |
          set -euo pipefail
          if [[ "$REF_PROVIDED" == "true" || "$IS_TAG_PUSH" == "true" ]]; then
            EN_SEMVER=true
          else
            EN_SEMVER=false
          fi
          if [[ "$REF_PROVIDED" == "true" ]]; then
            EN_REF=false
          else
            EN_REF=true
          fi
          {
            echo 'patterns<<EOM'
            echo "type=ref,event=branch,enable=${EN_REF}"
            echo "type=ref,event=pr,enable=${EN_REF}"
            echo "type=semver,pattern={{version}},value=${SEMVER_REF},enable=${EN_SEMVER}"
            echo "type=semver,pattern={{major}}.{{minor}},value=${SEMVER_REF},enable=${EN_SEMVER}"
            echo "type=semver,pattern={{major}},value=${SEMVER_REF},enable=${EN_SEMVER}"
            echo 'EOM'
          } >> "$GITHUB_OUTPUT"

      - name: Gather Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_REF }}
          # Caller-supplied `metadata-tags` overrides the reusable's default 5
          # patterns entirely. Empty (default) → fall back to the default
          # patterns computed in the step above.
          tags: ${{ inputs.metadata-tags != '' && inputs.metadata-tags || steps.default_patterns.outputs.patterns }}
          # Caller-supplied `metadata-labels` are appended to the auto-
          # generated set (created/revision/source/etc.) rather than
          # replacing them.
          labels: ${{ inputs.metadata-labels }}

      - name: Resolve local scan reference
        # Validation builds only. On the push path Trivy scans by digest and
        # needs nothing from here. Emits a warning (not a failure) when the
        # caller asked for a scan that cannot be performed, so the previously
        # SILENT no-op - scan: true together with push: false - is now visible
        # in the run instead of quietly skipping.
        id: scan_ref
        if: inputs.scan && !inputs.push
        env:
          LOAD: ${{ inputs.load }}
          PLATFORMS: ${{ inputs.platforms }}
          META_JSON: ${{ steps.meta.outputs.json }}
        run: |
          set -euo pipefail
          if [[ "$LOAD" != "true" ]]; then
            echo "::warning title=Container image not scanned::scan=true but push=false and load=false, so the built image exists nowhere Trivy can read it. Pass load: true (single-platform) to scan the locally built image."
            exit 0
          fi
          if [[ "$PLATFORMS" == *,* ]]; then
            echo "::error title=load requires a single platform::The docker exporter cannot export a multi-platform build to the local image store (platforms='${PLATFORMS}'). Set exactly one platform on validation builds, or set load: false." >&2
            exit 1
          fi
          REF="$(jq -r '.tags[0] // empty' <<<"$META_JSON")"
          if [[ -z "$REF" ]]; then
            echo "::warning title=Container image not scanned::docker/metadata-action produced no tags, so the loaded image has no reference for Trivy to resolve."
            exit 0
          fi
          # Random heredoc delimiter: $REF derives from caller-supplied inputs
          # (image-name / metadata-tags).
          delim="EOM_$(openssl rand -hex 8)"
          {
            echo "ref<<${delim}"
            printf '%s\n' "$REF"
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"
          echo "Local scan target: ${REF}"

      - name: Log in to ${{ inputs.registry }}
        if: inputs.push
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          BUILD_CONTEXT: ${{ inputs.context }}
          DOCKERFILE: ${{ inputs.dockerfile }}
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.DOCKERFILE }}
          target: ${{ inputs.target }}
          push: ${{ inputs.push }}
          # `load` is honoured on validation builds only: buildx cannot drive
          # the docker exporter and the registry exporter in one invocation.
          load: ${{ inputs.load && !inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ inputs.platforms }}
          build-args: ${{ inputs.build-args }}
          # The docker exporter used by `--load` cannot carry attestations, so
          # a loaded validation build forces provenance/SBOM off. The truthy
          # branch holds the NON-EMPTY string 'false' on purpose: an empty
          # string is falsy in GitHub expressions and would fall through to the
          # caller's value. Mirrors build-container-bake.yml.
          provenance: ${{ (inputs.load && !inputs.push) && 'false' || inputs.provenance }}
          sbom: ${{ (inputs.load && !inputs.push) && 'false' || inputs.sbom }}
          # cache-scope: when set, both cache-from and cache-to suffix the GHA
          # scope so parallel matrix calls keep separate caches. When empty,
          # the GHA action uses a single default-scope cache (backwards
          # compatible with the pre-cache-scope reusable).
          cache-from: type=gha${{ inputs.cache-scope != '' && format(',scope={0}', inputs.cache-scope) || '' }}
          cache-to: type=gha,mode=max${{ inputs.cache-scope != '' && format(',scope={0}', inputs.cache-scope) || '' }}

      - name: Run Trivy vulnerability scanner
        id: trivy
        # push=true  -> scan the pushed image by digest (unchanged).
        # push=false -> scan the image loaded into the local docker store;
        #               steps.scan_ref.outputs.ref is empty when that was not
        #               possible, and the step skips (a warning was emitted).
        if: inputs.scan && (inputs.push || steps.scan_ref.outputs.ref != '')
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ inputs.push && format('{0}@{1}', env.IMAGE_REF, steps.build.outputs.digest) || steps.scan_ref.outputs.ref }}
          format: "sarif"
          output: "trivy-results.sarif"
          severity: ${{ inputs.trivy-severity }}
          scanners: "vuln,config,secret"

      - name: Upload Trivy results to GitHub Security
        # Skip on merge_group: the gh-readonly-queue ref is deleted by GitHub
        # the moment the merge completes, racing with codeql-action/upload-sarif
        # and producing a guaranteed `ref ... not found` failure. Push and
        # release events run with stable refs.
        #
        # Skip on FORK pull requests: GitHub issues a read-only GITHUB_TOKEN for
        # `pull_request` runs from a fork no matter what the caller granted, so
        # `security-events: write` is not effective and the upload would fail
        # with HTTP 403. Same-repo PR branches upload normally - that is the
        # case this workflow now covers. The scan itself still runs on fork PRs
        # and reports in the job log.
        if: >-
          inputs.scan
          && (inputs.push || steps.scan_ref.outputs.ref != '')
          && github.event_name != 'merge_group'
          && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
          && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@e0647621c2984b5ed2f768cb892365bf2a616ad1 # v4.37.2
        with:
          sarif_file: "trivy-results.sarif"
          category: "container-scan"

      - name: Install Cosign
        if: inputs.sign && inputs.push
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with Cosign (keyless OIDC)
        if: inputs.sign && inputs.push
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # Sign by digest to cover all tags pointing at this image (recommended practice).
          cosign sign --yes "${IMAGE_REF}@${DIGEST}"

      - name: Generate SLSA build provenance attestation
        if: inputs.attest && inputs.push
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.IMAGE_REF }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
