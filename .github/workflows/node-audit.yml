name: Node.js Dependency Audit

on:
  workflow_call:
    inputs:
      audit-level:
        description: 'Minimum severity to fail on (low, moderate, high, critical)'
        required: false
        type: string
        default: 'high'
      package-manager:
        description: 'Package manager to use (npm, pnpm, yarn, bun)'
        required: false
        type: string
        default: 'npm'
      node-version:
        description: 'Node.js version (e.g. 22, lts/*). Used when node-version-file is empty.'
        required: false
        type: string
        default: 'lts/*'
      node-version-file:
        description: 'Node version file (e.g. .nvmrc, .node-version, package.json). Takes precedence over node-version when non-empty.'
        required: false
        type: string
        default: ''
      pnpm-version:
        description: 'pnpm version (only used when package-manager is pnpm and packageManager is not set in package.json)'
        required: false
        type: string
        default: 'latest'

permissions: {}

jobs:
  node-audit:
    name: Node.js Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Detect packageManager field
        id: detect-pm
        if: inputs.package-manager == 'pnpm'
        run: |
          if grep -q '"packageManager"' package.json 2>/dev/null; then
            echo "has_package_manager=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_package_manager=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm (from packageManager field)
        if: inputs.package-manager == 'pnpm' && steps.detect-pm.outputs.has_package_manager == 'true'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup pnpm (explicit version)
        if: inputs.package-manager == 'pnpm' && steps.detect-pm.outputs.has_package_manager != 'true'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: ${{ inputs.pnpm-version }}

      - name: Setup Bun
        if: inputs.package-manager == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Enable Corepack
        if: inputs.package-manager == 'yarn'
        run: corepack enable

      - name: Setup Node (from version file)
        if: inputs.node-version-file != ''
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ${{ inputs.node-version-file }}

      - name: Setup Node (explicit version)
        if: inputs.node-version-file == ''
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Run audit (bun)
        if: inputs.package-manager == 'bun'
        env:
          AUDIT_LEVEL: ${{ inputs.audit-level }}
        run: |
          bun install --frozen-lockfile
          npm i --package-lock-only
          npm audit --audit-level="$AUDIT_LEVEL"

      - name: Run audit (pnpm)
        if: inputs.package-manager == 'pnpm'
        env:
          AUDIT_LEVEL: ${{ inputs.audit-level }}
        run: pnpm audit --audit-level="$AUDIT_LEVEL"

      - name: Run audit (npm)
        if: inputs.package-manager == 'npm'
        env:
          AUDIT_LEVEL: ${{ inputs.audit-level }}
        run: npm audit --audit-level="$AUDIT_LEVEL"

      - name: Run audit (yarn)
        if: inputs.package-manager == 'yarn'
        env:
          AUDIT_LEVEL: ${{ inputs.audit-level }}
        run: yarn npm audit --severity "$AUDIT_LEVEL"
