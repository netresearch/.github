# Reusable "template drift check" — compares a consuming repo's .github/
# tree against the canonical template in this repo. Fails CI when a
# governed file diverges beyond the exceptions below, unless explicitly
# listed in the consumer's .github/template.yaml `intentional-drift:` field.
#
# Caller pattern (in the consuming repo, from the template):
#
#   jobs:
#     drift:
#       uses: netresearch/.github/.github/workflows/check-template-drift.yml@main
#       with:
#         template: go-app   # or go-lib
#
# Governance contract:
#   - The template directory templates/<template>/.github/ is the source
#     of truth. Every file in it must exist in the consumer and must
#     behave identically, with the exceptions below.
#   - YAML files are compared as parsed documents, not as bytes: a file
#     that differs only in comments, key order or whitespace runs exactly
#     the same and is reported as a notice, not a failure. Non-YAML files
#     are still compared byte-for-byte.
#   - A workflow file whose only difference is the full commit SHA of the same
#     action, in a job-level or step-level `uses:`, is reported as a notice,
#     not a failure, so a pin bump in the template or in a consumer does not
#     fail unrelated pull requests. Any other `uses:` difference is drift.
#     Consumers can opt into pin-difference failures with the exact YAML boolean
#     `strict-pins: true` in their .github/template.yaml metadata.
#   - That SHA is verified online with the job's token, which needs no scope
#     beyond `contents: read` for a public action: a commit in no branch or tag
#     of the action's own repository, such as one that exists only in a fork,
#     fails the check. GitHub serves fork commits through the parent repository,
#     so resolving the SHA would prove nothing: the check clones the action's
#     commits and looks for the SHA among them. When that fails the file is
#     tolerated with a warning naming the pin, not a notice.
#   - Consumer's `.github/template.yaml` is metadata; its content is
#     expected to differ per-repo (different intentional-drift list) and
#     is never in the diff comparison.
#   - `intentional-drift:` entries are paths, relative to consumer root
#     (e.g. `.github/workflows/ci.yml`). Matching paths are exempt.

name: Template Drift Check (reusable)

on:
  workflow_call:
    inputs:
      template:
        description: "Template directory to validate against. Matches a subfolder of netresearch/.github/templates/."
        type: string
        required: true
      templates-repo:
        description: "Repository hosting templates/ (default: netresearch/.github)."
        type: string
        default: "netresearch/.github"
      templates-ref:
        description: "Ref of templates-repo to compare against."
        type: string
        default: "main"

# CALLER REQUIREMENTS
# ===================
# When calling this reusable workflow, the caller's job-level
# `permissions:` block MUST grant at least this full set, otherwise
# the run fails with `startup_failure` before any job executes
# (GitHub rejects the workflow at startup when the reusable declares
# a permission the caller did not grant). NOTE: setting ANY scope in a
# `permissions:` block forces every UNLISTED scope to `none`, and a job
# that omits `permissions:` inherits the repository default
# (default_workflow_permissions) — so a repo hardened to `read` will
# startup-fail here unless these scopes are granted explicitly.
#
#   jobs:
#     drift:
#       uses: netresearch/.github/.github/workflows/check-template-drift.yml@main
#       permissions:
#         contents: read
permissions: {}

jobs:
  drift:
    name: Template drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout consumer repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: consumer

      - name: Checkout templates repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ inputs.templates-repo }}
          ref: ${{ inputs.templates-ref }}
          persist-credentials: false
          path: templates-src

      - name: Compare consumer against template
        env:
          TEMPLATE_NAME: ${{ inputs.template }}
          TEMPLATES_REPO: ${{ inputs.templates-repo }}
          TEMPLATES_REF: ${{ inputs.templates-ref }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          CONSUMER_ROOT="$GITHUB_WORKSPACE/consumer"
          TEMPLATES_SRC="$GITHUB_WORKSPACE/templates-src"
          TEMPLATE_ROOT="$TEMPLATES_SRC/templates/${TEMPLATE_NAME}"

          if [ ! -d "$TEMPLATE_ROOT" ]; then
            echo "::error::Template directory $TEMPLATE_ROOT does not exist in ${TEMPLATES_REPO}@${TEMPLATES_REF}."
            exit 1
          fi

          # Same comparison scripts/check-drift.sh runs locally, so a local
          # verdict and this job's verdict cannot disagree.
          python3 "$TEMPLATES_SRC/scripts/drift_compare.py" "$CONSUMER_ROOT" "$TEMPLATE_ROOT"
