#
# Reusable "Ansible Galaxy release" — imports an Ansible role into
# Ansible Galaxy on a version tag. Centralizes the checkout +
# robertdebock/galaxy-action pair that is currently inlined across the
# netresearch ansible-role-* repos (ansible_role_docker_containers,
# ansible-role-gitlab-runner, …), so the pinned action versions live in
# ONE place instead of being bumped per role by Renovate/Dependabot.
#
# The role's own release trigger stays in the caller (it is repo-local:
# `on: push: tags: ['v*']`). This reusable owns the import step from the
# checkout onward.
#
# Caller pattern:
#
#   name: Release
#   on:
#     push:
#       tags:
#         - "v*"
#   permissions: {}
#   jobs:
#     galaxy:
#       uses: netresearch/.github/.github/workflows/ansible-galaxy-release.yml@main
#       secrets:
#         galaxy_api_key: ${{ secrets.GALAXY_API_KEY }}
#
# SECURITY: pinned action SHAs, harden-runner, least-privilege per-job
# permissions, `persist-credentials: false` on checkout. The Galaxy API
# key is passed as a `workflow_call` secret (never an input, never
# interpolated into a run block).

name: Ansible Galaxy Release (reusable)

on:
  workflow_call:
    inputs:
      git-branch:
        description: >-
          Branch galaxy-action imports the role from. Ansible Galaxy
          imports from a branch head, not the tag; keep this at the role's
          default branch.
        required: false
        type: string
        default: "main"
    secrets:
      galaxy_api_key:
        description: >-
          Ansible Galaxy API key (galaxy.ansible.com → Preferences → API
          key). Store as a repository secret (e.g. GALAXY_API_KEY) and pass
          it through from the caller.
        required: true

# CALLER REQUIREMENTS
# ===================
# The caller's job that `uses:` this reusable needs no elevated
# permissions — the import authenticates with the Galaxy API key, not the
# GITHUB_TOKEN. `contents: read` (the default `read` this reusable
# requests per job) is sufficient. A repo hardened to the `read` default
# workflow permission works without an explicit `permissions:` block on
# the calling job.
permissions: {}

jobs:
  galaxy:
    name: Publish on Ansible Galaxy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Import role into Ansible Galaxy
        uses: robertdebock/galaxy-action@7d89099e09f4385ec4b53eb58c0d120f1ad806dd # 1.2.1
        with:
          galaxy_api_key: ${{ secrets.galaxy_api_key }}
          git_branch: ${{ inputs.git-branch }}
