#
# Reusable "Ansible Galaxy release" — imports an Ansible role into
# Ansible Galaxy on a version tag, and optionally creates a matching
# GitHub Release. Centralizes the checkout + robertdebock/galaxy-action
# (and the checkout + `gh release create`) pairs that are currently
# inlined across the netresearch ansible-role-* repos
# (ansible_role_docker_containers, ansible-role-gitlab-runner, …), so the
# pinned action versions live in ONE place instead of being bumped per
# role by Renovate/Dependabot.
#
# The role's own release trigger stays in the caller (it is repo-local:
# `on: push: tags: ['v*']`). This reusable owns everything from the
# checkout onward.
#
# Caller pattern (Galaxy import only):
#
#   name: Release
#   on:
#     push:
#       tags:
#         - "v*"
#   permissions: {}
#   jobs:
#     release:
#       uses: netresearch/.github/.github/workflows/ansible-galaxy-release.yml@main
#       secrets:
#         galaxy_api_key: ${{ secrets.GALAXY_API_KEY }}
#
# Caller pattern (Galaxy import + GitHub Release):
#
#   jobs:
#     release:
#       uses: netresearch/.github/.github/workflows/ansible-galaxy-release.yml@main
#       permissions:
#         contents: write        # required for the GitHub Release
#       with:
#         create-github-release: true
#       secrets:
#         galaxy_api_key: ${{ secrets.GALAXY_API_KEY }}
#
# SECURITY: pinned action SHAs, harden-runner, least-privilege per-job
# permissions, `persist-credentials: false` on checkout. The Galaxy API
# key is passed as a `workflow_call` secret (never an input, never
# interpolated into a run block). The release tag is read from
# `github.ref_name` via `env:` (never interpolated into a run block).

name: Ansible Galaxy Release (reusable)

on:
  workflow_call:
    inputs:
      git-branch:
        description: >-
          Branch galaxy-action imports the role from. Ansible Galaxy
          imports from a branch head, not the tag; keep this at the role's
          default branch.
        required: false
        type: string
        default: "main"
      create-github-release:
        description: >-
          Also create a GitHub Release for the pushed tag (auto-generated
          notes). Requires the calling job to grant `contents: write`.
        required: false
        type: boolean
        default: false
    secrets:
      galaxy_api_key:
        description: >-
          Ansible Galaxy API key (galaxy.ansible.com → Preferences → API
          key). Store as a repository secret (e.g. GALAXY_API_KEY) and pass
          it through from the caller.
        required: true

# CALLER REQUIREMENTS
# ===================
# The `galaxy` job authenticates with the Galaxy API key, not the
# GITHUB_TOKEN, so it needs only `contents: read` — a repo on the `read`
# default workflow permission works with no `permissions:` block on the
# calling job.
#
# When `create-github-release: true`, the calling job MUST additionally
# grant `contents: write`, otherwise the run fails with `startup_failure`
# (GitHub rejects a reusable that requests a permission the caller did not
# grant). Setting any scope forces all unlisted scopes to `none`, so grant
# it explicitly:
#
#   jobs:
#     release:
#       uses: netresearch/.github/.github/workflows/ansible-galaxy-release.yml@main
#       permissions:
#         contents: write
permissions: {}

jobs:
  galaxy:
    name: Publish on Ansible Galaxy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Import role into Ansible Galaxy
        uses: robertdebock/galaxy-action@7d89099e09f4385ec4b53eb58c0d120f1ad806dd # 1.2.1
        with:
          galaxy_api_key: ${{ secrets.galaxy_api_key }}
          git_branch: ${{ inputs.git-branch }}

  github-release:
    name: Create GitHub Release
    if: ${{ inputs.create-github-release }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create GitHub Release from the pushed tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --repo "$REPO" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag
