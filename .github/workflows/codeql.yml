name: CodeQL

# Reusable CodeQL analysis.
#
# The `languages` input accepts one of:
#   - `auto` — in-repo detection: always includes `go`; adds
#     `javascript-typescript` when a `package.json` exists or any
#     `.ts` / `.tsx` / `.mts` source is present in the first 4 levels
#     of the tree. This is the preferred value for Go repos since it
#     picks up JS/TS tooling automatically.
#   - a single CodeQL language, e.g. `go`
#   - a comma-separated list, e.g. `go,javascript-typescript`
#
# A `prepare` job normalizes the input into a JSON array, then
# `analyze` fans out as a matrix so that each language gets its own
# init+analyse pass and emits a distinct `/language:<lang>` SARIF
# category.
#
# Callers passing a single language keep working unchanged (1-element
# matrix). Callers passing multiple languages now get correct per-
# language SARIF categories instead of a single colliding one.

on:
  workflow_call:
    inputs:
      languages:
        description: >-
          CodeQL language(s) to analyze. Accepts `auto` (always includes
          `go`; adds `javascript-typescript` when a package.json or TS
          source is present), a single language (e.g. `go`), or a
          comma-separated list (e.g. `go,javascript-typescript`).
        type: string
        default: actions

# CALLER REQUIREMENTS
# ===================
# When calling this reusable workflow, the caller's job-level
# `permissions:` block MUST grant at least this full set, otherwise
# the run fails with `startup_failure` before any job executes
# (GitHub rejects the workflow at startup when the reusable declares
# a permission the caller did not grant). NOTE: setting ANY scope in a
# `permissions:` block forces every UNLISTED scope to `none`, and a job
# that omits `permissions:` inherits the repository default
# (default_workflow_permissions) — so a repo hardened to `read` will
# startup-fail here unless these scopes are granted explicitly.
#
#   jobs:
#     prepare:
#       uses: netresearch/.github/.github/workflows/codeql.yml@main
#       permissions:
#         actions: read
#         contents: read
#         security-events: write
permissions: {}

jobs:
  prepare:
    name: Prepare languages
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      languages: ${{ steps.split.outputs.languages }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout (only needed when auto-detecting)
        if: ${{ inputs.languages == 'auto' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Split languages into JSON array
        id: split
        env:
          LANGUAGES: ${{ inputs.languages }}
        run: |
          set -euo pipefail
          # `auto` triggers in-repo detection: Go is assumed, plus JS/TS if
          # there's a package.json or any TS source. Explicit lists still
          # win — pass `languages: go` or `languages: go,javascript-typescript`.
          if [ "$LANGUAGES" = "auto" ]; then
            langs="go"
            if [ -f package.json ] || [ -n "$(find . -maxdepth 4 -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.mts' \) 2>/dev/null | head -1)" ]; then
              langs="${langs},javascript-typescript"
            fi
            LANGUAGES="$langs"
          fi
          # Normalize: strip whitespace, drop empties, emit a JSON array.
          json="$(
            printf '%s' "$LANGUAGES" \
              | tr ',' '\n' \
              | awk 'NF { gsub(/^[ \t]+|[ \t]+$/, "", $0); if ($0 != "") print }' \
              | jq -R . \
              | jq -s -c .
          )"
          if [ "$json" = "[]" ]; then
            echo "::error::No languages provided to codeql.yml (input 'languages' is empty)."
            exit 1
          fi
          echo "languages=$json" >> "$GITHUB_OUTPUT"

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.prepare.outputs.languages) }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e46ed2cbd01164d986452f91f178727624ae40d7 # v4.35.3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@e46ed2cbd01164d986452f91f178727624ae40d7 # v4.35.3
        with:
          category: /language:${{ matrix.language }}
