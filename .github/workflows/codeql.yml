name: CodeQL

# Reusable CodeQL analysis.
#
# The `languages` input accepts one of:
#   - `auto` — in-repo detection: always includes `go`; adds
#     `javascript-typescript` when a `package.json` exists OR any
#     `.js` / `.jsx` / `.mjs` / `.cjs` / `.ts` / `.tsx` / `.mts` / `.cts`
#     source is present in the first 8 levels of the tree (ignoring
#     `node_modules/`, `vendor/` and `.git/`). A `package.json` is NOT
#     required —
#     repos with a hand-written plain-JS frontend still get scanned. This
#     is the preferred value for Go repos since it picks up JS/TS
#     automatically.
#   - a single CodeQL language, e.g. `go`
#   - a comma-separated list, e.g. `go,javascript-typescript`
#
# A `prepare` job normalizes the input into a JSON array, then
# `analyze` fans out as a matrix so that each language gets its own
# init+analyse pass and emits a distinct `/language:<lang>` SARIF
# category.
#
# Callers passing a single language keep working unchanged (1-element
# matrix). Callers passing multiple languages now get correct per-
# language SARIF categories instead of a single colliding one.

on:
  workflow_call:
    inputs:
      languages:
        description: >-
          CodeQL language(s) to analyze. Accepts `auto` (always includes
          `go`; adds `javascript-typescript` when a package.json or TS
          source is present), a single language (e.g. `go`), or a
          comma-separated list (e.g. `go,javascript-typescript`).
        type: string
        default: actions
      pre-build-cmd-go:
        description: >-
          Optional shell snippet executed for the Go matrix entry only,
          after CodeQL init and before `analyze` runs the autobuilder.
          Use for code-generation steps whose outputs must exist for the
          Go extractor — e.g. `templ generate`, protobuf, OpenAPI
          clients. Runs under `bash -euo pipefail`. Go is on PATH here
          because CodeQL init installed it for this matrix entry.
        type: string
        default: ''
      pre-build-cmd-javascript-typescript:
        description: >-
          Optional shell snippet executed for the JS/TS matrix entry
          only, after CodeQL init and before `analyze`. Use for steps
          like `bun install && bun run codegen` whose outputs must exist
          for the JS/TS extractor. Runs under `bash -euo pipefail`.
          Node.js / Bun are NOT installed automatically — add an
          `actions/setup-node` step in the snippet if you need them, or
          fork this workflow.
        type: string
        default: ''

# CALLER REQUIREMENTS
# ===================
# When calling this reusable workflow, the caller's job-level
# `permissions:` block MUST grant at least this full set, otherwise
# the run fails with `startup_failure` before any job executes
# (GitHub rejects the workflow at startup when the reusable declares
# a permission the caller did not grant). NOTE: setting ANY scope in a
# `permissions:` block forces every UNLISTED scope to `none`, and a job
# that omits `permissions:` inherits the repository default
# (default_workflow_permissions) — so a repo hardened to `read` will
# startup-fail here unless these scopes are granted explicitly.
#
#   jobs:
#     prepare:
#       uses: netresearch/.github/.github/workflows/codeql.yml@main
#       permissions:
#         actions: read
#         contents: read
#         security-events: write
permissions: {}

jobs:
  prepare:
    name: Prepare languages
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      languages: ${{ steps.split.outputs.languages }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout (only needed when auto-detecting)
        if: ${{ inputs.languages == 'auto' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Split languages into JSON array
        id: split
        env:
          LANGUAGES: ${{ inputs.languages }}
        run: |
          set -euo pipefail
          # `auto` triggers in-repo detection: Go is assumed, plus JS/TS if
          # there's a package.json OR any JS/TS source file. A package.json is
          # NOT required — repos with hand-written .js (no build step / no
          # node_modules, e.g. a plain static frontend) still get scanned.
          # Explicit lists still win — pass `languages: go` or
          # `languages: go,javascript-typescript`.
          if [ "$LANGUAGES" = "auto" ]; then
            langs="go"
            # Prune node_modules/vendor/.git (not our source; huge and deep),
            # then look for any first-party JS/TS file. maxdepth 8 reaches
            # nested layouts like internal/web/static/js/*.js (depth 5).
            if [ -f package.json ] || [ -n "$(find . -maxdepth 8 \
                \( -type d \( -name node_modules -o -name vendor -o -name .git \) -prune \) -o \
                \( -type f \( -name '*.js' -o -name '*.jsx' -o -name '*.mjs' -o -name '*.cjs' \
                   -o -name '*.ts' -o -name '*.tsx' -o -name '*.mts' -o -name '*.cts' \) -print \) \
                2>/dev/null | head -1)" ]; then
              langs="${langs},javascript-typescript"
            fi
            LANGUAGES="$langs"
          fi
          # Normalize: strip whitespace, drop empties, emit a JSON array.
          json="$(
            printf '%s' "$LANGUAGES" \
              | tr ',' '\n' \
              | awk 'NF { gsub(/^[ \t]+|[ \t]+$/, "", $0); if ($0 != "") print }' \
              | jq -R . \
              | jq -s -c .
          )"
          if [ "$json" = "[]" ]; then
            echo "::error::No languages provided to codeql.yml (input 'languages' is empty)."
            exit 1
          fi
          echo "languages=$json" >> "$GITHUB_OUTPUT"

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.prepare.outputs.languages) }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e0647621c2984b5ed2f768cb892365bf2a616ad1 # v4.37.2
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Run Go pre-build command
        if: ${{ matrix.language == 'go' && inputs.pre-build-cmd-go != '' }}
        env:
          PRE_BUILD_CMD: ${{ inputs.pre-build-cmd-go }}
        run: bash -euo pipefail -c "$PRE_BUILD_CMD"

      - name: Run JS/TS pre-build command
        if: ${{ matrix.language == 'javascript-typescript' && inputs.pre-build-cmd-javascript-typescript != '' }}
        env:
          PRE_BUILD_CMD: ${{ inputs.pre-build-cmd-javascript-typescript }}
        run: bash -euo pipefail -c "$PRE_BUILD_CMD"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@e0647621c2984b5ed2f768cb892365bf2a616ad1 # v4.37.2
        with:
          category: /language:${{ matrix.language }}
