name: OpenSSF Scorecard

on:
  workflow_call:

# CALLER REQUIREMENTS
# ===================
# When calling this reusable workflow, the caller's job-level
# `permissions:` block MUST grant at least this full set, otherwise
# the run fails with `startup_failure` before any job executes
# (GitHub rejects the workflow at startup when the reusable declares
# a permission the caller did not grant). NOTE: setting ANY scope in a
# `permissions:` block forces every UNLISTED scope to `none`, and a job
# that omits `permissions:` inherits the repository default
# (default_workflow_permissions) — so a repo hardened to `read` will
# startup-fail here unless these scopes are granted explicitly.
#
#   jobs:
#     analysis:
#       uses: netresearch/.github/.github/workflows/scorecard.yml@main
#       permissions:
#         actions: read
#         contents: read
#         id-token: write
#         security-events: write
permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    # Callers trigger on pushes to both `main` and `master` so one template
    # serves either default branch. scorecard-action refuses any ref other
    # than the default branch outside pull_request events ("Only the default
    # branch ... is supported") and fails the run, so a push to a non-default
    # branch of that name is skipped here, once for every caller.
    if: github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      id-token: write
      actions: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # Include files hidden from archives by .gitattributes export-ignore.
          file_mode: git

      - name: Upload SARIF
        # Skip on merge_group: the gh-readonly-queue ref is deleted by GitHub
        # the moment the merge completes, racing with codeql-action/upload-sarif
        # and producing a guaranteed `ref ... not found` failure. Push and
        # schedule events run with stable refs.
        if: github.event_name != 'merge_group'
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
