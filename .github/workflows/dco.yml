# Reusable "DCO" workflow — verifies that every commit in a pull request
# carries a Developer Certificate of Origin sign-off.
#
# WHY A WORKFLOW AND NOT THE DCO APP
# ==================================
# The probot DCO app is installed on some netresearch repos and not others,
# it is configured per-repo outside version control, and a repo without it
# has no gate at all. This reusable puts the same check in the same place as
# every other org standard: a pinned, reviewable workflow that a repo opts
# into by adding four lines.
#
# Caller pattern:
#
#   name: DCO
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened]
#     merge_group:          # required if the branch runs a merge queue — see below
#   permissions: {}
#   jobs:
#     dco:
#       uses: netresearch/.github/.github/workflows/dco.yml@main
#       permissions:
#         contents: read
#         pull-requests: read
#
# MERGE QUEUES
# ============
# Add the `merge_group:` trigger whenever this check is *required* on a branch
# that runs a merge queue. GitHub treats a required check that has not reported
# by `check_response_timeout_minutes` as failed and ejects the entry, so a
# pull_request-only caller stalls every queue entry until the queue is unusable.
#
# This is also why the probot DCO app cannot be a required check on a
# queue-enabled branch: it reacts to pull_request events only and has no way to
# report on a merge group. A repo that wants both a queue and an enforced DCO
# has to move to this workflow.
#
# On a merge_group event the commits come from the group's base..head range,
# which covers exactly the commits about to land. A pull_request event uses the
# same compare API with the PR's base and head SHAs: the PR-commits endpoint
# returns at most 250 commits, so a longer PR would have been checked only in
# part. The job also compares the number of commits it received with the
# range's `total_commits` and fails on a difference or on an empty list, so a
# failed or truncated API answer can never read as "every commit signed off".
#
# WHAT IS CHECKED
# ===============
# Every non-merge commit in the PR must carry a `Signed-off-by:` trailer
# whose email matches the commit's author or committer. Merge commits are
# skipped: they are generated by GitHub or by `git merge` and carry no
# authorship claim of their own.
#
# Bot commits are exempt by default. Dependabot and Renovate do not add a
# sign-off, so a gate without that exemption blocks every dependency PR in
# the org — including the ones that are supposed to auto-merge.
#
# SECURITY: the values taken from the event context are the PR number and
# commit SHAs; they reach the script as environment variables and are only
# used inside API paths, never interpolated into a shell command. Commit messages
# are attacker-controlled content, so they are moved as base64 and only ever
# decoded into a variable — never eval'd, sourced, or interpolated into a
# `run:` block.

name: DCO (reusable)

on:
  workflow_call:
    inputs:
      runs-on:
        description: "Runner label."
        required: false
        type: string
        default: "ubuntu-latest"
      exempt-logins:
        description: >-
          Comma-separated GitHub logins whose commits are not required to
          carry a sign-off. The default exempts the dependency bots, which
          never add one — without this a DCO gate blocks every Dependabot
          and Renovate PR. Set to an empty string to require a sign-off
          from everyone, bots included.
        required: false
        type: string
        default: "dependabot[bot],renovate[bot],github-actions[bot]"
      allow-unmatched-sign-off:
        description: >-
          Accept any `Signed-off-by:` trailer regardless of whose email it
          carries. Default `false` requires the trailer to match the
          commit's author or committer email, which is what makes the
          sign-off a statement by the person who wrote the commit rather
          than a copied-in line.
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  dco:
    name: DCO
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Verify sign-off on every commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MG_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MG_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          EXEMPT_LOGINS: ${{ inputs.exempt-logins }}
          ALLOW_UNMATCHED: ${{ inputs.allow-unmatched-sign-off }}
        run: |
          set -euo pipefail

          # Which API lists the commits to check depends on the event.
          #
          # merge_group carries no PR number, so a repo whose branch requires
          # this check AND runs a merge queue needs the second path: a required
          # check that cannot report on merge_group is treated as failed once
          # check_response_timeout_minutes elapses, and every queue entry is
          # ejected. Both SHAs come from the event payload and are compared
          # server-side; nothing is checked out.
          case "$EVENT_NAME" in
            merge_group)
              if [ -z "${MG_BASE_SHA:-}" ] || [ -z "${MG_HEAD_SHA:-}" ]; then
                echo "::error title=DCO::merge_group event without base_sha/head_sha in the payload."
                exit 1
              fi
              BASE_SHA="$MG_BASE_SHA"
              HEAD_SHA="$MG_HEAD_SHA"
              echo "Checking sign-off on ${REPO} merge group ${MG_BASE_SHA:0:12}..${MG_HEAD_SHA:0:12}"
              ;;
            *)
              if [ -z "${PR_NUMBER:-}" ] || [ "${PR_NUMBER}" = "null" ]; then
                echo "::error title=DCO::This reusable must be called from a pull_request or merge_group event; no PR number in the event payload."
                exit 1
              fi
              if [ -z "${PR_BASE_SHA:-}" ] || [ -z "${PR_HEAD_SHA:-}" ]; then
                echo "::error title=DCO::pull_request event without base.sha/head.sha in the payload."
                exit 1
              fi
              BASE_SHA="$PR_BASE_SHA"
              HEAD_SHA="$PR_HEAD_SHA"
              echo "Checking sign-off on the commits of ${REPO}#${PR_NUMBER}"
              ;;
          esac
          COMPARE_API="repos/${REPO}/compare/${BASE_SHA}...${HEAD_SHA}"

          # The list goes to a file first. Read through a process substitution
          # (`done < <(gh api ...)`), a failed API call is invisible to
          # `set -e`: the loop sees no commits and the job reports success.
          EXPECTED=$(gh api "${COMPARE_API}?per_page=1" --jq '.total_commits') || {
            echo "::error title=DCO::Cannot read the commit range ${BASE_SHA:0:12}...${HEAD_SHA:0:12} from the GitHub API."
            exit 1
          }
          COMMIT_LIST=$(mktemp)
          gh api --paginate "${COMPARE_API}?per_page=100" --jq '.commits[]
            | [ .sha
                  , (.parents | length | tostring)
                  , (.author.login // "")
                  , (.commit.author.email // "")
                  , (.commit.committer.email // "")
                  , (.commit.message | @base64)
                  ] | join("\u001f")' > "$COMMIT_LIST" || {
            echo "::error title=DCO::Cannot list the commits of ${BASE_SHA:0:12}...${HEAD_SHA:0:12} from the GitHub API."
            exit 1
          }
          RECEIVED=$(wc -l < "$COMMIT_LIST")
          if [ "$EXPECTED" -eq 0 ]; then
            echo "::error title=DCO::The range ${BASE_SHA:0:12}...${HEAD_SHA:0:12} contains no commits, so nothing could be checked."
            exit 1
          fi
          if [ "$RECEIVED" -ne "$EXPECTED" ]; then
            echo "::error title=DCO::Received ${RECEIVED} of ${EXPECTED} commits from the compare API; refusing to report a partial check."
            exit 1
          fi
          echo "Exempt logins: ${EXEMPT_LOGINS:-(none)}"
          echo "Require author match: $([ "$ALLOW_UNMATCHED" = "true" ] && echo no || echo yes)"
          echo ""

          # Exempt list as a newline-delimited file for exact-line lookups,
          # so a login can never partially match another.
          EXEMPT_FILE=$(mktemp)
          printf '%s' "$EXEMPT_LOGINS" | tr ',' '\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | grep -v '^$' > "$EXEMPT_FILE" || true

          FAILED=0
          CHECKED=0
          SKIPPED=0

          # Commit messages are attacker-controlled and contain newlines, so
          # they travel as base64 in a single field.
          #
          # Fields are separated by the ASCII unit separator (0x1f), NOT a tab:
          # tab is an IFS *whitespace* character, so `IFS=$'\t' read` still
          # collapses runs of tabs and drops empty fields. A commit whose
          # author has no linked GitHub account has an empty login, which under
          # a tab separator shifts every later column left — the base64 message
          # lands in COMMITTER_EMAIL, MSG_B64 comes out empty, and the commit is
          # reported as "no sign-off" no matter what it actually contains.
          while IFS=$'\037' read -r SHA PARENTS LOGIN AUTHOR_EMAIL COMMITTER_EMAIL MSG_B64; do
            SHORT="${SHA:0:12}"

            if [ "$PARENTS" -gt 1 ]; then
              echo "  skip  ${SHORT}  merge commit"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            if [ -n "$LOGIN" ] && grep -qxF "$LOGIN" "$EXEMPT_FILE"; then
              echo "  skip  ${SHORT}  exempt login ${LOGIN}"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            CHECKED=$((CHECKED + 1))
            MESSAGE=$(printf '%s' "$MSG_B64" | base64 -d)

            # Trailer emails, lower-cased for comparison. `grep -i` keeps the
            # trailer key case-insensitive the way git does.
            SIGNOFF_EMAILS=$(printf '%s\n' "$MESSAGE" \
              | grep -iE '^[[:space:]]*Signed-off-by:[[:space:]]*.+<[^>]+>[[:space:]]*$' \
              | sed -E 's/.*<([^>]+)>.*/\1/' \
              | tr '[:upper:]' '[:lower:]' || true)

            if [ -z "$SIGNOFF_EMAILS" ]; then
              echo "  FAIL  ${SHORT}  no Signed-off-by trailer"
              FAILED=$((FAILED + 1))
              continue
            fi

            if [ "$ALLOW_UNMATCHED" = "true" ]; then
              echo "  ok    ${SHORT}  signed off"
              continue
            fi

            AUTHOR_LC=$(printf '%s' "$AUTHOR_EMAIL" | tr '[:upper:]' '[:lower:]')
            COMMITTER_LC=$(printf '%s' "$COMMITTER_EMAIL" | tr '[:upper:]' '[:lower:]')

            if printf '%s\n' "$SIGNOFF_EMAILS" | grep -qxF "$AUTHOR_LC" \
              || printf '%s\n' "$SIGNOFF_EMAILS" | grep -qxF "$COMMITTER_LC"; then
              echo "  ok    ${SHORT}  signed off by ${AUTHOR_LC}"
            else
              SIGNOFF_ONE_LINE=${SIGNOFF_EMAILS//$'\n'/, }
              echo "  FAIL  ${SHORT}  sign-off (${SIGNOFF_ONE_LINE}) matches neither author (${AUTHOR_LC}) nor committer (${COMMITTER_LC})"
              FAILED=$((FAILED + 1))
            fi
          done < "$COMMIT_LIST"

          echo ""
          echo "Summary: ${CHECKED} commit(s) checked, ${SKIPPED} skipped, ${FAILED} without a valid sign-off"

          if [ "$FAILED" -gt 0 ]; then
            {
              echo "::error title=DCO::${FAILED} commit(s) are missing a matching Signed-off-by trailer."
              echo ""
              echo "Sign off future commits with:    git commit -s"
              echo "Fix the commits already pushed:  git rebase --signoff <base-branch> && git push --force-with-lease"
            } >&2
            exit 1
          fi

          echo "All commits carry a valid sign-off."
