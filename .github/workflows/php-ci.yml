# Reusable "PHP CI" workflow for non-TYPO3 PHP projects.
#
# Provides the union of patterns currently inlined across the netresearch
# org (composer SDKs, composer plugins, Symfony libraries): checkout +
# shivammathur/setup-php + composer cache + composer install, then
# optional PHPStan / PHPUnit / PHP-CS-Fixer / Rector / coverage steps.
#
# TYPO3 *extensions* should keep using
# `netresearch/typo3-ci-workflows/.github/workflows/ci.yml` — but this
# workflow does support TYPO3 extension repos that need a one-shot
# `composer require typo3/cms-core:VERSION` before install via the
# `pre-install-cmd` input (used by `news_importicsxml`, `nr-landingpage`,
# `t3x-nr-mcp-agent`).
#
# Caller pattern (minimal — runs PHPStan + PHPUnit on PHP 8.3):
#
#   name: CI
#   on:
#     push:
#       branches: [main]
#     pull_request:
#   permissions: {}
#   jobs:
#     php-ci:
#       uses: netresearch/.github/.github/workflows/php-ci.yml@main
#
# Caller pattern (matrix + coverage upload + custom commands):
#
#   jobs:
#     php-ci:
#       uses: netresearch/.github/.github/workflows/php-ci.yml@main
#       with:
#         php-versions: '["8.2","8.3","8.4"]'
#         extensions: "mbstring, intl, soap, libxml"
#         coverage: "xdebug"
#         phpstan-cmd: "composer ci:phpstan"
#         phpunit-cmd: "composer ci:tests:unit"
#         run-cs-fixer: true
#         cs-fixer-cmd: "composer ci:cgl"
#         upload-coverage-codecov: true
#         coverage-php-version: "8.3"
#       secrets:
#         CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
#
# Caller pattern (floor testing — install the lowest allowed versions):
#
#   jobs:
#     lowest:
#       uses: netresearch/.github/.github/workflows/php-ci.yml@main
#       with:
#         php-versions: '["8.2"]'
#         dependency-versions: "lowest"   # composer update --prefer-lowest --prefer-stable
#
# Caller pattern (environment for the check commands):
#
#   Use `check-env` instead of concatenating `FOO=1 vendor/bin/phpunit`
#   into `phpunit-cmd` — the pairs are exported as step environment, so
#   the command inputs stay plain commands:
#
#   jobs:
#     php-ci:
#       uses: netresearch/.github/.github/workflows/php-ci.yml@main
#       with:
#         phpunit-cmd: "vendor/bin/phpunit --testdox"
#         check-env: |
#           SKIP_NETWORK_TESTS=1
#           COMPOSER_AUTH={}
#
# Caller pattern (TYPO3 extension matrix — pin core before install):
#
#   jobs:
#     php-ci:
#       uses: netresearch/.github/.github/workflows/php-ci.yml@main
#       with:
#         php-versions: '["8.2","8.3","8.4"]'
#         pre-install-cmd: 'composer require typo3/cms-core:"^13.4" --no-update --no-progress'
#         extensions: "mbstring, intl, pdo_sqlite"
#
# Caller pattern (chained with SonarQube/SonarCloud — Clover coverage):
#
#   The org-standard `netresearch/.github/.github/workflows/sonarqube.yml`
#   reusable is intentionally language-agnostic: it runs the scanner in a
#   separate job that does its own checkout and never downloads sibling
#   artifacts. That means a sibling `php-ci` job's coverage cannot reach
#   the reusable scanner directly. Two patterns exist:
#
#   (A) Recommended — call this reusable to produce + upload a Clover
#       artifact, then run a custom Sonar job that consumes the artifact:
#
#       jobs:
#         php-ci:
#           uses: netresearch/.github/.github/workflows/php-ci.yml@main
#           with:
#             php-versions: '["8.3"]'
#             coverage: "xdebug"
#             coverage-format: "clover"
#             phpunit-cmd: "vendor/bin/phpunit --coverage-clover=coverage.xml"
#             upload-coverage-artifact: true
#         sonarqube:
#           needs: php-ci
#           runs-on: ubuntu-latest
#           permissions: { contents: read }
#           steps:
#             - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
#               with: { fetch-depth: 0, persist-credentials: false }
#             - uses: actions/download-artifact@<pinned-sha>
#               with: { name: php-coverage-clover, path: . }
#             - uses: SonarSource/sonarqube-scan-action@<pinned-sha>
#               env:
#                 SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
#                 SONAR_HOST_URL: 'https://sonarcloud.io'
#       # In sonar-project.properties, point Sonar at the artifact path:
#       #   sonar.php.coverage.reportPaths=coverage.xml
#
#   (B) Single-job inline (used by t3x-rte_ckeditor_image): when a repo
#       needs PHP + JS coverage in the same scan, inline a Sonar job that
#       checks out, runs PHPUnit with coverage, runs vitest with coverage,
#       and invokes `SonarSource/sonarqube-scan-action` directly. This
#       reusable is not involved in pattern (B); use it only for the
#       matrix CI job.
#
# SECURITY: pinned action SHAs, harden-runner, read-only permissions,
# `persist-credentials: false` on checkout, secrets passed explicitly
# (never `secrets: inherit`). Caller-supplied commands are routed
# through `env:` so callers can't break out of argument position via
# quoting/metacharacters. `check-env` exists so that setting a variable
# for a check step no longer requires concatenating it into a `*-cmd`
# string — its text is parsed as data and never eval'd, sourced or
# interpolated into a `run:` block. No untrusted github.event.* input is
# used in `run:` blocks — all inputs come via `workflow_call` from
# trusted callers.

name: PHP CI (reusable)

on:
  workflow_call:
    inputs:
      runs-on:
        description: "Runner label."
        type: string
        default: "ubuntu-latest"
      timeout-minutes:
        description: "Per-job timeout in minutes."
        type: number
        default: 15

      php-versions:
        description: >-
          JSON array string of PHP versions to matrix over
          (e.g. '[\"8.3\"]' or '[\"8.2\",\"8.3\",\"8.4\"]').
          Single-version callers pass a single-element array.
        type: string
        default: '["8.3"]'
      extensions:
        description: "Comma-separated PHP extensions for shivammathur/setup-php."
        type: string
        default: "mbstring, intl, json"
      extra-tools:
        description: >-
          Additional tools (comma-separated) for shivammathur/setup-php,
          appended to the always-installed `composer:v2`
          (e.g. `php-cs-fixer, phpstan`). The reusable always installs
          Composer because every later step (validate, cache lookup,
          install, audit) depends on it; callers cannot opt out.
        type: string
        default: ""
      ini-values:
        description: "php.ini overrides for shivammathur/setup-php (e.g. 'memory_limit=-1')."
        type: string
        default: ""
      coverage:
        description: "Coverage driver passed to shivammathur/setup-php. One of: none, xdebug, pcov."
        type: string
        default: "none"

      working-directory:
        description: "Working directory for all run steps. Useful for monorepos."
        type: string
        default: "."

      composer-args:
        description: >-
          Arguments forwarded to `composer install`. Word-split on
          whitespace into argv; shell metacharacters
          (`;`, `&&`, `|`, `` ` ``, `$(...)`, newlines) are NOT
          interpreted — they end up as literal argv entries that Composer
          will reject. Use `pre-install-cmd` if you need to run a shell
          command before install.
        type: string
        default: "--prefer-dist --no-progress --no-interaction"
      composer-validate:
        description: "Run `composer validate --strict` before install."
        type: boolean
        default: true
      pre-install-cmd:
        description: >-
          Optional shell command to run after PHP setup but before
          `composer install`. Use this to pin framework versions in a
          matrix (e.g. `composer require typo3/cms-core:"^13.4"
          --no-update`).
        type: string
        default: ""
      dependency-versions:
        description: >-
          Which dependency set to install. `highest` (default) runs
          `composer install` exactly as before. `lowest` runs
          `composer update --prefer-lowest --prefer-stable` instead, for
          floor-constraint testing (the ramsey/composer-install
          convention). `composer-args` is forwarded in both modes. Any
          other value fails the job. An empty string is treated as
          `highest`.
        type: string
        default: "highest"

      # Environment passthrough for the caller-supplied check commands
      check-env:
        description: >-
          Newline-separated `KEY=VALUE` pairs exported before the
          PHPStan / PHP-CS-Fixer / Rector / PHPUnit steps run, e.g.
          `SKIP_NETWORK_TESTS=1`. Parsed as data and written to
          `$GITHUB_ENV`; the text is never eval'd, sourced or
          interpolated into a command, so it cannot be used to smuggle
          shell code the way concatenating `FOO=1 vendor/bin/phpunit`
          into a `*-cmd` input does. Blank lines and `#` comment lines
          are ignored; everything after the first `=` is the literal
          value (spaces and quotes are kept verbatim, quotes are NOT
          stripped). Keys must match `[A-Za-z_][A-Za-z0-9_]*` and must
          not start with `GITHUB_` or `RUNNER_`. Because `$GITHUB_ENV`
          is job-scoped, the variables also apply to the steps after the
          checks (coverage upload).
        type: string
        default: ""

      symfony-require:
        description: >-
          Pin the whole Symfony stack to one major by installing symfony/flex
          globally and exporting SYMFONY_REQUIRE. Empty (default) skips it.
          A value of the form MATRIX_<NAME> is resolved at runtime from the
          `extra-matrix` key of that name, so one caller job can cover several
          Symfony versions.
        required: false
        type: string
        default: ""
      extra-matrix:
        description: >-
          JSON array of objects adding a SECOND matrix dimension alongside
          `php-versions`, so a library testing N framework versions x M PHP
          versions needs one caller job instead of N. Each object's keys are
          exported to the later steps as MATRIX_<KEY> (upper-cased). The
          default single empty object yields exactly one cell per PHP version,
          i.e. the historical behaviour.
        required: false
        type: string
        default: "[{}]"
      # PHPStan
      run-phpstan:
        description: "Run PHPStan static analysis."
        type: boolean
        default: true
      phpstan-cmd:
        description: >-
          PHPStan command. Default uses the project-installed binary;
          override with e.g. `composer ci:phpstan` if your project wraps
          it as a composer script.
        type: string
        default: "vendor/bin/phpstan analyse --no-progress --error-format=github"

      # PHPUnit
      run-phpunit:
        description: "Run PHPUnit."
        type: boolean
        default: true
      phpunit-cmd:
        description: "PHPUnit command. Override to use a composer script (e.g. `composer ci:tests:unit`)."
        type: string
        default: "vendor/bin/phpunit"

      # PHP-CS-Fixer (off by default — many projects use composer scripts that bundle this with linting)
      run-cs-fixer:
        description: "Run PHP-CS-Fixer in dry-run mode."
        type: boolean
        default: false
      cs-fixer-cmd:
        description: "PHP-CS-Fixer command. Override to use a composer script (e.g. `composer ci:cgl`)."
        type: string
        default: "vendor/bin/php-cs-fixer fix --dry-run --diff --verbose"

      # Rector
      run-rector:
        description: "Run Rector in dry-run mode."
        type: boolean
        default: false
      rector-cmd:
        description: "Rector command. Override to use a composer script (e.g. `composer ci:rector`)."
        type: string
        default: "vendor/bin/rector process --dry-run --no-progress-bar"

      # Composer audit
      run-composer-audit:
        description: "Run `composer audit` after install (security advisories)."
        type: boolean
        default: false

      # Coverage handling — both Codecov and artifact upload are supported
      # and can run together. Coverage steps run only on the matrix entry
      # whose `matrix.php` equals `coverage-php-version`, to avoid
      # duplicate uploads when `php-versions` has multiple entries.
      coverage-format:
        description: >-
          Hint about the coverage report format (`clover`, `cobertura`,
          `crap4j`, or empty). Affects only the artifact name (so
          downstream jobs can predict which file to expect) and is
          documented for callers; PHPUnit's flag still has to be passed
          via `phpunit-cmd` (e.g. `--coverage-clover=coverage.xml`).
          Default empty leaves the artifact name format-agnostic.
        type: string
        default: ""
      upload-coverage-codecov:
        description: >-
          Upload coverage to Codecov. Requires `coverage` != 'none' and
          a phpunit-cmd that writes a Clover report to `coverage-file`.
          Only runs on the `coverage-php-version` matrix entry.
        type: boolean
        default: false
      upload-coverage-artifact:
        description: >-
          Upload the coverage report as a workflow artifact named
          `coverage-artifact-name`. Use this to chain with a downstream
          SonarQube/SonarCloud job that consumes the artifact via
          `actions/download-artifact` (see the chained-with-Sonar caller
          pattern in this file's header). Only runs on the
          `coverage-php-version` matrix entry.
        type: boolean
        default: false
      coverage-artifact-name:
        description: "Artifact name used when `upload-coverage-artifact` is true."
        type: string
        default: "php-coverage"
      coverage-artifact-retention-days:
        description: "Retention for the coverage artifact (1-90)."
        type: number
        default: 7
      coverage-php-version:
        description: "PHP version that uploads coverage (must be present in `php-versions`)."
        type: string
        default: "8.3"
      coverage-file:
        description: "Path (relative to `working-directory`) to the coverage report that gets uploaded to Codecov and/or as an artifact."
        type: string
        default: "./coverage.xml"
      coverage-flags:
        description: "Codecov `flags` (comma-separated)."
        type: string
        default: "unittests"
    secrets:
      CODECOV_TOKEN:
        description: "Codecov upload token. Required for private repositories when `upload-coverage-codecov` is true."
        required: false

permissions: {}

jobs:
  php-ci:
    name: PHP ${{ matrix.php }}${{ toJSON(matrix.extra) != '{}' && format(' · {0}', join(matrix.extra.*, ' ')) || '' }}
    # Skip the job only when every feature is off. `composer-validate`,
    # `pre-install-cmd`, `upload-coverage-codecov`, and
    # `upload-coverage-artifact` are intentionally part of the gate so a
    # caller that only wants e.g. composer-validate (with all check
    # toggles off) still gets a job that runs.
    if: >-
      ${{
        inputs.run-phpstan ||
        inputs.run-phpunit ||
        inputs.run-cs-fixer ||
        inputs.run-rector ||
        inputs.run-composer-audit ||
        inputs.composer-validate ||
        inputs.pre-install-cmd != '' ||
        inputs.upload-coverage-codecov ||
        inputs.upload-coverage-artifact
      }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(inputs.php-versions) }}
        extra: ${{ fromJSON(inputs.extra-matrix) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ inputs.extensions }}
          # Always-on `composer:v2` (later steps depend on it); callers
          # add to the list via `extra-tools`. setup-php tolerates the
          # trailing comma when `extra-tools` is empty.
          tools: composer:v2, ${{ inputs.extra-tools }}
          ini-values: ${{ inputs.ini-values }}
          coverage: ${{ inputs.coverage }}

      - name: Export extra matrix values
        # Publishes each `extra-matrix` key to the later steps as MATRIX_<KEY>.
        # MATRIX_EXTRA is only ever read as data (jq over an env var, never
        # eval/source, never interpolated into this run block), so a value
        # containing $(id), backticks or ; stays a literal string. Every name
        # is MATRIX_-prefixed, so no key can shadow GITHUB_*/RUNNER_*. Values
        # use a random heredoc delimiter so none can forge $GITHUB_ENV lines.
        if: ${{ toJSON(matrix.extra) != '{}' }}
        env:
          MATRIX_EXTRA: ${{ toJSON(matrix.extra) }}
        run: |
          delimiter="MATRIX_EOF_${RANDOM}${RANDOM}${RANDOM}${RANDOM}"
          while IFS= read -r key; do
            if ! printf '%s' "$key" | grep -qE '^[A-Za-z_][A-Za-z0-9_]*$'; then
              echo "::error title=Invalid extra-matrix key::'$key' is not a valid identifier"
              exit 1
            fi
            name="MATRIX_$(printf '%s' "$key" | tr '[:lower:]' '[:upper:]')"
            value="$(printf '%s' "$MATRIX_EXTRA" | jq -r --arg k "$key" '.[$k] | if type == "string" then . else tojson end')"
            {
              printf '%s<<%s\n' "$name" "$delimiter"
              printf '%s\n' "$value"
              printf '%s\n' "$delimiter"
            } >> "$GITHUB_ENV"
            echo "exported $name"
          done < <(printf '%s' "$MATRIX_EXTRA" | jq -r 'keys_unsorted[]')

      - name: Set up Symfony Flex
        # Canonical Symfony CI recipe: flex + SYMFONY_REQUIRE pins the whole
        # stack, including transitive symfony/* packages, to one major.
        # MATRIX_<NAME> is resolved from the export above via indirect
        # expansion after the name is validated against a strict pattern; the
        # value never reaches eval.
        if: ${{ inputs.symfony-require != '' }}
        env:
          SYMFONY_REQUIRE_INPUT: ${{ inputs.symfony-require }}
        run: |
          value="$SYMFONY_REQUIRE_INPUT"
          if printf '%s' "$value" | grep -qE '^MATRIX_[A-Z0-9_]+$'; then
            resolved="${!value-}"
            if [ -z "$resolved" ]; then
              echo "::error title=Invalid symfony-require::'$value' is empty - is that key present in extra-matrix?"
              exit 1
            fi
            value="$resolved"
          fi
          # Reject anything that is not a plausible Composer constraint. This
          # is what stops $GITHUB_ENV injection at the source: a value carrying
          # a newline could otherwise forge further environment variables.
          case "$value" in
            *[!0-9A-Za-z.*|^~\ ,\<\>=!-]*)
              echo "::error title=Invalid symfony-require::value contains characters that are not valid in a Composer version constraint"
              exit 1
              ;;
          esac
          composer global config --no-plugins allow-plugins.symfony/flex true
          composer global require --no-progress --no-scripts --no-plugins symfony/flex
          # Written with a random heredoc delimiter for the same reason as
          # check-env and the extra-matrix export: a value can never forge an
          # extra $GITHUB_ENV entry, whatever it contains.
          delimiter="SYMFONY_REQUIRE_EOF_${RANDOM}${RANDOM}${RANDOM}${RANDOM}"
          {
            printf 'SYMFONY_REQUIRE<<%s\n' "$delimiter"
            printf '%s\n' "$value"
            printf '%s\n' "$delimiter"
          } >> "$GITHUB_ENV"
          echo "SYMFONY_REQUIRE=$value"

      - name: Validate composer.json and composer.lock
        if: ${{ inputs.composer-validate }}
        run: composer validate --strict

      - name: Resolve composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles(format('{0}/composer.json', inputs.working-directory), format('{0}/composer.lock', inputs.working-directory)) }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-composer-
            ${{ runner.os }}-php-${{ matrix.php }}-

      - name: Pre-install command
        if: ${{ inputs.pre-install-cmd != '' }}
        env:
          PRE_INSTALL_CMD: ${{ inputs.pre-install-cmd }}
        run: bash -c "$PRE_INSTALL_CMD"

      - name: Install dependencies
        env:
          COMPOSER_ARGS: ${{ inputs.composer-args }}
          DEPENDENCY_VERSIONS: ${{ inputs.dependency-versions }}
        # Word-split COMPOSER_ARGS into argv via `read -ra` so any shell
        # metacharacters (`;`, `&&`, backticks, `$()`) end up as literal
        # argv entries Composer rejects, instead of being interpreted by
        # the shell. Avoids the injection foot-gun of `bash -c "... $VAR"`.
        #
        # `highest` (and an empty string, i.e. a caller that explicitly
        # passes `dependency-versions: ''`) keeps the historical
        # `composer install` path unchanged. `lowest` resolves the floor
        # of every constraint instead. Anything else is a caller typo and
        # must fail loudly rather than silently installing the highest set.
        #
        # SonarCloud githubactions:S8546 ("dependency versions are not
        # predictable, use a lock-file enforcing command") fires on the
        # `composer update` below. That is inherent to floor testing:
        # ignoring the lock file IS the feature on this branch, and it is
        # opt-in — the default `highest` path still runs the lock-file
        # enforcing `composer install`. Accept the finding, don't "fix" it.
        run: |
          read -ra COMPOSER_INSTALL_ARGS <<< "$COMPOSER_ARGS"
          case "${DEPENDENCY_VERSIONS:-highest}" in
            highest)
              composer install "${COMPOSER_INSTALL_ARGS[@]}"
              ;;
            lowest)
              composer update --prefer-lowest --prefer-stable "${COMPOSER_INSTALL_ARGS[@]}"
              ;;
            *)
              echo "::error title=Invalid dependency-versions::Expected 'highest' or 'lowest', got '${DEPENDENCY_VERSIONS}'."
              exit 1
              ;;
          esac

      - name: Composer audit
        if: ${{ inputs.run-composer-audit }}
        run: composer audit

      - name: Export check environment
        # Makes caller-supplied KEY=VALUE pairs available to the check
        # steps below without concatenating them into a command string.
        # CHECK_ENV is only ever *read* as data: `read -r` plus parameter
        # expansion, never `eval`/`source`/`bash -c`, and never
        # interpolated into this run block (it arrives via `env:`), so a
        # value containing `$(id)`, backticks, quotes or `;` stays a
        # literal string. Values are appended with a random heredoc
        # delimiter so no value can forge extra $GITHUB_ENV entries.
        # Key names are validated to protect the runner's own contract;
        # only the key is echoed, never the value.
        if: ${{ inputs.check-env != '' }}
        env:
          CHECK_ENV: ${{ inputs.check-env }}
        run: |
          delimiter="CHECK_ENV_EOF_${RANDOM}${RANDOM}${RANDOM}${RANDOM}"
          lineno=0
          while IFS= read -r line || [ -n "$line" ]; do
            lineno=$((lineno + 1))
            line="${line%$'\r'}"
            line="${line#"${line%%[![:space:]]*}"}"
            case "$line" in
              '' | '#'*) continue ;;
            esac
            if [[ "$line" != *=* ]]; then
              echo "::error title=Invalid check-env::Line ${lineno} is not KEY=VALUE."
              exit 1
            fi
            key="${line%%=*}"
            value="${line#*=}"
            if [[ ! "$key" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
              echo "::error title=Invalid check-env::Line ${lineno} has an invalid variable name."
              exit 1
            fi
            case "$key" in
              GITHUB_* | RUNNER_*)
                echo "::error title=Invalid check-env::Line ${lineno} may not override reserved variable '${key}'."
                exit 1
                ;;
            esac
            {
              printf '%s<<%s\n' "$key" "$delimiter"
              printf '%s\n' "$value"
              printf '%s\n' "$delimiter"
            } >> "$GITHUB_ENV"
            echo "check-env: exported ${key}"
          done <<< "$CHECK_ENV"

      - name: PHPStan
        if: ${{ inputs.run-phpstan }}
        env:
          PHPSTAN_CMD: ${{ inputs.phpstan-cmd }}
        run: bash -c "$PHPSTAN_CMD"

      - name: PHP-CS-Fixer
        if: ${{ inputs.run-cs-fixer }}
        env:
          CS_FIXER_CMD: ${{ inputs.cs-fixer-cmd }}
        run: bash -c "$CS_FIXER_CMD"

      - name: Rector
        if: ${{ inputs.run-rector }}
        env:
          RECTOR_CMD: ${{ inputs.rector-cmd }}
        run: bash -c "$RECTOR_CMD"

      - name: PHPUnit
        if: ${{ inputs.run-phpunit }}
        env:
          PHPUNIT_CMD: ${{ inputs.phpunit-cmd }}
        run: bash -c "$PHPUNIT_CMD"

      - name: Upload coverage artifact
        # Stable artifact name lets a downstream SonarQube job consume the
        # report via actions/download-artifact. Gate on the configured
        # coverage PHP version to avoid colliding artifact names across
        # matrix entries.
        if: ${{ inputs.upload-coverage-artifact && matrix.php == inputs.coverage-php-version && inputs.coverage != 'none' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.coverage-artifact-name }}
          path: ${{ inputs.working-directory }}/${{ inputs.coverage-file }}
          if-no-files-found: error
          retention-days: ${{ inputs.coverage-artifact-retention-days }}

      - name: Upload coverage to Codecov
        # Gate on the configured coverage PHP version so we don't double-upload
        # from every matrix entry. Coverage driver must be enabled and the
        # phpunit-cmd must have produced the coverage file.
        if: ${{ inputs.upload-coverage-codecov && matrix.php == inputs.coverage-php-version && inputs.coverage != 'none' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ inputs.coverage-file }}
          flags: ${{ inputs.coverage-flags }}
          working-directory: ${{ inputs.working-directory }}
          fail_ci_if_error: false
