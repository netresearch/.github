# Reusable "Node.js test" workflow (LEAF).
#
# Runs a package-manager-agnostic test job, optionally over a matrix of
# Node.js versions, with an optional Codecov coverage upload.
#
# Caller pattern (single Node version, coverage upload):
#
#   jobs:
#     test:
#       uses: netresearch/.github/.github/workflows/node-test.yml@main
#       with:
#         coverage-upload: true
#       secrets:
#         CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
#
# Caller pattern (Node-version matrix):
#
#   jobs:
#     test:
#       uses: netresearch/.github/.github/workflows/node-test.yml@main
#       with:
#         test-matrix: '["20","22","24"]'
#
# SECURITY: caller-supplied commands are routed through `env:` and run via
# `bash -c "$VAR"`, so the caller can't break out of argument position via
# quoting/metacharacters. Third-party actions are SHA-pinned, harden-runner
# is enabled, checkout uses `persist-credentials: false`, and the Codecov
# secret is passed explicitly (never `secrets: inherit`).

name: Node.js Test (reusable)

on:
  workflow_call:
    inputs:
      runs-on:
        description: "Runner label."
        type: string
        default: "ubuntu-latest"
      timeout-minutes:
        description: "Per-job timeout in minutes."
        type: number
        default: 15

      package-manager:
        description: "Package manager to use (one of: bun, npm, pnpm, yarn)."
        type: string
        default: "bun"
      node-version:
        description: >-
          Node.js version used when `test-matrix` is empty, and the matrix
          cell that uploads coverage when `coverage-upload` is true (so this
          version SHOULD be one of the `test-matrix` entries).
        type: string
        default: "24"
      test-matrix:
        description: >-
          JSON array string of Node.js versions to matrix over
          (e.g. '["20","22"]'). When empty, a single-element matrix of
          [node-version] is used.
        type: string
        default: ""
      bun-version:
        description: "Bun version passed to oven-sh/setup-bun (when package-manager is bun)."
        type: string
        default: "latest"

      install-cmd:
        description: "Dependency install command."
        type: string
        default: "bun install --frozen-lockfile"
      test-cmd:
        description: "Test command."
        type: string
        default: "bun run test:coverage"
      pre-command:
        description: "Optional shell command to run after install but before the test command."
        type: string
        default: ""

      coverage-upload:
        description: >-
          Upload coverage to Codecov. Runs only on the single matrix cell
          whose Node.js version matches `node-version`, to avoid duplicate
          uploads across the matrix.
        type: boolean
        default: false
      coverage-file:
        description: "Path to the coverage report uploaded to Codecov."
        type: string
        default: "./coverage/lcov.info"
      coverage-flags:
        description: "Codecov `flags` (comma-separated)."
        type: string
        default: "unittests"
    secrets:
      CODECOV_TOKEN:
        description: "Codecov upload token. Required for private repositories when `coverage-upload` is true."
        required: false

# CALLER REQUIREMENTS
# ===================
# When calling this reusable workflow, the caller's job-level
# `permissions:` block MUST grant at least this full set, otherwise
# the run fails with `startup_failure` before any job executes
# (GitHub rejects the workflow at startup when the reusable declares
# a permission the caller did not grant). NOTE: setting ANY scope in a
# `permissions:` block forces every UNLISTED scope to `none`, and a job
# that omits `permissions:` inherits the repository default
# (default_workflow_permissions) — so a repo hardened to `read` will
# startup-fail here unless these scopes are granted explicitly.
#
#   jobs:
#     test:
#       uses: netresearch/.github/.github/workflows/node-test.yml@main
#       permissions:
#         contents: read
permissions: {}

jobs:
  node-test:
    name: test (node ${{ matrix.node }})
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(inputs.test-matrix != '' && inputs.test-matrix || format('["{0}"]', inputs.node-version)) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate package-manager input
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
        run: |
          case "$PACKAGE_MANAGER" in
            bun|npm|pnpm|yarn) : ;;
            *)
              echo "::error title=Invalid package-manager::Unsupported package-manager '$PACKAGE_MANAGER'. Expected one of: bun, npm, pnpm, yarn."
              exit 1
              ;;
          esac

      - name: Set up Bun
        if: ${{ inputs.package-manager == 'bun' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ inputs.bun-version }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Pre-command
        if: ${{ inputs.pre-command != '' }}
        env:
          PRE_COMMAND: ${{ inputs.pre-command }}
        run: bash -c "$PRE_COMMAND"

      - name: Install dependencies
        env:
          INSTALL_CMD: ${{ inputs.install-cmd }}
        run: bash -c "$INSTALL_CMD"

      - name: Test
        env:
          TEST_CMD: ${{ inputs.test-cmd }}
        run: bash -c "$TEST_CMD"

      - name: Upload coverage to Codecov
        if: ${{ inputs.coverage-upload && matrix.node == inputs.node-version }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ inputs.coverage-file }}
          flags: ${{ inputs.coverage-flags }}
          fail_ci_if_error: false
