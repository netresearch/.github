# Reusable "TypeScript / frontend check" workflow.
#
# Jobs (each can be toggled via inputs):
#   - type-check   : install + tsc / build (default: `bun run js:build`)
#   - lint         : eslint (default: `bun run lint`)
#   - format-check : prettier (default: `bunx prettier --check .`)
#
# Package-manager aware: the default `package-manager: bun` keeps the
# original setup-bun path. Set `package-manager` to npm/pnpm/yarn (and
# pass the matching `install-cmd`/`*-cmd` inputs) to run the checks under
# Node.js via actions/setup-node instead (corepack is enabled for
# pnpm/yarn).
#
# Caller pattern (bun, default):
#
#   jobs:
#     ts:
#       uses: netresearch/.github/.github/workflows/ts-check.yml@main
#       with:
#         install-args: "--frozen-lockfile"
#
# Caller pattern (yarn):
#
#   jobs:
#     ts:
#       uses: netresearch/.github/.github/workflows/ts-check.yml@main
#       with:
#         package-manager: yarn
#         install-cmd: "yarn install --immutable"
#         lint-cmd: "yarn lint"
#         type-check-cmd: "yarn build"
#         format-check-cmd: "yarn prettier --check ."
#
# SECURITY: caller-supplied commands are routed through `env:` so the
# caller can't break out of argument position via quoting/metacharacters.

name: TS Check (reusable)

on:
  workflow_call:
    inputs:
      runs-on:
        description: "Runner label."
        type: string
        default: "ubuntu-latest"
      timeout-minutes:
        description: "Per-job timeout in minutes."
        type: number
        default: 10

      package-manager:
        description: "Package manager to use (one of: bun, npm, pnpm, yarn). Default 'bun' preserves the original setup-bun path."
        type: string
        default: "bun"
      node-version:
        description: "Node.js version passed to actions/setup-node (used when package-manager is not bun)."
        type: string
        default: "24"
      bun-version:
        description: "Bun version passed to oven-sh/setup-bun (when package-manager is bun)."
        type: string
        default: "latest"
      install-cmd:
        description: "Dependency install command."
        type: string
        default: "bun install --frozen-lockfile"

      pre-command:
        description: "Optional shell command to run after install but before the checks (e.g. 'go install github.com/a-h/templ/cmd/templ@latest')."
        type: string
        default: ""

      setup-go:
        description: "Install Go before running pre-command (useful for projects that run Go tooling as part of the TS build chain)."
        type: boolean
        default: false
      go-version-file:
        description: "Path to go.mod / .go-version for version detection when setup-go=true."
        type: string
        default: "go.mod"

      enable-type-check:
        description: "Run the TypeScript type-check job."
        type: boolean
        default: true
      type-check-cmd:
        description: "Command used for the type-check job."
        type: string
        default: "bun run js:build"

      enable-lint:
        description: "Run the ESLint job."
        type: boolean
        default: true
      lint-cmd:
        description: "Command used for the lint job."
        type: string
        default: "bun run lint"

      enable-format-check:
        description: "Run the Prettier format check."
        type: boolean
        default: true
      format-check-cmd:
        description: "Command used for the format-check job."
        type: string
        default: "bunx prettier --check ."

# CALLER REQUIREMENTS
# ===================
# When calling this reusable workflow, the caller's job-level
# `permissions:` block MUST grant at least this full set, otherwise
# the run fails with `startup_failure` before any job executes
# (GitHub rejects the workflow at startup when the reusable declares
# a permission the caller did not grant). NOTE: setting ANY scope in a
# `permissions:` block forces every UNLISTED scope to `none`, and a job
# that omits `permissions:` inherits the repository default
# (default_workflow_permissions) — so a repo hardened to `read` will
# startup-fail here unless these scopes are granted explicitly.
#
#   jobs:
#     type-check:
#       uses: netresearch/.github/.github/workflows/ts-check.yml@main
#       permissions:
#         contents: read
permissions:
  contents: read

jobs:
  type-check:
    name: Check types
    if: ${{ inputs.enable-type-check }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate package-manager input
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
        run: |
          case "$PACKAGE_MANAGER" in
            bun|npm|pnpm|yarn) : ;;
            *)
              echo "::error title=Invalid package-manager::Unsupported package-manager '$PACKAGE_MANAGER'. Expected one of: bun, npm, pnpm, yarn."
              exit 1
              ;;
          esac

      - name: Set up Go
        if: ${{ inputs.setup-go }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: true

      - name: Set up Bun
        if: ${{ inputs.package-manager == 'bun' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ inputs.bun-version }}

      - name: Set up Node.js
        if: ${{ inputs.package-manager != 'bun' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Enable Corepack
        if: ${{ inputs.package-manager == 'pnpm' || inputs.package-manager == 'yarn' }}
        run: corepack enable

      - name: Install dependencies
        env:
          INSTALL_CMD: ${{ inputs.install-cmd }}
        run: bash -c "$INSTALL_CMD"

      - name: Pre-check command
        if: ${{ inputs.pre-command != '' }}
        env:
          PRE_COMMAND: ${{ inputs.pre-command }}
        run: bash -c "$PRE_COMMAND"

      - name: Type check
        env:
          TYPE_CHECK_CMD: ${{ inputs.type-check-cmd }}
        run: bash -c "$TYPE_CHECK_CMD"

  lint:
    name: Lint
    if: ${{ inputs.enable-lint }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate package-manager input
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
        run: |
          case "$PACKAGE_MANAGER" in
            bun|npm|pnpm|yarn) : ;;
            *)
              echo "::error title=Invalid package-manager::Unsupported package-manager '$PACKAGE_MANAGER'. Expected one of: bun, npm, pnpm, yarn."
              exit 1
              ;;
          esac

      - name: Set up Go
        if: ${{ inputs.setup-go }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: true

      - name: Set up Bun
        if: ${{ inputs.package-manager == 'bun' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ inputs.bun-version }}

      - name: Set up Node.js
        if: ${{ inputs.package-manager != 'bun' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Enable Corepack
        if: ${{ inputs.package-manager == 'pnpm' || inputs.package-manager == 'yarn' }}
        run: corepack enable

      - name: Install dependencies
        env:
          INSTALL_CMD: ${{ inputs.install-cmd }}
        run: bash -c "$INSTALL_CMD"

      - name: Pre-check command
        if: ${{ inputs.pre-command != '' }}
        env:
          PRE_COMMAND: ${{ inputs.pre-command }}
        run: bash -c "$PRE_COMMAND"

      - name: Lint
        env:
          LINT_CMD: ${{ inputs.lint-cmd }}
        run: bash -c "$LINT_CMD"

  format-check:
    name: Check formatting
    if: ${{ inputs.enable-format-check }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate package-manager input
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
        run: |
          case "$PACKAGE_MANAGER" in
            bun|npm|pnpm|yarn) : ;;
            *)
              echo "::error title=Invalid package-manager::Unsupported package-manager '$PACKAGE_MANAGER'. Expected one of: bun, npm, pnpm, yarn."
              exit 1
              ;;
          esac

      - name: Set up Bun
        if: ${{ inputs.package-manager == 'bun' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ inputs.bun-version }}

      - name: Set up Node.js
        if: ${{ inputs.package-manager != 'bun' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Enable Corepack
        if: ${{ inputs.package-manager == 'pnpm' || inputs.package-manager == 'yarn' }}
        run: corepack enable

      - name: Install dependencies
        env:
          INSTALL_CMD: ${{ inputs.install-cmd }}
        run: bash -c "$INSTALL_CMD"

      - name: Format check
        env:
          FORMAT_CHECK_CMD: ${{ inputs.format-check-cmd }}
        run: bash -c "$FORMAT_CHECK_CMD"
