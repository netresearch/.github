name: Greetings

on:
  workflow_call:
    inputs:
      issue-message:
        description: 'Message for first-time issue authors'
        required: false
        type: string
        default: |
          Thanks for opening your first issue! We appreciate you taking the time to report this.
          A maintainer will review your issue soon.
      pr-message:
        description: 'Message for first-time PR authors'
        required: false
        type: string
        default: |
          Thanks for your first pull request! We are excited to have you contribute.
          A maintainer will review your PR soon. Please ensure all CI checks pass.

# CALLER REQUIREMENTS
# ===================
# When calling this reusable workflow, the caller's job-level
# `permissions:` block MUST grant at least this full set, otherwise
# the run fails with `startup_failure` before any job executes
# (GitHub rejects the workflow at startup when the reusable declares
# a permission the caller did not grant). NOTE: setting ANY scope in a
# `permissions:` block forces every UNLISTED scope to `none`, and a job
# that omits `permissions:` inherits the repository default
# (default_workflow_permissions) — so a repo hardened to `read` will
# startup-fail here unless these scopes are granted explicitly.
#
#   jobs:
#     greeting:
#       uses: netresearch/.github/.github/workflows/greetings.yml@main
#       permissions:
#         issues: write
#         pull-requests: write
permissions: {}

jobs:
  greeting:
    name: Greet Contributors
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d # v3.1.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          issue_message: ${{ inputs.issue-message }}
          pr_message: ${{ inputs.pr-message }}
