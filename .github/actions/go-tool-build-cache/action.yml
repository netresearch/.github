name: Pinned Go tool install cache
description: Install gosec or go-licenses with optional compiler/module caches and safe fallback.
inputs:
  tool:
    description: Known tool, gosec or go-licenses.
    required: true
  target:
    description: Existing Go install target at a full immutable commit.
    required: true
  go-version:
    description: Actual version configured by setup-go.
    required: true
outputs:
  key:
    description: Exact cache identity.
    value: ${{ steps.plan.outputs.key }}
  build-cache:
    description: Install-only compilation cache path.
    value: ${{ steps.plan.outputs.build-cache }}
  module-cache:
    description: Install-only module cache path.
    value: ${{ steps.plan.outputs.module-cache }}
  cache-hit:
    description: Whether the exact cache was restored.
    value: ${{ steps.restore.outputs.cache-hit }}
  cache-saveable:
    description: Install used the cache and its compiler matched the configured Go.
    value: ${{ steps.install.outputs.cache-saveable }}
  source-sha256:
    description: Digest of the helper and descriptor actually executed.
    value: ${{ steps.plan.outputs.source-sha256 }}
runs:
  using: composite
  steps:
    - name: Prove cache identity and toolchain eligibility
      id: plan
      continue-on-error: true
      shell: bash
      env:
        TOOL_KIND: ${{ inputs.tool }}
        TOOL_TARGET: ${{ inputs.target }}
        CONFIGURED_GO: ${{ inputs.go-version }}
      run: python3 "$GITHUB_ACTION_PATH/cache.py" prepare
    - name: Restore the exact compilation and module cache
      id: restore
      if: steps.plan.outputs.enabled == 'true'
      continue-on-error: true
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.plan.outputs.key }}
        path: |
          ${{ steps.plan.outputs.build-cache }}
          ${{ steps.plan.outputs.module-cache }}/cache/download
          !${{ steps.plan.outputs.module-cache }}/cache/download/golang.org/toolchain
    - name: Install the same pinned tool, falling back on cache failure
      id: install
      shell: bash
      env:
        TOOL_KIND: ${{ inputs.tool }}
        TOOL_TARGET: ${{ inputs.target }}
        TOOL_CACHE_ENABLED: ${{ steps.plan.outputs.enabled == 'true' && steps.restore.outcome == 'success' && (steps.restore.outputs.cache-matched-key == '' || steps.restore.outputs.cache-matched-key == steps.plan.outputs.key) }}
        TOOL_BUILD_CACHE: ${{ steps.plan.outputs.build-cache }}
        TOOL_MODULE_CACHE: ${{ steps.plan.outputs.module-cache }}
        EXPECTED_GO: ${{ steps.plan.outputs.go-version }}
      run: python3 "$GITHUB_ACTION_PATH/cache.py" install
